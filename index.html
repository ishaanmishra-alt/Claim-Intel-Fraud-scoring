function dayBefore(iso) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

/**
 * Apply a mutation to current use-cases and open a new version.
 * @param {object[]} nextUseCases
 * @param {{ startDate?: string, endDate?: string|null }} [dates]
 * @param {{ stagePassPct?: object, stageMix?: object }} [extras]
 */
function commitConfigChange(nextUseCases, dates = {}, extras = {}) {
  const store = getConfigStore();
  const current = getCurrentConfigVersion(store);
  const startDate = dates.startDate || CONFIG_TODAY;
  const endDate = dates.endDate || null;

  // Close any open/overlapping versions that start before the new one.
  store.versions.forEach((v) => {
    if (v.startDate < startDate && (!v.endDate || v.endDate >= startDate)) {
      v.endDate = dayBefore(startDate);
    }
  });

  const newNumber = Math.max(...store.versions.map((v) => v.number)) + 1;
  const newVersion = withVersionExtras({
    id: Math.max(...store.versions.map((v) => v.id)) + 1,
    number: newNumber,
    startDate,
    endDate,
    useCases: cloneUseCases(nextUseCases),
    stagePassPct: extras.stagePassPct || current.stagePassPct,
    stageMix: extras.stageMix || current.stageMix,
  });

  store.versions.push(newVersion);
  store.currentId = getVersionForDate(CONFIG_TODAY, store).id;
  return persistConfig(store);
}

function resetConfigStore() {
  localStorage.removeItem(CONFIG_KEY);
  localStorage.removeItem(WEIGHTS_KEY);
  return getConfigStore();
}

function saveWeights(weights) {
  const current = getCurrentConfigVersion();
  const next = current.useCases.map((u) => ({
    ...u,
    weight: weights[u.id] ?? u.weight ?? 0,

  return commitConfigChange(next);
}

function formatLongDate(iso) {
  if (!iso) return '—';
  const d = new Date(`${iso}T12:00:00`);
  if (Number.isNaN(d.getTime())) return iso;
  const dd = String(d.getDate()).padStart(2, '0');
  const mon = d.toLocaleString('en-GB', { month: 'short' });
  const yyyy = d.getFullYear();
  return `${dd}-${mon}-${yyyy}`;
}

function isFutureVersion(version, asOf = CONFIG_TODAY) {
  return !!version?.startDate && version.startDate > asOf;
}

function formatVersionLabel(version, { isCurrent = false } = {}) {
  const start = formatLongDate(version.startDate);
  const end = !version.endDate ? 'Present' : formatLongDate(version.endDate);
  const scheduled = isFutureVersion(version) ? ' · Scheduled' : '';
  void isCurrent;
  return `Version ${version.number} (${start} – ${end})${scheduled}`;
}

function normField(value) {
  return String(value || '')
    .trim()
    .toLowerCase()
    .replace(/\s+/g, ' ');
}

function evaluateCheckFromFields(claim, checkId, seeded) {
  switch (checkId) {
    case 1: {
      if (!claim.plate || !claim.policyPlate) return seeded;
      const match = normField(claim.plate) === normField(claim.policyPlate);
      return match
        ? { state: 'pass', evidence: `Claim plate ${claim.plate} matches policy plate ${claim.policyPlate}.` }
        : { state: 'fail', evidence: `Policy plate ${claim.policyPlate} vs claim plate ${claim.plate}` };
    }
    case 2: {
      if (!claim.vin || !claim.policyVin) return seeded;
      const match = normField(claim.vin) === normField(claim.policyVin);
      return match
        ? { state: 'pass', evidence: `VIN ${claim.vin} matches the policy chassis record.` }
        : { state: 'fail', evidence: `Policy VIN ${claim.policyVin} vs claim VIN ${claim.vin}` };
    }
    case 3: {
      if (!claim.lossDate || !claim.policyStart || !claim.policyEnd) return seeded;
      const inForce = claim.lossDate >= claim.policyStart && claim.lossDate <= claim.policyEnd;
      return inForce
        ? { state: 'pass', evidence: `Policy ${claim.policyNumber} in force on ${claim.lossDate}.` }
        : {
            state: 'fail',
            evidence: `Loss date ${claim.lossDate} is outside policy ${claim.policyNumber} (${claim.policyStart} – ${claim.policyEnd}).`,
          };
    }
    case 4: {
      if (!claim.claimant || !claim.policyholder) return seeded;
      const match = normField(claim.claimant) === normField(claim.policyholder);
      return match
        ? { state: 'pass', evidence: `${claim.claimant} matches the policyholder / endorsed driver.` }
        : {
            state: 'fail',
            evidence: `Claimant ${claim.claimant} is not the policyholder ${claim.policyholder}.`,
          };
    }
    case 5: {
      const claimSpec = [claim.vehicleMake, claim.vehicleModel, claim.vehicleColour].filter(Boolean).join(' ');
      const policySpec = [claim.policyMake, claim.policyModel, claim.policyColour].filter(Boolean).join(' ');
      if (!claimSpec || !policySpec) return seeded;
      const match =
        normField(claim.vehicleMake) === normField(claim.policyMake) &&
        normField(claim.vehicleModel) === normField(claim.policyModel) &&
        normField(claim.vehicleColour) === normField(claim.policyColour);
      return match
        ? { state: 'pass', evidence: `Vehicle ${claimSpec} matches the policy schedule.` }
        : { state: 'fail', evidence: `Policy: ${policySpec} · Claim: ${claimSpec}` };
    }
    case 6: {
      if (!claim.lossDate || !claim.policyStart) return seeded;
      const days = daysBetween(claim.policyStart, claim.lossDate);
      return days >= 14
        ? { state: 'pass', evidence: `Loss is ${days} days after policy inception.` }
        : { state: 'fail', evidence: `Loss ${days} days after policy inception (minimum cover: 14 days)` };
    }
    case 8: {
      if (!claim.lossDate || !claim.filedAt) return seeded;
      const days = daysBetween(claim.lossDate, claim.filedAt);
      return days <= 14
        ? { state: 'pass', evidence: `Reported within ${days} day${days === 1 ? '' : 's'} of loss.` }
        : { state: 'fail', evidence: `Reported ${days} days after date of loss` };
    }
    case 14: {
      if (claim.amount == null || claim.sumInsured == null) return seeded;
      return claim.amount <= claim.sumInsured
        ? { state: 'pass', evidence: `Claim ${claim.amount} is within IDV ${claim.sumInsured}.` }
        : {
            state: 'fail',
            evidence: `Claim AED ${Number(claim.amount).toLocaleString('en-US')} exceeds IDV AED ${Number(claim.sumInsured).toLocaleString('en-US')}.`,
          };
    }
    default:
      return seeded;
  }
}

function scoreBand(score) {
  if (score >= 80) return 'green';
  if (score >= 50) return 'yellow';
  return 'red';
}

function isExcludedFromScore(r) {
  return r.state === 'waived' || r.state === 'bypassed';
}

function isWeightPoolRow(r) {
  return !r.hardFail && !isExcludedFromScore(r);
}

/** Remaining non-critical use-cases in a stage share 100%. Criticals are pass/fail gates. */
function attachNormalizedWeights(results) {
  CLAIM_STAGES.forEach((stage) => {
    const stageRows = results.filter((r) => r.stage === stage.id);
    const live = stageRows.filter(isWeightPoolRow);
    const total = live.reduce((sum, r) => sum + (Number(r.weight) || 0), 0);
    live.forEach((r) => {
      r.configuredWeight = Number(r.weight) || 0;
      r.displayWeight = total ? Math.round((r.configuredWeight / total) * 100) : 0;
    });
    const shown = live.reduce((sum, r) => sum + r.displayWeight, 0);
    if (live.length && shown !== 100) {
      const richest = live.reduce((a, b) => (b.displayWeight >= a.displayWeight ? b : a));
      richest.displayWeight += 100 - shown;
    }
    stageRows
      .filter((r) => !isWeightPoolRow(r))
      .forEach((r) => {
        r.configuredWeight = Number(r.weight) || 0;
        r.displayWeight = 0;
      });
  });
}

function scoreWeight(r) {
  return Number(r.displayWeight ?? r.weight) || 0;
}

function scoreWeightedGroup(results) {
  const evaluable = results.filter(isWeightPoolRow);
  const passed = evaluable.filter((r) => r.state === 'pass');
  const activeWeight = evaluable.reduce((sum, r) => sum + scoreWeight(r), 0);
  const earnedWeight = passed.reduce((sum, r) => sum + scoreWeight(r), 0);

  if (activeWeight === 0) {
    return { score: 0, tier: 'red', activeWeight: 0, earnedWeight: 0, evaluable: 0 };
  }
  const score = Math.round((earnedWeight / activeWeight) * 100);
  return {
    score: Math.min(100, Math.max(0, score)),
    tier: scoreBand(score),
    activeWeight,
    earnedWeight,
    evaluable: evaluable.length,
  };
}

/**
 * Stage-based scoring using the active config use-case set.
 * Critical use-cases are pass/fail gates and do not take weightage.
 * If they pass, remaining use-cases in the stage share 100%.
 * If any critical fails, the stage is Fail and the claim does not move on.
 * There is no overall / cumulative score — claim.score is the current stage score.
 */
function scoreClaim(claim, weights = DEFAULT_WEIGHTS, activeUseCases = null, options = {}) {
  const active = activeUseCases || getActiveUseCases();
  const activeIds = new Set(active.map((u) => u.id));
  const metaById = Object.fromEntries(active.map((u) => [u.id, u]));
  const defById = Object.fromEntries(USE_CASE_LIBRARY.map((d) => [d.id, d]));
  const passPct = options.stagePassPct || getStagePassPct();

  const waivedIds = new Set(claim.waivedCheckIds || []);
  const bypassedIds = new Set(claim.bypassedCheckIds || []);
  const dispositions = claim.dispositions || {};

  const results = claim.checks
    .filter((c) => activeIds.has(c.checkId))
    .map((c) => {
      const def = defById[c.checkId];
      const meta = metaById[c.checkId];
      const hardFail = !!(meta?.hardFail ?? def.hardFail) || (meta?.riskCategory || def.riskCategory) === 'critical';
      const evaluated = evaluateCheckFromFields(claim, c.checkId, { state: c.state, evidence: c.evidence });
      let state = evaluated.state === 'cant_evaluate' ? 'fail' : evaluated.state;
      let evidence = evaluated.evidence;
      if (bypassedIds.has(c.checkId)) {
        state = 'bypassed';
        evidence = `${evaluated.evidence} · Bypassed — excluded from this stage. Remaining weights are normalised to 100%.`;
      } else if (waivedIds.has(c.checkId)) {
        state = 'waived';
        evidence = `${evaluated.evidence} · Waived as a false positive — data already correct.`;
      } else {
        const missingDocs = missingRequiredDocsForCheck(claim, c.checkId);
        if (missingDocs.length && state !== 'fail') {
          state = 'fail';
          evidence = `Failed — required document missing: ${missingDocs.map((d) => d.name).join(', ')}.`;
        } else {
          const onFile = uploadedDocsForCheck(claim, c.checkId);
          if (onFile.length && !/Document on file:/i.test(evidence)) {
            evidence = `${evidence} · Document on file: ${onFile.map((d) => d.name).join(', ')}.`;
          }
        }
      }
      const disposition = dispositions[c.checkId] || null;
      const weight = hardFail ? 0 : Number(weights[c.checkId] ?? meta?.weight ?? def.weight ?? 0);
      return {
        ...c,
        state,
        evidence,
        name: meta?.name || def.name,
        code: meta?.code || checkCode(def.id),
        description: meta?.description || def.description,
        category: def.category,
        stage: meta?.stage || def.stage,
        riskCategory: meta?.riskCategory || def.riskCategory,
        hardFail,
        weight,
        waived: state === 'waived',
        bypassed: state === 'bypassed',
        disposition,
      };
    });

  attachNormalizedWeights(results);

  const stageScores = [];
  let heldAtStage = null;
  let holdReason = null;

  for (const stage of CLAIM_STAGES) {
    const stageResults = results.filter((r) => r.stage === stage.id);
    const stageHardFails = stageResults.filter((r) => r.hardFail && r.state === 'fail');
    const weighted = scoreWeightedGroup(stageResults);
    const criticalFailed = stageHardFails.length > 0;
    const score = criticalFailed ? 0 : weighted.evaluable === 0 ? 100 : weighted.score;
    const mark = Number(passPct[stage.id] ?? DEFAULT_STAGE_PASS[stage.id] ?? 70);
    const passedStage = !criticalFailed && score >= mark;
    const row = {
      stageId: stage.id,
      stageName: stage.name,
      score,
      tier: criticalFailed ? 'red' : !passedStage ? 'red' : scoreBand(score),
      activeWeight: weighted.activeWeight,
      earnedWeight: weighted.earnedWeight,
      evaluable: weighted.evaluable,
      hardFailCount: stageHardFails.length,
      softFailCount: stageResults.filter((r) => !r.hardFail && r.state === 'fail').length,
      failCount: stageResults.filter((r) => r.state === 'fail').length,
      cantEvaluateCount: 0,
      checkCount: stageResults.length,
      passMark: mark,
      passed: passedStage,
      criticalFailed,
    };
    if (stageResults.length > 0) stageScores.push(row);

    if (criticalFailed) {
      heldAtStage = stage.id;
      holdReason = 'critical';
      break;
    }
    if (!hasStageDocsComplete(claim, stage.id)) {
      heldAtStage = stage.id;
      holdReason = 'docs';
      break;
    }
    if (stage.id === 'assessment' && !claim.surveyorSubmitted) {
      heldAtStage = stage.id;
      holdReason = 'surveyor';
      break;
    }
  }

  const scoredStageIds = new Set(stageScores.map((s) => s.stageId));
  const visibleResults = results.filter((r) => scoredStageIds.has(r.stage));
  const hardFails = visibleResults.filter((r) => r.hardFail && r.state === 'fail');
  const scored = visibleResults.filter((r) => !isExcludedFromScore(r));
  const failed = scored.filter((r) => r.state === 'fail');
  const passed = scored.filter((r) => r.state === 'pass');

  const workflowStage = getClaimWorkflowStage(claim, stageScores);
  const currentStage = stageScores.find((s) => s.stageId === workflowStage) || stageScores[0] || null;
  const contextScore = currentStage ? currentStage.score : 0;
  const forcedRed = (currentStage?.hardFailCount || 0) > 0;
  const tier = currentStage?.tier || (forcedRed ? 'red' : scoreBand(contextScore));

  return {
    score: contextScore,
    tier,
    forcedRed,
    hasOverride: waivedIds.size > 0 || bypassedIds.size > 0,
    hardFails,
    results: visibleResults,
    stageScores,
    workflowStage,
    heldAtStage,
    holdReason,
    summary: {
      hardFailCount: hardFails.length,
      softFailCount: failed.filter((r) => !r.hardFail).length,
      softPassCount: passed.filter((r) => !r.hardFail).length,
      failCount: failed.length,
      passCount: passed.length,
      softTotal: scored.filter((r) => !r.hardFail).length,
      cantEvaluateCount: 0,
    },
  };
}

function scoreAllClaims(weights, activeUseCases) {
  const w = weights || getStoreWeights();
  const active = activeUseCases || getActiveUseCases();
  const stagePassPct = getStagePassPct();
  return RAW_CLAIMS.map((claim) => {
    const scored = scoreClaim(claim, w, active, { stagePassPct });
    return { ...claim, ...scored };
  });
}

/** Aggregate fail counts per use-case across a claim set */
function useCaseFailStats(claims) {
  const active = getActiveUseCases();
  const defById = Object.fromEntries(USE_CASE_LIBRARY.map((d) => [d.id, d]));
  const stats = active.map((def) => ({
    checkId: def.id,
    code: checkCode(def.id),
    name: def.name,
    stage: def.stage,
    hardFail: def.hardFail,
    fail: 0,
    pass: 0,
    cant_evaluate: 0,
    total: 0,
  }));
  const byId = Object.fromEntries(stats.map((s) => [s.checkId, s]));

  claims.forEach((claim) => {
    claim.results.forEach((r) => {
      const row = byId[r.checkId];
      if (!row) return;
      if (r.state === 'waived' || r.state === 'bypassed') return;
      row.total += 1;
      if (r.state === 'fail' || r.state === 'cant_evaluate') row.fail += 1;
      else if (r.state === 'pass') row.pass += 1;
    });
  });

  return stats
    .map((s) => ({
      ...s,
      stageName: CLAIM_STAGES.find((st) => st.id === s.stage)?.name || s.stage,
      failRate: s.total ? Math.round((s.fail / s.total) * 100) : 0,
      category: defById[s.checkId]?.category,
    }))
    .sort((a, b) => b.fail - a.fail || b.failRate - a.failRate);
}

function tierLabel(tier, extra) {
  if (extra?.forcedRed || extra?.criticalFailed) return 'Fail';
  if (tier === 'red') return 'High risk';
  if (tier === 'yellow') return 'Medium risk';
  return 'Pass';
}

function formatAED(amount) {
  return (
    'AED ' +
    Number(amount).toLocaleString('en-AE', {
      maximumFractionDigits: 0,
    })
  );
}

function formatDate(iso) {
  if (!iso) return '—';
  const raw = String(iso).slice(0, 10);
  const d = new Date(`${raw}T12:00:00`);
  if (Number.isNaN(d.getTime())) return String(iso);
  const dd = String(d.getDate()).padStart(2, '0');
  const mon = d.toLocaleString('en-GB', { month: 'short' });
  const yyyy = d.getFullYear();
  return `${dd}-${mon}-${yyyy}`;
}

function formatScore(score) {
  const n = Number(score);
  if (!Number.isFinite(n)) return '—';
  return `${Math.round(n)}%`;
}

function formatStageScore(stage) {
  if (!stage) return '—';
  if (stage.criticalFailed) return 'Fail';
  return formatScore(stage.score);
}

function formatClaimScore(claim) {
  if (!claim) return '—';
  if (claim.forcedRed) return 'Fail';
  const current = (claim.stageScores || []).find((s) => s.stageId === claim.workflowStage);
  if (current?.criticalFailed) return 'Fail';
  return formatScore(claim.score);
}

function formatClaimAmount(claim) {
  if (!claim || getClaimWorkflowStage(claim) !== 'settlement') return '—';
  return formatAED(claim.amount);
}

function sortChecksForDisplay(results) {
  const stageOrder = Object.fromEntries(CLAIM_STAGES.map((s, i) => [s.id, i]));
  const rank = (r) => {
    if (r.state === 'fail' && r.hardFail) return 0;
    if (r.state === 'fail' || r.state === 'cant_evaluate') return 1;
    if (r.state === 'waived' || r.state === 'bypassed') return 3;
    return 2;
  };
  return [...results].sort((a, b) => {
    const sa = stageOrder[a.stage] ?? 99;
    const sb = stageOrder[b.stage] ?? 99;
    if (sa !== sb) return sa - sb;
    const ra = rank(a);
    const rb = rank(b);
    if (ra !== rb) return ra - rb;
    if (ra === 1) return (b.weight || 0) - (a.weight || 0);
    return a.checkId - b.checkId;
  });
}

function canAccess(role, feature) {
  const matrix = {
    queue: ['claim_user', 'claim_head', 'admin', 'fiu', 'surveyor'],
    claim: ['claim_user', 'claim_head', 'admin', 'fiu', 'surveyor'],
    dashboard: ['claim_head', 'admin', 'fiu'],
    report: ['claim_head', 'admin', 'fiu'],
    config: ['admin', 'fiu'],
  };
  return (matrix[feature] || []).includes(role);
}

function homeRouteForRole(role) {
  if (role === 'admin' || role === 'fiu') return '#/dashboard';
  return '#/queue';
}

/** Restrict a scored claim to selected stages (surveyor sees prior-stage scores until submit). */
function withVisibleStages(scored, stageIds) {
  const idSet = new Set(stageIds);
  const results = (scored.results || []).filter((r) => idSet.has(r.stage));
  const stageScores = (scored.stageScores || []).filter((s) => idSet.has(s.stageId));
  const hardFails = results.filter((r) => r.hardFail && r.state === 'fail');
  const scoredRows = results.filter((r) => r.state !== 'waived' && r.state !== 'bypassed');
  const last = stageIds[stageIds.length - 1] || scored.workflowStage;
  const currentStage = stageScores.find((s) => s.stageId === last) || stageScores[0] || null;
  const contextScore = currentStage ? currentStage.score : 0;
  const forcedRed = (currentStage?.hardFailCount || 0) > 0;
  return {
    ...scored,
    results,
    stageScores,
    hardFails,
    score: contextScore,
    tier: forcedRed ? 'red' : scoreBand(contextScore),
    forcedRed,
    summary: {
      hardFailCount: hardFails.length,
      softFailCount: scoredRows.filter((r) => !r.hardFail && r.state === 'fail').length,
      softPassCount: scoredRows.filter((r) => !r.hardFail && r.state === 'pass').length,
      failCount: scoredRows.filter((r) => r.state === 'fail').length,
      passCount: scoredRows.filter((r) => r.state === 'pass').length,
      softTotal: scoredRows.filter((r) => !r.hardFail).length,
      cantEvaluateCount: 0,
    },
  };
}

/* ===== js/filters.js ===== */
/** Prototype “today” for Dashboard and Report (not the config version date). */
const PROTOTYPE_TODAY = '2026-08-11';

const PERIOD_PRESETS = [
  { id: 'yesterday', label: 'Yesterday' },
  { id: '7', label: 'Last 7 days' },
  { id: '30', label: 'Last 30 days' },
  { id: 'mtd', label: 'MTD' },
  { id: 'quarter', label: 'This quarter' },
  { id: 'custom', label: 'Custom' },
];

const CLAIM_TYPE_OPTIONS = [
  { id: 'all', label: 'All types' },
  { id: 'own_damage', label: 'Own damage' },
  { id: 'tp', label: 'Third party' },
  { id: 'theft', label: 'Theft' },
  { id: 'total_loss', label: 'Total loss' },
];

const LEDGER_CHANGE_TYPES = ['Score', 'Document', 'Exception', 'Stage', 'Assignment', 'Review'];

const TX_MAX_DAYS = 31;
const TX_LIST_CAP = 24;

function claimTypeLabel(id) {
  return CLAIM_TYPE_OPTIONS.find((t) => t.id === id)?.label || id || '—';
}

function periodLabel(period) {
  return PERIOD_PRESETS.find((p) => p.id === period)?.label || 'Selected period';
}

function addDays(iso, days) {
  const d = new Date(`${iso}T12:00:00`);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function startOfMonth(iso) {
  return `${iso.slice(0, 8)}01`;
}

function startOfQuarter(iso) {
  const month = Number(iso.slice(5, 7));
  const qStart = month <= 3 ? '01' : month <= 6 ? '04' : month <= 9 ? '07' : '10';
  return `${iso.slice(0, 4)}-${qStart}-01`;
}

function daysInclusive(from, to) {
  const a = new Date(`${from}T12:00:00`);
  const b = new Date(`${to}T12:00:00`);
  return Math.round((b.getTime() - a.getTime()) / 86400000) + 1;
}

function resolvePeriodRange(period, { from, to, today = PROTOTYPE_TODAY } = {}) {
  if (period === 'custom' && from && to) {
    return from <= to ? { from, to } : { from: to, to: from };
  }
  if (period === 'yesterday') {
    const y = addDays(today, -1);
    return { from: y, to: y };
  }
  if (period === '7') return { from: addDays(today, -6), to: today };
  if (period === '30') return { from: addDays(today, -29), to: today };
  if (period === 'mtd') return { from: startOfMonth(today), to: today };
  if (period === 'quarter') return { from: startOfQuarter(today), to: today };
  return { from: addDays(today, -6), to: today };
}

function formatRangeLabel(range) {
  if (!range?.from || !range?.to) return '';
  if (range.from === range.to) return formatDate(range.from);
  return `${formatDate(range.from)} – ${formatDate(range.to)}`;
}

function filterClaimUniverse(claims, filters = {}) {
  const {
    period = '7',
    branch = 'All branches',
    claimType = 'all',
    stage = 'all',
    tier = 'all',
    from,
    to,
  } = filters;
  const range = resolvePeriodRange(period, { from, to });
  return claims.filter((c) => {
    if (!c.filedAt || c.filedAt < range.from || c.filedAt > range.to) return false;
    if (branch && branch !== 'All branches' && c.branch !== branch) return false;
    if (claimType && claimType !== 'all' && c.claimType !== claimType) return false;
    if (stage && stage !== 'all' && getClaimWorkflowStage(c) !== stage) return false;
    if (tier === 'red' || tier === 'high') {
      if (c.tier !== 'red') return false;
    }
    return true;
  });
}

function describeClaimScope(claims, filters = {}, { includeValue = false } = {}) {
  const range = resolvePeriodRange(filters.period, { from: filters.from, to: filters.to });
  const period = filters.period === 'custom' ? formatRangeLabel(range) : periodLabel(filters.period);
  const branch = filters.branch && filters.branch !== 'All branches' ? filters.branch : 'All branches';
  const parts = [`${claims.length} claim${claims.length === 1 ? '' : 's'} scored`, period, branch];
  if (includeValue) {
    const value = claims.reduce((sum, c) => sum + (c.amount || 0), 0);
    parts.push(formatAED(value));
  }
  if (filters.claimType && filters.claimType !== 'all') parts.push(claimTypeLabel(filters.claimType));
  if (filters.stage && filters.stage !== 'all') {
    const name = WORKFLOW_STAGES.find((s) => s.id === filters.stage)?.name || filters.stage;
    parts.push(name);
  }
  if (filters.tier === 'red' || filters.tier === 'high') parts.push('High risk');
  return parts.join(' · ');
}

function snapshotMetrics(claims) {
  const count = claims.length;
  const value = claims.reduce((sum, c) => sum + (c.amount || 0), 0);
  const red = claims.filter((c) => c.tier === 'red');
  const failed = claims.filter((c) => (c.summary?.failCount || c.summary?.softFailCount || 0) > 0);
  const hardFails = claims.reduce((n, c) => n + (c.hardFails?.length || 0), 0);
  const waived = claims.reduce((n, c) => n + (c.waivedCheckIds?.length || 0), 0);
  const pending = claims.reduce((n, c) => n + getPendingExceptions(c).length, 0);
  return {
    count,
    value,
    redCount: red.length,
    redValue: red.reduce((sum, c) => sum + (c.amount || 0), 0),
    highRiskRate: count ? Math.round((red.length / count) * 100) : 0,
    failCount: failed.length,
    failRate: count ? Math.round((failed.length / count) * 100) : 0,
    cantEvalCount: 0,
    cantEvalRate: 0,
    hardFails,
    waived,
    pending,
  };
}

function ledgerChangeType(row) {
  const raw = row.changeType || '';
  if (raw === 'Upload' || row.entity === 'Document') return 'Document';
  if (raw === 'Status' || row.entity === 'Stage') return 'Stage';
  if (raw === 'Score') return 'Score';
  if (raw === 'Exception') return 'Exception';
  if (raw === 'Assignment') return 'Assignment';
  if (raw === 'Review') return 'Review';
  return raw || 'Update';
}

/** Action column: only human actions. System events such as scoring stay blank. */
function formatLedgerAction(row) {
  const action = String(row.action || '').trim();
  const automatic =
    row.user === 'Claim Intel' ||
    row.changeType === 'Score' ||
    action === 'Scored' ||
    action === 'Created';
  if (automatic || !action) return '—';
  return action;
}

function formatLedgerDelta(row) {
  const field = row.field && row.field !== '—' ? row.field : row.action || 'Change';
  const oldV = row.oldValue ?? '—';
  const newV = row.newValue ?? '—';
  if (oldV === '—' && newV !== '—') return `${field} ${newV}`;
  if (newV === '—' && oldV !== '—') return `${field} ${oldV}`;
  return `${field} ${oldV} → ${newV}`;
}

function flattenClaimLedger(claims) {
  const rows = [];
  claims.forEach((claim) => {
    getClaimAuditLog(claim).forEach((entry) => {
      rows.push({
        ...entry,
        claimId: claim.id,
        fnolNumber: entry.fnolNumber || claim.fnolNumber || claim.id.replace(/^CLM-/, 'FNOL-'),
        registrationNo: entry.registrationNo || claim.id,
        policyNumber: claim.policyNumber || '—',
        score: claim.score,
        forcedRed: !!claim.forcedRed,
        workflowStage: getClaimWorkflowStage(claim),
        workflowStageName: WORKFLOW_STAGES.find((s) => s.id === getClaimWorkflowStage(claim))?.name || getClaimWorkflowStage(claim),
        ledgerType: ledgerChangeType(entry),
        userAction: formatLedgerAction(entry),
        delta: formatLedgerDelta(entry),
      });
    });
  });
  return rows;
}

function inRange(iso, range) {
  return iso && range?.from && range?.to && iso >= range.from && iso <= range.to;
}

function filterLedgerRows(rows, { range, changeType = 'all', user = 'all' } = {}) {
  let list = rows.filter((r) => inRange(r.date, range));
  list.sort((a, b) => `${b.date}T${b.time}`.localeCompare(`${a.date}T${a.time}`));
  const seenScore = new Set();
  list = list.filter((r) => {
    if (r.ledgerType !== 'Score') return true;
    if (seenScore.has(r.claimId)) return false;
    seenScore.add(r.claimId);
    return true;
  });
  if (changeType && changeType !== 'all') list = list.filter((r) => r.ledgerType === changeType);
  if (user && user !== 'all') list = list.filter((r) => r.user === user);
  return list;
}

function ledgerRangeState(range) {
  if (!range?.from || !range?.to) return { ok: false, reason: 'set-dates', days: 0 };
  const days = daysInclusive(range.from, range.to);
  if (days > TX_MAX_DAYS) return { ok: false, reason: 'too-wide', days };
  return { ok: true, reason: '', days };
}

function capLedgerRows(rows, cap = TX_LIST_CAP) {
  return { shown: rows.slice(0, cap), total: rows.length, cap };
}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function stateLabel(state) {
  if (state === 'pass') return 'Pass';
  if (state === 'fail') return 'Fail';
  if (state === 'bypassed') return 'Bypassed';
  if (state === 'waived') return 'Waived';
  return state || '—';
}

function bindVersionPopup(root, claims, onChange, stateKey = 'versionKey') {
  const close = () => onChange({ [stateKey]: null });
  root.querySelectorAll('[data-open-version]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      onChange({ [stateKey]: `${btn.dataset.openVersion}|${btn.dataset.version}` });
    });
  });
  root.querySelectorAll('[data-action="close-version-modal"]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      close();
    });
  });
}

function parseVersionKey(key) {
  if (!key) return null;
  const idx = String(key).indexOf('|');
  if (idx < 0) return null;
  return { claimId: key.slice(0, idx), version: key.slice(idx + 1) };
}

function renderOpenVersionPopup(claims, versionKey) {
  const parsed = parseVersionKey(versionKey);
  if (!parsed) return '';
  const claim = claims.find((c) => c.id === parsed.claimId);
  if (!claim) return '';
  return versionPopupHtml(claim, parsed.version);
}

function renderQueue(root, session, claims, state, onChange) {
  const isSurveyor = session.role === 'surveyor';
  const isClaimUser = session.role === 'claim_user';
  const canAudit = canViewClaimAudit(session.role);
  const { scope, sort, stage = 'all', auditClaimId = null, versionKey = null } = state;
  const pool = claims;
  const mine = pool.filter((c) => c.assignedTo === session.userId);
  const scoped = isSurveyor || isClaimUser || scope === 'all' ? pool : mine;
  const list = stage === 'all' ? scoped : scoped.filter((c) => getClaimWorkflowStage(c) === stage);

  const sorted = [...list].sort((a, b) => {
    if (sort === 'deadline') {
      if (a.dueInDays !== b.dueInDays) return a.dueInDays - b.dueInDays;
      return a.score - b.score;
    }
    const tierRank = { red: 0, yellow: 1, green: 2 };
    if (tierRank[a.tier] !== tierRank[b.tier]) return tierRank[a.tier] - tierRank[b.tier];
    if (a.score !== b.score) return a.score - b.score;
    return a.dueInDays - b.dueInDays;
  });

  const counts = {
    red: list.filter((c) => c.tier === 'red').length,
    yellow: list.filter((c) => c.tier === 'yellow').length,
    green: list.filter((c) => c.tier === 'green').length,
  };

  const title = isSurveyor || isClaimUser ? 'Claims' : scope === 'mine' ? 'My claims' : 'All claims';
  const subtitle =
    isSurveyor || isClaimUser
      ? `${list.length} claim${list.length === 1 ? '' : 's'} · filter by claim stage`
      : scope === 'mine'
        ? `${list.length} assigned to you · already scored`
        : `${list.length} claims in portfolio · already scored`;

  const content = `
    <div class="page-header">
      <div>
        <h1>${title} <span style="color:var(--text-muted);font-weight:500;font-size:1.1rem">(${list.length})</span></h1>
        <p class="page-subtitle">${subtitle}</p>
      </div>
      ${
        isSurveyor || isClaimUser
          ? ''
          : `<div class="segmented" role="group" aria-label="Claim scope">
        <button type="button" data-scope="mine" class="${scope === 'mine' ? 'active' : ''}">My claims</button>
        <button type="button" data-scope="all" class="${scope === 'all' ? 'active' : ''}">All claims</button>
      </div>`
      }
    </div>

    <div class="tier-strip">
      <div class="tier-stat"><span class="dot red"></span><strong>${counts.red}</strong> High risk</div>
      <div class="tier-stat"><span class="dot yellow"></span><strong>${counts.yellow}</strong> Medium risk</div>
      <div class="tier-stat"><span class="dot green"></span><strong>${counts.green}</strong> Pass</div>
    </div>

    <div class="toolbar">
      ${
        isClaimUser
          ? ''
          : `<div>
        <span class="toolbar-label">Sort</span>
        <div class="segmented" role="group" aria-label="Sort mode">
          <button type="button" data-sort="risk" class="${sort === 'risk' ? 'active' : ''}">Highest risk</button>
          <button type="button" data-sort="deadline" class="${sort === 'deadline' ? 'active' : ''}">Deadline</button>
        </div>
      </div>`
      }
      <div>
        <span class="toolbar-label">Claim stage</span>
        <select id="queue-stage-filter" aria-label="Filter by claim stage">
          <option value="all" ${stage === 'all' ? 'selected' : ''}>All stages</option>
          ${WORKFLOW_STAGES.map(
            (s) =>
              `<option value="${s.id}" ${stage === s.id ? 'selected' : ''}>${s.name}</option>`
          ).join('')}
        </select>
      </div>
    </div>

    <div class="claims-list ${canAudit ? 'has-audit' : ''}">
      <div class="claims-list-head" aria-hidden="true">
        ${canAudit ? '<span class="h-audit"></span>' : ''}
        <span class="h-score"></span>
        <span class="h-claim">Claim</span>
        <span class="h-amount">Amount</span>
        <span class="h-risk">Risk</span>
        <span class="h-stage">Claim Stage</span>
        <span class="h-due">Deadline</span>
      </div>
      ${
        sorted.length === 0
          ? `<div class="empty-state">No claims in this view.</div>`
          : sorted
              .map((c) => {
                const dueClass = c.dueInDays <= 2 ? 'urgent' : '';
                const dueText =
                  c.dueInDays < 0
                    ? `overdue ${Math.abs(c.dueInDays)}d`
                    : c.dueInDays === 0
                      ? 'due today'
                      : `due in ${c.dueInDays}d`;
                const workflow = getClaimWorkflowStage(c);
                const open = canAudit && auditClaimId === c.id;
                const row = `
              <div class="score-circle sm ${c.tier}${c.forcedRed ? ' is-fail-text' : ''}">${formatClaimScore(c)}</div>
              <div class="claim-main">
                <div class="claim-id-line">
                  <span class="claim-id">${formatClaimRef(c)}</span>
                  ${c.forcedRed ? `<span class="tag critical">Stage fail</span>` : ''}
                  ${(c.bypassedCheckIds || []).length ? `<span class="tag override">Bypassed</span>` : ''}
                </div>
                <div class="claim-name">${c.claimant}</div>
              </div>
              <div class="claim-amount">${formatClaimAmount(c)}</div>
              <div class="claim-tier ${c.tier}">${tierLabel(c.tier, c)}</div>
              <div class="claim-stage-cell">${stageDisplayName(workflow)}</div>
              <div class="due-badge ${dueClass}">${dueText}</div>
            `;
                if (!canAudit) {
                  return `<button type="button" class="claim-row" data-claim-id="${c.id}">${row}</button>`;
                }
                return `
            <article class="claim-item ${open ? 'is-open' : ''}">
              <div class="claim-row-line">
                <button
                  type="button"
                  class="audit-toggle ${open ? 'is-open' : ''}"
                  data-audit-toggle="${c.id}"
                  aria-expanded="${open ? 'true' : 'false'}"
                  aria-controls="audit-${c.id}"
                  aria-label="Version audit for ${c.id}"
                >${iconChevron()}</button>
                <button type="button" class="claim-row" data-claim-id="${c.id}">${row}</button>
              </div>
              ${
                open
                  ? `<div class="claim-audit" id="audit-${c.id}">${auditTableHtml(c)}</div>`
                  : `<div class="claim-audit" id="audit-${c.id}" hidden></div>`
              }
            </article>
          `;
              })
              .join('')
      }
    </div>
    ${canAudit ? renderOpenVersionPopup(claims, versionKey) : ''}
  `;

  root.innerHTML = renderShell(session, '#/queue', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  root.querySelectorAll('[data-scope]').forEach((btn) => {
    btn.addEventListener('click', () => onChange({ ...state, scope: btn.dataset.scope }));
  });
  root.querySelectorAll('[data-sort]').forEach((btn) => {
    btn.addEventListener('click', () => onChange({ ...state, sort: btn.dataset.sort }));
  });
  root.querySelector('#queue-stage-filter')?.addEventListener('change', (e) => {
    onChange({ ...state, stage: e.target.value });
  });
  root.querySelectorAll('[data-audit-toggle]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.auditToggle;
      onChange({ ...state, auditClaimId: state.auditClaimId === id ? null : id, versionKey: null });
    });
  });
  root.querySelectorAll('[data-claim-id]').forEach((btn) => {
    btn.addEventListener('click', () => {
      location.hash = `#/claim/${btn.dataset.claimId}`;
    });
  });
  if (canAudit) {
    bindVersionPopup(root, claims, (partial) => onChange({ ...state, ...partial }), 'versionKey');
  }
}

/* ===== js/views/claim.js ===== */
function stateIcon(state) {
  if (state === 'pass') return iconCheck();
  if (state === 'fail') return iconX();
  if (state === 'waived' || state === 'bypassed') {
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
  }
  return iconAlert();
}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function weightCellHtml(r, stageHasExcluded) {
  if (r.state === 'bypassed' || r.state === 'waived') {
    return `<span class="check-weight-excluded" title="Excluded from this stage’s score">—</span>`;
  }
  if (r.hardFail) {
    return `<span class="check-weight-gate" title="Critical use-cases are pass / fail only">Pass / fail</span>`;
  }
  const shown = r.displayWeight ?? r.weight ?? 0;
  const configured = r.configuredWeight ?? r.weight ?? 0;
  if (stageHasExcluded && shown !== configured) {
    return `${shown}% <span class="check-weight-was">was ${configured}%</span>`;
  }
  return `${shown}%`;
}

function exceptionBlockHtml(result, session) {
  if (session.role === 'surveyor') return '';
  const bits = [];
  if (result.state === 'bypassed') {
    bits.push(`<span class="tag override">Bypassed</span>`);
    bits.push(
      session.role === 'claim_user'
        ? `<p class="exception-note">Excluded from this stage.</p>`
        : `<p class="exception-note">Excluded from this stage. Remaining use-case weights are normalised to 100%.</p>`
    );
  }
  const buttons = [];
  if (result.state === 'fail') {
    buttons.push(
      `<button type="button" class="btn btn-sm btn-primary" data-action="request-bypass" data-check-id="${result.checkId}">Bypass</button>`
    );
  }
  if (!bits.length && !buttons.length) return '';
  return `
    <div class="exception-block">
      ${bits.join('')}
      ${buttons.length ? `<div class="exception-actions">${buttons.join('')}</div>` : ''}
    </div>
  `;
}

function requiredTag(def) {
  if (def.required === 'optional') return `<span class="tag doc-optional">Optional</span>`;
  if (def.required === 'conditional') return `<span class="tag doc-conditional">Conditional</span>`;
  return `<span class="tag doc-required">Required</span>`;
}

function docStatusLabel(status) {
  if (status === 'uploaded') return 'Uploaded';
  if (status === 'rejected') return 'Rejected';
  if (status === 'waived') return 'Waived';
  if (status === 'already_on_file') return 'Already on file';
  return 'Missing';
}

function docThumb(row) {
  const { def, rec, displayStatus } = row;
  if (displayStatus === 'already_on_file') {
    return `<div class="doc-chip on-file" title="Already on file">On file</div>`;
  }
  if (displayStatus === 'waived') {
    return `<div class="doc-chip waived">Waived</div>`;
  }
  if (displayStatus === 'missing') {
    return `<div class="doc-chip missing">${def.kind === 'pdf' ? 'PDF' : 'IMG'}</div>`;
  }
  const isPdf = def.kind === 'pdf' || (rec.filename && rec.filename.toLowerCase().endsWith('.pdf'));
  if (isPdf) {
    return `<div class="doc-chip pdf" title="${rec.filename || ''}"><span>PDF</span><span class="doc-chip-name">${rec.filename || 'Document.pdf'}</span></div>`;
  }
  return `<div class="doc-thumb" title="${rec.filename || rec.thumb || ''}"><span>${rec.thumb || 'Photo'}</span></div>`;
}

function documentChecklistHtml(claim, stageId, { readOnly = false } = {}) {
  const rows = getStageDocumentRows(claim, stageId);
  if (!rows.length) return '';
  return `
    <details class="doc-disclosure">
      <summary>Documents</summary>
      <div class="doc-checklist">
      ${rows
        .map((row) => {
          const needsAttention =
            row.displayStatus === 'missing' || row.displayStatus === 'rejected';
          const clickable = !readOnly && needsAttention;
          const statusNote =
            row.displayStatus === 'already_on_file'
              ? 'Captured at an earlier stage — not requested again.'
              : row.rec.note || '';
          return `
            <${clickable ? 'button type="button"' : 'div'}
              class="doc-row ${row.displayStatus}${clickable ? ' is-action' : ''}${
                needsAttention ? ' is-highlight' : ''
              }"
              ${clickable ? `data-action="upload-doc" data-doc-id="${row.def.id}"` : ''}
            >
              <div class="doc-row-main">
                <div class="doc-row-title">
                  <span class="doc-name">${row.def.name}${
                    row.def.minCount > 1 ? ` <span class="doc-min">(min ${row.def.minCount})</span>` : ''
                  }</span>
                  ${requiredTag(row.def)}
                  <span class="doc-status ${row.displayStatus}">${docStatusLabel(row.displayStatus)}</span>
                </div>
                ${statusNote ? `<p class="doc-note">${statusNote}</p>` : ''}
                <p class="doc-why">Why we need this: ${row.def.why}</p>
              </div>
              ${docThumb(row)}
            </${clickable ? 'button' : 'div'}>
          `;
        })
        .join('')}
      </div>
    </details>
  `;
}

function stageHoldMessage(claim, stageId) {
  const scored = (claim.stageScores || []).some((s) => s.stageId === stageId);
  if (scored) return '';
  const heldName = stageDisplayName(claim.heldAtStage || claim.workflowStage);
  if (claim.holdReason === 'critical') {
    return `This stage is not scored. A critical use-case failed at ${heldName}. The claim cannot move on unless that check is bypassed and approved.`;
  }
  if (claim.holdReason === 'docs') {
    return `This stage is not scored until required ${heldName} documents are on file.`;
  }
  if (claim.holdReason === 'surveyor') {
    return `This stage is not scored until Assessment is submitted.`;
  }
  return `This stage is not scored yet. The claim is still at ${heldName}.`;
}

          </div>
          <h3 class="drawer-section-title">Stage scores</h3>

function renderClaimDetail(
  root,
  session,
  claim,
  filter,
  onFilter,
  { drawerOpen = false, selectedStage = null, exceptionNotice = null } = {}
) {
  if (!claim) {
    root.innerHTML = renderShell(
      session,
      '#/queue',
      `<div class="empty-state">Claim not found. <a href="#/queue">Back to queue</a></div>`
    );
    root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
    return;
  }

  const isSurveyor = session.role === 'surveyor';
  const isClaimUser = session.role === 'claim_user';
  const hideAssigned = isClaimUser || isSurveyor;
  const hideWeights = isClaimUser;
  const stageTab = isSurveyor ? selectedStage || 'assessment' : selectedStage || 'all';
  const surveyorCanWork =
    isSurveyor &&
    stageTab === 'assessment' &&
    hasPassedPriorStages(claim, ['fnol', 'intimation']) &&
    !claim.surveyorSubmitted;
  const surveyorSubmitted = isSurveyor && !!claim.surveyorSubmitted;
  const displayStages =
    stageTab && stageTab !== 'all'
      ? CLAIM_STAGES.filter((s) => s.id === stageTab)
      : CLAIM_STAGES;
  const stageResults =
    stageTab && stageTab !== 'all'
      ? (claim.results || []).filter((r) => r.stage === stageTab)
      : claim.results || [];
  const sorted = sortChecksForDisplay(stageResults);
  const counts = {
    all: stageResults.length,
    pass: stageResults.filter((r) => r.state === 'pass').length,
    fail: stageResults.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate').length,
  };

  const filtered =
    filter === 'all'
      ? sorted
      : filter === 'fail'
        ? sorted.filter((r) => r.state === 'fail' || r.state === 'cant_evaluate')
        : sorted.filter((r) => r.state === filter);

  const s = claim.summary;
  const summaryLine = [
    s.hardFailCount
      ? `${s.hardFailCount} critical fail${s.hardFailCount > 1 ? 's' : ''}`
      : null,
    `${s.failCount ?? s.softFailCount} of ${s.softTotal + (s.hardFailCount || 0)} checks failed`,
  ]
    .filter(Boolean)
    .join(' · ');

  const hardFailNames = claim.hardFails.map((h) => `${checkCode(h.checkId)} ${h.name}`).join('; ');

  const checksByStage = displayStages.map((stage) => {
    const items = filtered.filter((r) => r.stage === stage.id);
    return { stage, items };
  });

  const content = `
    <button type="button" class="back-link" data-action="back">${iconBack()} Back to claims</button>

    <div class="claim-detail-header">
      <div class="claim-detail-grid">
        <div class="meta-item">
          <label>Claim number</label>
          <div class="value">
            <button type="button" class="claim-link" data-action="open-drawer">${formatClaimRef(claim)}</button>
          </div>
        </div>
        <div class="meta-item">
          <label>Policy number</label>
          <div class="value">${claim.policyNumber}</div>
        </div>
        <div class="meta-item">
          <label>Claimant</label>
          <div class="value">${claim.claimant}</div>
        </div>
        <div class="meta-item">
          <label>Claim amount</label>
          <div class="value">${formatClaimAmount(claim)}</div>
        </div>
        ${
          hideAssigned
            ? ''
            : `<div class="meta-item">
          <label>Assigned to</label>
          <div class="value">${claim.assignedName}</div>
        </div>`
        }
        <div class="meta-item">
          <label>Loss date</label>
          <div class="value">${formatDate(claim.lossDate)}</div>
        </div>
        <div class="meta-item">
          <label>Vehicle</label>
          <div class="value">${claim.vehicle}</div>
        </div>
        <div class="meta-item">
          <label>Claim type</label>
          <div class="value">${
            { own_damage: 'Own damage', tp: 'Third party', theft: 'Theft', total_loss: 'Total loss' }[
              claim.claimType
            ] || claim.claimType || 'Own damage'
          }</div>
        </div>
      </div>
    </div>

    ${
      exceptionNotice
        ? `<div class="surveyor-banner"><strong>Bypass sent to core</strong><p>${esc(exceptionNotice)}</p></div>`
        : ''
    }
    ${
      surveyorCanWork
        ? `<div class="surveyor-banner">
        <strong>Assessment stage</strong>
        <p>Upload your documents below and submit to run further scoring. Switch to FNOL, Registration, or Settlement to review earlier or later stages.</p>
      </div>`
        : isSurveyor && stageTab === 'assessment' && !surveyorSubmitted
          ? `<div class="surveyor-banner">
        <strong>Assessment stage</strong>
        <p>This claim has not completed FNOL and Registration yet. You can review this stage; submit is available after those stages pass. Switch tabs to inspect FNOL, Registration, or Settlement.</p>
      </div>`
          : ''
    }
    ${
      surveyorSubmitted
        ? `<div class="surveyor-banner is-done">
        <strong>Submitted for further scoring</strong>
        <p>Surveyor documents are on file. Assessment scoring is now included and the claim has moved to the next stage.</p>
      </div>`
        : ''
    }
    ${
      claim.forcedRed
        ? `
      <div class="hardfail-banner">
        <div class="banner-icon">${iconAlert()}</div>
        <div>
          <strong>Critical use-case failed</strong>
          <p>${hardFailNames}. This stage is Fail and the claim cannot move to the next stage unless the check is bypassed or corrected.</p>
        </div>
      </div>
    `
        : ''
    }

    <div class="score-panel">
      <div class="score-circle lg ${claim.tier}${claim.forcedRed ? ' is-fail-text' : ''}">${formatClaimScore(claim)}</div>
      <div class="score-panel-text">
        <h2>${stageDisplayName(getClaimWorkflowStage(claim))} ${claim.forcedRed ? 'result' : 'score'}</h2>
        <div class="tier-label ${claim.tier}" style="color:var(--${claim.tier === 'yellow' ? 'amber' : claim.tier})">${tierLabel(claim.tier, claim)}${
          claim.hasOverride ? ` <span class="tag override">Override</span>` : ''
        }</div>
        <p class="summary-line">${summaryLine}</p>
      </div>
    </div>

    <div class="stage-chips is-tabs">
      ${
        isSurveyor
          ? ''
          : `<button type="button" class="stage-chip ${stageTab === 'all' ? 'is-active' : ''}" data-stage-tab="all">
          <span class="stage-chip-name">All</span>
        </button>`
      }
      ${CLAIM_STAGES.map((st) => {
          const stageId = st.id;
          const stageScore = (claim.stageScores || []).find((x) => x.stageId === stageId);
          const docs = getStageDocCompleteness(claim, stageId);
          const active = stageTab === stageId;
          const held = !stageScore && claim.heldAtStage && claim.heldAtStage !== stageId;
          const inner = `
          <span class="stage-chip-name">${stageDisplayName(stageId)}</span>
          ${stageScore ? `<span class="score-circle xs ${stageScore.tier}${stageScore.criticalFailed ? ' is-fail-text' : ''}">${formatStageScore(stageScore)}</span>` : ''}
          ${
            stageScore
              ? stageScore.criticalFailed
                ? `<span class="doc-complete-chip">Fail</span>`
                : `<span class="doc-complete-chip">${stageScore.passed ? 'Pass' : 'Fail'} at ${stageScore.passMark}%</span>`
              : held
                ? `<span class="doc-complete-chip">Held</span>`
                : ''
          }
          ${docs.total ? `<span class="doc-complete-chip">${docs.done}/${docs.total} docs</span>` : ''}
        `;
          return `<button type="button" class="stage-chip ${active ? 'is-active' : ''}" data-stage-tab="${stageId}">${inner}</button>`;
        }).join('')}
    </div>

    <div class="result-filters">
      <button type="button" class="result-filter ${filter === 'all' ? 'active' : ''}" data-filter="all">
        All <span class="count">${counts.all}</span>
      </button>
      <button type="button" class="result-filter ${filter === 'pass' ? 'active' : ''}" data-filter="pass">
        Passed <span class="count">${counts.pass}</span>
      </button>
      <button type="button" class="result-filter ${filter === 'fail' ? 'active' : ''}" data-filter="fail">
        Failed <span class="count">${counts.fail}</span>
      </button>
    </div>

    <div class="checks-by-stage">
      ${checksByStage
              .map(({ stage, items }) => {
                const stageScore = (claim.stageScores || []).find((x) => x.stageId === stage.id);
                const docs = getStageDocCompleteness(claim, stage.id);
                const stageHasExcluded = (claim.results || []).some(
                  (r) => r.stage === stage.id && !r.hardFail && (r.state === 'bypassed' || r.state === 'waived')
                );
                const stageHasCritical = (claim.results || []).some((r) => r.stage === stage.id && r.hardFail);
                const hints = [];
                if (!hideWeights && stageHasCritical) {
                  hints.push(
                    'Critical use-cases are pass / fail only. If they pass, remaining use-cases in this stage share 100%.'
                  );
                }
                if (!hideWeights && stageHasExcluded) {
                  hints.push('Bypassed use-cases are excluded. Remaining weights in this stage are normalised to 100%.');
                }
                const holdNote = stageHoldMessage(claim, stage.id);
                return `
            <section class="stage-block">
              <div class="stage-block-header">
                <div>
                  <h3>${stageDisplayName(stage.id)}</h3>
                  <p>${stage.description}</p>
                </div>
                <div class="stage-block-score">
                  ${docs.total ? `<span class="doc-complete-chip">${docs.done}/${docs.total} docs</span>` : ''}
                  ${
                    stageScore
                      ? `<span class="score-circle sm ${stageScore.tier}${stageScore.criticalFailed ? ' is-fail-text' : ''}">${formatStageScore(stageScore)}</span>`
                      : ''
                  }
                </div>
              </div>
              ${holdNote ? `<p class="stage-hold-note">${holdNote}</p>` : ''}
              <div class="checks-list">
                ${
                  items.length === 0
                    ? filter === 'all' || holdNote
                      ? ''
                      : `<div class="empty-checks">No checks in this result state.</div>`
                    : items
                        .map((r) => {
                          return `
                  <div class="check-row ${r.state}${hideWeights ? ' no-weight' : ''}">
                    <div class="check-state-icon ${r.state}">${stateIcon(r.state)}</div>
                    <div class="check-body">
                      <div class="check-name">
                        <span class="check-code">${checkCode(r.checkId)}</span>
                        ${r.name}
                        ${r.hardFail ? `<span class="tag critical">Critical</span>` : ''}
                      </div>
                      <p class="evidence">${r.evidence}</p>
                      ${exceptionBlockHtml(r, session)}
                    </div>
                    ${hideWeights ? '' : `<div class="check-weight">${weightCellHtml(r, stageHasExcluded)}</div>`}
                  </div>
                `;
                        })
                        .join('')
                }
              </div>
              ${hints.map((h) => `<p class="stage-norm-hint">${h}</p>`).join('')}
              ${documentChecklistHtml(claim, stage.id, {
                readOnly: isClaimUser || (isSurveyor && (stage.id !== 'assessment' || surveyorSubmitted)),
              })}
              ${
                stage.id === 'assessment' && surveyorCanWork
                  ? `
                <div class="surveyor-submit">
                  <p>${
                    hasStageDocsComplete(claim, 'assessment')
                      ? 'Required Assessment documents are on file. Submit to run further scoring and move this claim to the next stage.'
                      : 'Upload every required Assessment document, then submit for further scoring.'
                  }</p>
                  <button type="button" class="btn btn-primary" data-action="submit-surveyor" ${
                    hasStageDocsComplete(claim, 'assessment') ? '' : 'disabled'
                  }>Submit for further scoring</button>
                </div>`
                  : ''
              }
            </section>
          `;
              })
              .join('')}
    </div>

    ${drawerOpen ? claimInfoDrawer(claim) : ''}
  `;

  root.innerHTML = renderShell(session, '#/queue', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  root.querySelector('[data-action="back"]').addEventListener('click', () => {
    location.hash = '#/queue';
  });
  const persist = (nextFilter, extra = {}) =>
    onFilter(nextFilter, {
      drawerOpen,
      selectedStage: stageTab,
      exceptionNotice: null,
      ...extra,
    });
  root.querySelectorAll('[data-filter]').forEach((btn) => {
    btn.addEventListener('click', () => persist(btn.dataset.filter, { drawerOpen: false }));
  });
  root.querySelectorAll('[data-stage-tab]').forEach((btn) => {
    btn.addEventListener('click', () => persist('all', { selectedStage: btn.dataset.stageTab }));
  });
  root.querySelectorAll('[data-action="open-drawer"]').forEach((btn) => {
    btn.addEventListener('click', () => persist(filter, { drawerOpen: true }));
  });
  root.querySelectorAll('[data-action="close-drawer"]').forEach((btn) => {
    btn.addEventListener('click', () => persist(filter, { drawerOpen: false }));
  });
  root.querySelectorAll('[data-action="upload-doc"]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      mockUploadClaimDocument(claim.id, btn.dataset.docId, session);
      persist(filter);
    });
  });
  root.querySelector('[data-action="submit-surveyor"]')?.addEventListener('click', () => {
    const result = submitSurveyorAssessment(claim.id);
    persist(filter, { surveyorMessage: result.message });
  });
  root.querySelectorAll('[data-action="request-bypass"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const result = requestCoreBypass(claim.id, Number(btn.dataset.checkId), session);
      persist(filter, {
        exceptionNotice: result.message,
      });
    });
  });
}

let chartInstance = null;

function destroyChart() {
  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }
}

function drawChart(canvas, mode) {
  destroyChart();
  if (!window.Chart || !canvas) return;

  if (!TREND_HISTORY.length) {
    return;
  }

  const labels = TREND_HISTORY.map((p) => formatDate(p.date));

  if (mode === 'share') {
    chartInstance = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'High risk %',
            data: TREND_HISTORY.map((p) => p.redPct),
            borderColor: '#b91c1c',
            backgroundColor: 'transparent',
            tension: 0.25,
            pointRadius: 3,
          },
          {
            label: 'Medium risk %',
            data: TREND_HISTORY.map((p) => p.yellowPct),
            borderColor: '#d97706',
            backgroundColor: 'transparent',
            tension: 0.25,
            pointRadius: 3,
          },
          {
            label: 'Pass %',
            data: TREND_HISTORY.map((p) => p.greenPct),
            borderColor: '#15803d',
            backgroundColor: 'transparent',
            tension: 0.25,
            pointRadius: 3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'IBM Plex Sans', size: 12 } } },
        },
        scales: {
          y: {
            min: 0,
            max: 100,
            ticks: { callback: (v) => v + '%' },
            grid: { color: '#eef2f6' },
          },
          x: { grid: { display: false } },
        },
      },
    });
  } else {
    chartInstance = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Claims scored',
            data: TREND_HISTORY.map((p) => p.volume),
            borderColor: '#16303D',
            backgroundColor: 'rgba(22, 48, 61, 0.08)',
            fill: true,
            tension: 0.25,
            pointRadius: 3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'IBM Plex Sans', size: 12 } } },
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { precision: 0 },
            grid: { color: '#eef2f6' },

          x: { grid: { display: false } },

function renderDashboard(root, session, claims, state, onChange) {
  if (!canAccess(session.role, 'dashboard')) {
    location.hash = '#/queue';
    return;
  }

  const { period, branch, chartMode, claimType = 'all' } = state;
  const dashFilters = { period, branch, claimType };
  const filtered = filterClaimUniverse(claims, dashFilters);
  const scopeLine = describeClaimScope(filtered, dashFilters);

  const totalCount = filtered.length;
  const totalValue = filtered.reduce((s, c) => s + c.amount, 0);
  const red = filtered.filter((c) => c.tier === 'red');
  const yellow = filtered.filter((c) => c.tier === 'yellow');
  const green = filtered.filter((c) => c.tier === 'green');
  const criticalClaims = filtered.filter((c) => (c.hardFails?.length || 0) > 0);

  const redValue = red.reduce((s, c) => s + c.amount, 0);
  const yellowValue = yellow.reduce((s, c) => s + c.amount, 0);
  const greenValue = green.reduce((s, c) => s + c.amount, 0);

  const flaggedPct = totalCount ? Math.round((red.length / totalCount) * 100) : 0;
  const criticalPct = totalCount ? Math.round((criticalClaims.length / totalCount) * 100) : 0;

  const maxCount = Math.max(red.length, yellow.length, green.length, 1);
  const maxValue = Math.max(redValue, yellowValue, greenValue, 1);

  const hasTrend = TREND_HISTORY.length >= 2;
  const failStats = useCaseFailStats(filtered);
  const topFails = failStats.filter((s) => s.fail > 0).slice(0, 8);
  const maxFails = Math.max(...topFails.map((s) => s.fail), 1);

  const stageFailSummary = CLAIM_STAGES.map((stage) => {
    const rows = failStats.filter((s) => s.stage === stage.id);
    const fails = rows.reduce((n, r) => n + r.fail, 0);
    const total = rows.reduce((n, r) => n + r.total, 0);
    return {
      ...stage,
      fails,
      total,
      rate: total ? Math.round((fails / total) * 100) : 0,
      top: rows.slice().sort((a, b) => b.fail - a.fail)[0],
    };
  });

  const content = `
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p class="page-subtitle">Portfolio risk overview · use-case fail insight</p>
      </div>
    </div>

    <div class="filters-bar">
      <div class="filter-group">
        <label for="period">Time period</label>
        <select id="period">
          ${PERIOD_PRESETS.filter((p) => p.id !== 'custom')
            .map((p) => `<option value="${p.id}" ${period === p.id ? 'selected' : ''}>${p.label}</option>`)
            .join('')}
        </select>
      </div>
      <div class="filter-group">
        <label for="branch">Branch / region</label>
        <select id="branch">
          ${BRANCHES.map((b) => `<option value="${b}" ${branch === b ? 'selected' : ''}>${b}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <label for="dash-type">Claim type</label>
        <select id="dash-type">
          ${CLAIM_TYPE_OPTIONS.map(
            (t) => `<option value="${t.id}" ${claimType === t.id ? 'selected' : ''}>${t.label}</option>`
          ).join('')}
        </select>
      </div>
    </div>
    <p class="scope-line">${scopeLine}</p>

    <div class="stat-tiles">
      <div class="stat-tile">
        <div class="label">Claims scored</div>
        <div class="value">${totalCount}</div>
        <div class="sub">In selected period</div>
      </div>
      <div class="stat-tile">
        <div class="label">Total claim value</div>
        <div class="value" style="font-size:1.2rem">${formatAED(totalValue)}</div>
        <div class="sub">Sum of claim amounts</div>
      </div>
      <div class="stat-tile">
        <div class="label">Flagged high-risk</div>
        <div class="value">${flaggedPct}%</div>
        <div class="sub">${formatAED(redValue)} exposed</div>
      </div>
      <div class="stat-tile">
        <div class="label">Critical fails</div>
        <div class="value">${criticalPct}%</div>
        <div class="sub">${criticalClaims.length} claims with a failed critical</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Risk breakdown</h2>
      </div>
      <div class="risk-breakdown">
        ${[
          { key: 'red', label: 'High risk', count: red.length, value: redValue },
          { key: 'yellow', label: 'Medium risk', count: yellow.length, value: yellowValue },
          { key: 'green', label: 'Pass', count: green.length, value: greenValue },
        ]
          .map(
            (row) => `
          <div class="risk-row">
            <div class="risk-row-label"><span class="dot ${row.key}"></span>${row.label}</div>
            <div class="risk-metrics">
              <div class="risk-numbers">
                <span><strong>${row.count}</strong> claims</span>
                <span><strong>${formatAED(row.value)}</strong></span>
              </div>
              <div class="bar-track"><div class="bar-fill ${row.key}" style="width:${Math.round((row.value / maxValue) * 100)}%"></div></div>
              <div class="bar-track" style="height:5px;opacity:0.65"><div class="bar-fill ${row.key}" style="width:${Math.round((row.count / maxCount) * 100)}%;opacity:0.55"></div></div>
            </div>
          </div>
        `
          )
          .join('')}
      </div>
      <p style="margin:12px 0 0;font-size:0.75rem;color:var(--text-muted)">Bars: claim value (primary) · count (secondary)</p>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Use-case fails by stage</h2>
      </div>
      <div class="stage-fail-grid">
        ${stageFailSummary
          .map(
            (st) => `
          <div class="stage-fail-card">
            <div class="stage-fail-top">
              <strong>${st.name}</strong>
              <span>${st.fails} fails · ${st.rate}%</span>
            </div>
            <div class="bar-track"><div class="bar-fill red" style="width:${st.rate}%"></div></div>
            <p class="stage-fail-top-uc">${
              st.top && st.top.fail
                ? `Most fails: ${st.top.code} ${st.top.name} (${st.top.fail})`
                : 'No fails in period'
            }</p>
          </div>
        `
          )
          .join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Top failing use-cases</h2>
      </div>
      ${
        topFails.length === 0
          ? `<div class="chart-empty">No failed use-cases in this filter.</div>`
          : `<div class="usecase-fail-list">
        ${topFails
          .map(
            (row) => `
          <div class="usecase-fail-row">
            <div class="usecase-fail-meta">
              <span class="check-code">${row.code}</span>
              <div>
                <strong>${row.name}</strong>
                <small>${row.stageName} · ${row.failRate}% fail rate</small>
              </div>
            </div>
            <div class="usecase-fail-bar-wrap">
              <div class="bar-track"><div class="bar-fill red" style="width:${Math.round((row.fail / maxFails) * 100)}%"></div></div>
              <strong>${row.fail}</strong>
            </div>
          </div>
        `
          )
          .join('')}
      </div>`
      }
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Risk trend</h2>
        <div class="segmented" role="group" aria-label="Chart mode">
          <button type="button" data-chart="share" class="${chartMode === 'share' ? 'active' : ''}">Risk share %</button>
          <button type="button" data-chart="volume" class="${chartMode === 'volume' ? 'active' : ''}">Claim volume</button>
        </div>
      </div>
      ${
        hasTrend
          ? `<div class="chart-wrap"><canvas id="trend-chart"></canvas></div>`
          : `<div class="chart-empty">Not enough history yet to show a reliable trend.</div>`
      }
    </div>
  `;

  root.innerHTML = renderShell(session, '#/dashboard', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  root.querySelector('#period').addEventListener('change', (e) => {
    onChange({ ...state, period: e.target.value });
  });
  root.querySelector('#branch').addEventListener('change', (e) => {
    onChange({ ...state, branch: e.target.value });
  });
  root.querySelector('#dash-type').addEventListener('change', (e) => {
    onChange({ ...state, claimType: e.target.value });
  });
  root.querySelectorAll('[data-chart]').forEach((btn) => {
    btn.addEventListener('click', () => onChange({ ...state, chartMode: btn.dataset.chart }));
  });

  if (hasTrend) {
    requestAnimationFrame(() => {
      const canvas = root.querySelector('#trend-chart');
      drawChart(canvas, chartMode);
    });
  } else {
    destroyChart();
  }
}

const SCORING_TABS = CLAIM_STAGES.map((s) => ({
  id: s.id,
  label: `${s.name} scoring`,
}));

function stageName(id) {
  return CLAIM_STAGES.find((s) => s.id === id)?.name || id;
}

function categoryLabel(id) {
  return RISK_CATEGORIES.find((c) => c.id === id)?.name || id;
}

function iconHistory() {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 109-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 5v4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function iconDots() {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>`;
}

function iconFilter() {
  return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
}

function cloneUseCases(list) {
  return list.map((u) => ({ ...u }));
}

/** @type {{ riskCategory: string, query: string }} */
let filters = { riskCategory: 'all', query: '' };
let scoringTab = 'fnol';
/** @type {number|null} viewing historical version id */
let viewingVersionId = null;
let openMenuId = null;
let modal = null;
let prevVersionsOpen = false;
let feedback = null;
let ucPickerOpen = false;

function getViewVersion() {
  const store = getConfigStore();
  if (viewingVersionId && viewingVersionId !== store.currentId) {
    return getConfigVersionById(viewingVersionId, store);
  }
  return getCurrentConfigVersion(store);
}

function isReadOnly() {
  const store = getConfigStore();
  return viewingVersionId != null && viewingVersionId !== store.currentId;
}

function filteredRows(useCases) {
  return useCases.filter((u) => {
    if (u.stage !== scoringTab) return false;
    if (filters.riskCategory !== 'all' && u.riskCategory !== filters.riskCategory) return false;
    if (filters.query) {
      const q = filters.query.toLowerCase();
      const blob = `${u.code} ${u.name} ${u.description}`.toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function defaultVersionDates() {
  return { startDate: '', endDate: '' };
}

function readVersionDates(root) {
  const startDate = root.querySelector('#modal-start-date')?.value || '';
  const endRaw = root.querySelector('#modal-end-date')?.value || '';
  return {
    startDate,
    endDate: endRaw || null,
  };
}

function validateVersionDates(dates) {
  if (!dates.startDate) return 'Please select a start date for the new version.';
  if (!dates.endDate) return 'Please select an end date for the new version.';
  if (dates.endDate < dates.startDate) {
    return 'End date must be on or after the start date.';
  }
  return null;
}

function hasCompleteVersionDates(draft = {}) {
  return !!(draft.startDate && draft.endDate && draft.endDate >= draft.startDate);
}

function applyMutation(mutator, dates, extras = {}) {
  const store = getConfigStore();
  const current = getCurrentConfigVersion(store);
  const next = mutator(cloneUseCases(current.useCases));
  const result = commitConfigChange(next, dates, extras);
  const created = result.versions[result.versions.length - 1];
  viewingVersionId = null;
  const endLabel = created.endDate ? formatLongDate(created.endDate) : 'Present';
  const when = isFutureVersion(created) ? 'scheduled' : 'created';
  feedback = {
    type: 'success',
    message: `Version ${created.number} ${when} (${formatLongDate(created.startDate)} – ${endLabel}).`,
  };
}

function versionNoticeHtml() {
  return `
    <div class="version-notice" role="status">
      Your changes will be saved as a new version. Select the start date and end date for this new version to continue.
    </div>
  `;
}

function versionDateFieldsHtml(draft = {}) {
  const start = draft.startDate || '';
  const end = draft.endDate || '';
  const err = draft.dateError ? `<p class="version-dates-error">${draft.dateError}</p>` : '';
  return `
    <div class="version-dates-block">
      <div class="version-dates-title">Select version dates</div>
      <p class="version-dates-hint">Both dates are required before a new version can be created. Use a future start date to schedule this version.</p>
      <div class="field-row field-row-2">
        <div class="field">
          <label for="modal-start-date">Start date <span class="required-mark">*</span></label>
          <input type="date" id="modal-start-date" value="${start}" required />
        </div>
        <div class="field">
          <label for="modal-end-date">End date <span class="required-mark">*</span></label>
          <input type="date" id="modal-end-date" value="${end}" required />
        </div>
      </div>
      ${err}
    </div>
  `;
}

function useCasePickerHtml(currentUseCases, draft = {}) {
  const catalog = USE_CASE_LIBRARY.filter((d) => !currentUseCases.some((u) => u.id === d.id));
  const enabled = catalog.filter((d) => isTenantEnabledUseCase(d));
  const locked = catalog.filter((d) => !isTenantEnabledUseCase(d));
  const selected = draft.id ? USE_CASE_LIBRARY.find((d) => d.id === Number(draft.id)) : null;
  const selectedEnabled = selected ? isTenantEnabledUseCase(selected) : null;

  const optionBtn = (d) => {
    const enabledUc = isTenantEnabledUseCase(d);
    const selectedCls = Number(draft.id) === d.id ? 'is-selected' : '';
    return `
      <button type="button"
        class="uc-picker-option ${enabledUc ? 'is-enabled' : 'is-locked'} ${selectedCls}"
        data-pick-uc="${d.id}">
        <span class="uc-status-dot" aria-hidden="true"></span>
        <span class="uc-picker-option-text">
          <span class="uc-picker-code">${checkCode(d.id)}</span>
          <span class="uc-picker-name">${d.name}</span>
        </span>
        <span class="uc-picker-badge">${enabledUc ? 'Available' : 'Not enabled'}</span>
      </button>
    `;
  };

  const triggerLabel = selected ? `${checkCode(selected.id)} — ${selected.name}` : 'Select use-case…';

  return `
    <div class="field">
      <label>Use-case</label>
      <div class="uc-picker ${ucPickerOpen ? 'is-open' : ''}">
        <button type="button" class="uc-picker-trigger ${selected ? (selectedEnabled ? 'is-enabled' : 'is-locked') : ''}" data-action="toggle-uc-picker" aria-expanded="${ucPickerOpen ? 'true' : 'false'}">
          <span class="uc-status-dot" aria-hidden="true"></span>
          <span class="uc-picker-trigger-label">${triggerLabel}</span>
          <span class="uc-picker-caret" aria-hidden="true">▾</span>
        </button>
        ${
          ucPickerOpen
            ? `
          <div class="uc-picker-menu" role="listbox">
            <div class="uc-picker-legend">
              <span><span class="uc-status-dot is-enabled"></span> Available (enabled)</span>
              <span><span class="uc-status-dot is-locked"></span> Not enabled</span>
            </div>
            ${
              enabled.length
                ? `<div class="uc-picker-group-label">Available</div>${enabled.map(optionBtn).join('')}`
                : `<div class="uc-picker-empty">No available use-cases left to add.</div>`
            }
            ${
              locked.length
                ? `<div class="uc-picker-group-label">Not enabled for your organisation</div>${locked.map(optionBtn).join('')}`
                : ''
            }
            ${!enabled.length && !locked.length ? `<div class="uc-picker-empty">All catalog use-cases are already configured.</div>` : ''}
          </div>
        `
            : ''
        }
      </div>
    </div>
  `;
}

function renderConfig(root, session) {
  if (!canAccess(session.role, 'config')) {
    location.hash = '#/queue';
    return;
  }

  const store = getConfigStore();
  const current = getCurrentConfigVersion(store);
  const view = getViewVersion() || current;
  const readOnly = isReadOnly();
  const previous = store.versions
    .filter((v) => v.id !== store.currentId)
    .sort((a, b) => b.number - a.number);
  const rows = filteredRows(view.useCases);
  const weightedRows = rows.filter((u) => !isCriticalUseCase(u));
  const weightTotal = weightedRows.reduce((sum, u) => sum + (Number(u.weight) || 0), 0);
  const weightFooterOk = weightedRows.length === 0 || weightTotal === 100;
  const passPct = Number(view.stagePassPct?.[scoringTab] ?? DEFAULT_STAGE_PASS[scoringTab] ?? 70);
  const tabLabel = stageName(scoringTab);

  const content = `
    <div class="page-header config-page-header">
      <div>
        <h1>Configuration</h1>
        <p class="page-subtitle">Stage scoring, use-case weightage, and pass / fail criteria</p>

      ${
        readOnly
          ? `<button type="button" class="btn btn-secondary" data-action="back-current">Back to current version</button>`

    <div class="config-toolbar">
      <div class="version-controls">
        <div class="current-version-pill">
          ${formatVersionLabel(readOnly ? view : current, { isCurrent: !readOnly })}
          ${readOnly ? '<span class="readonly-tag">Read-only</span>' : ''}

        </div>
        <div class="prev-versions-wrap">

            ${iconHistory()}

          ${
            prevVersionsOpen
              ? `
            <div class="prev-versions-menu">

                  ? `<div class="prev-empty">No previous versions yet.</div>`
