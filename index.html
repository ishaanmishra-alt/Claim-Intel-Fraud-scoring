<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Intel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b2a24'/%3E%3Cpath d='M8 22V10l8-4 8 4v12l-8 4-8-4z' fill='%235fffbe'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
:root {
  --bg: #f3faf7;
  --surface: #ffffff;
  --surface-muted: #f5fbf8;
  --border: #d5e8df;
  --border-strong: #b7d4c8;
  --text: #16303d;
  --text-secondary: #3d5563;
  --text-muted: #6b7f8a;
  --navy: #16303d;
  --navy-deep: #0f222b;
  --navy-soft: #e8fff6;
  --accent: #5fffbe;
  --accent-hover: #3aefad;
  --accent-text: #16303d;
  --mint: #5fffbe;
  --mint-soft: #e8fff6;
  --green: #15803d;
  --green-bg: #ecfdf3;
  --green-border: #bbf7d0;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --amber-border: #fde68a;
  --red: #b91c1c;
  --red-bg: #fef2f2;
  --red-border: #fecaca;
  --urgent: #dc2626;
  --shadow: 0 1px 2px rgba(22, 48, 61, 0.05), 0 8px 24px rgba(22, 48, 61, 0.06);
  --radius: 10px;
  --radius-sm: 6px;
  --font: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button,
input,
select {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

#app {
  min-height: 100vh;
}

/* ---------- Login ---------- */
.login-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 32px 20px;
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%, rgba(26, 107, 122, 0.12), transparent 55%),
    radial-gradient(ellipse 70% 50% at 90% 100%, rgba(22, 48, 61, 0.1), transparent 50%),
    linear-gradient(160deg, #e8eef2 0%, #f4f7f9 45%, #eef3f6 100%);
}

.login-card {
  width: min(420px, 100%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 36px 32px 28px;
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.azentio-logo {
  display: block;
  height: 28px;
  width: auto;
}

.brand-divider {
  width: 1px;
  height: 22px;
  background: var(--border-strong);
  flex-shrink: 0;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(145deg, #5fffbe 0%, #3aefad 100%);
  display: grid;
  place-items: center;
  color: var(--accent-text);
  flex-shrink: 0;
}

.brand-icon svg {
  width: 22px;
  height: 22px;
}

.brand-name {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.login-helper {
  margin: 0 0 28px;
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.45;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.field input[type="text"],
.field input[type="password"],
.field input[type="number"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(13, 110, 138, 0.15);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 18px 0 22px;
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.checkbox-row input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: var(--accent-text);
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  color: var(--accent-text);
}

.btn-secondary {
  background: var(--surface);
  border-color: var(--border-strong);
  color: var(--text);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--surface-muted);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border-color: transparent;
}

.btn-ghost:hover:not(:disabled) {
  background: var(--navy-soft);
  color: var(--navy);
}

.btn-block {
  width: 100%;
}

.login-error {
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  color: var(--red);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  margin-bottom: 14px;
}

.demo-accounts {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

.demo-accounts h3 {
  margin: 0 0 10px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.demo-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.demo-chip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}

.demo-chip:hover {
  border-color: var(--accent);
  background: var(--navy-soft);
}

.demo-chip .role {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--navy);
}

.demo-chip .creds {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-family: var(--mono);
}

/* ---------- App shell ---------- */
.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 28px;
  min-width: 0;
}

.topbar .brand-mark {
  margin: 0;
}

.topbar .azentio-logo {
  height: 24px;
}

.topbar .brand-icon {
  width: 28px;
  height: 28px;
  border-radius: 7px;
}

.topbar .brand-icon svg {
  width: 18px;
  height: 18px;
}

.topbar .brand-name {
  font-size: 1.05rem;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
}

.nav-link {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-secondary);
}

.nav-link:hover {
  background: var(--surface-muted);
  color: var(--text);
}

.nav-link.active {
  background: var(--mint-soft);
  color: var(--accent-text);
  font-weight: 600;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.persona-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 6px 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-muted);
}

.persona-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  display: grid;
  place-items: center;
  font-size: 0.7rem;
  font-weight: 700;
}

.persona-meta {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.persona-meta .name {
  font-size: 0.8rem;
  font-weight: 600;
}

.persona-meta .role {
  font-size: 0.7rem;
  color: var(--text-muted);
}

.main {
  flex: 1;
  padding: 28px 24px 48px;
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.page-header h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.page-subtitle {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--accent);
  margin-bottom: 12px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.back-link:hover {
  text-decoration: underline;
}

/* ---------- Controls ---------- */
.segmented {
  display: inline-flex;
  padding: 3px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  gap: 2px;
}

.segmented button {
  border: none;
  background: transparent;
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 0.825rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
}

.segmented button.active {
  background: var(--surface);
  color: var(--navy);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
}

.tier-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
}

.tier-stat {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.tier-stat strong {
  color: var(--text);
  font-weight: 600;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot.red { background: var(--red); }
.dot.yellow { background: #d97706; }
.dot.green { background: var(--green); }
.dot.amber { background: #d97706; }

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.toolbar-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-right: 8px;
}

/* ---------- Claims list ---------- */
.claims-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.claim-row {
  display: grid;
  grid-template-columns: 56px 1fr auto auto auto;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  text-align: left;
  width: 100%;
}

.claim-row:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow);
}

.score-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 0.95rem;
  font-family: var(--mono);
  border: 2px solid;
}

.score-circle.sm {
  width: 40px;
  height: 40px;
  font-size: 0.85rem;
}

.score-circle.lg {
  width: 96px;
  height: 96px;
  font-size: 1.75rem;
  border-width: 3px;
}

.score-circle.red {
  color: var(--red);
  background: var(--red-bg);
  border-color: var(--red);
}

.score-circle.yellow {
  color: var(--amber);
  background: var(--amber-bg);
  border-color: #d97706;
}

.score-circle.green {
  color: var(--green);
  background: var(--green-bg);
  border-color: var(--green);
}

.claim-main {
  min-width: 0;
}

.claim-id-line {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 2px;
}

.claim-id {
  font-weight: 600;
  font-size: 0.95rem;
}

.claim-name {
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.tag.critical {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-border);
}

.tag.knockout {
  background: #f1f5f9;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.tag.override {
  background: var(--mint-soft);
  color: var(--accent-text);
  border: 1px solid var(--accent);
}

.claim-amount {
  font-weight: 600;
  font-size: 0.9rem;
  text-align: right;
  white-space: nowrap;
}

.claim-tier {
  font-size: 0.8rem;
  font-weight: 600;
  min-width: 88px;
  text-align: center;
}

.claim-tier.red { color: var(--red); }
.claim-tier.yellow { color: var(--amber); }
.claim-tier.green { color: var(--green); }

.due-badge {
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  min-width: 72px;
  text-align: right;
}

.due-badge.urgent {
  color: var(--urgent);
  font-weight: 700;
}

.empty-state {
  padding: 48px 24px;
  text-align: center;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}

/* ---------- Claim detail ---------- */
.claim-detail-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}

.claim-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
}

.meta-item label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.meta-item .value {
  font-size: 0.95rem;
  font-weight: 600;
}

.hardfail-banner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  color: var(--red);
}

.hardfail-banner .banner-icon {
  flex-shrink: 0;
  margin-top: 2px;
}

.hardfail-banner strong {
  display: block;
  font-size: 0.95rem;
  margin-bottom: 2px;
}

.hardfail-banner p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
  color: #991b1b;
}

.score-panel {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 22px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.score-panel-text h2 {
  margin: 0 0 6px;
  font-size: 1.15rem;
}

.score-panel-text .tier-label {
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 6px;
}

.score-panel-text .summary-line {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.result-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.result-filter {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
}

.result-filter.active {
  border-color: var(--navy);
  background: var(--navy-soft);
  color: var(--navy);
  font-weight: 600;
}

.result-filter .count {
  font-family: var(--mono);
  font-size: 0.75rem;
  margin-left: 4px;
  opacity: 0.8;
}

.checks-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.check-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.check-row.fail {
  border-left: 3px solid var(--red);
}

.check-row.cant_evaluate {
  border-left: 3px solid #d97706;
}

.check-row.pass {
  border-left: 3px solid var(--green);
}

.check-state-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin-top: 1px;
}

.check-state-icon.pass {
  background: var(--green-bg);
  color: var(--green);
}

.check-state-icon.fail {
  background: var(--red-bg);
  color: var(--red);
}

.check-state-icon.cant_evaluate {
  background: var(--amber-bg);
  color: var(--amber);
}

.check-body .check-name {
  font-weight: 600;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.check-body .evidence {
  margin: 4px 0 0;
  font-size: 0.825rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.check-weight {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  font-family: var(--mono);
  white-space: nowrap;
  padding-top: 2px;
}

/* ---------- Dashboard ---------- */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
  align-items: flex-end;
}

.filter-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.filter-group select {
  padding: 8px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  min-width: 160px;
  color: var(--text);
}

.stat-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}

.stat-tile .label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: 8px;
}

.stat-tile .value {
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.stat-tile .sub {
  margin-top: 4px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.panel-header h2 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
}

.risk-breakdown {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.risk-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 16px;
  align-items: center;
}

.risk-row-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 0.875rem;
}

.risk-metrics {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.risk-numbers {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.risk-numbers strong {
  color: var(--text);
}

.bar-track {
  height: 8px;
  background: #eef2f6;
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 999px;
}

.bar-fill.red { background: var(--red); }
.bar-fill.yellow { background: #d97706; }
.bar-fill.green { background: var(--green); }

.chart-wrap {
  position: relative;
  height: 280px;
}

.chart-empty {
  height: 220px;
  display: grid;
  place-items: center;
  color: var(--text-muted);
  font-size: 0.9rem;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

/* ---------- Config ---------- */
.info-banner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  background: #f1f5f9;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
  color: var(--text-secondary);
}

.info-banner .lock-icon {
  flex-shrink: 0;
  color: var(--text-muted);
  margin-top: 1px;
}

.info-banner strong {
  display: block;
  color: var(--text);
  margin-bottom: 2px;
  font-size: 0.9rem;
}

.info-banner p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
}

.config-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.config-section h2 {
  margin: 0 0 4px;
  font-size: 1rem;
}

.config-section .section-desc {
  margin: 0 0 16px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.config-check {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.config-check:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.config-check:first-of-type {
  padding-top: 0;
}

.config-check .name {
  font-weight: 600;
  font-size: 0.9rem;
}

.config-check .category {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.weight-input-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}

.weight-input-wrap input {
  width: 72px;
  padding: 7px 8px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  text-align: right;
  font-family: var(--mono);
  font-size: 0.875rem;
}

.weight-input-wrap input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(13, 110, 138, 0.12);
}

.weight-input-wrap .pct {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-weight: 600;
}

.config-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  position: sticky;
  bottom: 16px;
  box-shadow: var(--shadow);
}

.running-total {
  font-size: 0.95rem;
  font-weight: 600;
}

.running-total .total-value {
  font-family: var(--mono);
  font-size: 1.1rem;
  margin-left: 6px;
}

.running-total.at-100 .total-value {
  color: var(--green);
}

.running-total.not-100 .total-value {
  color: var(--amber);
}

.save-feedback {
  font-size: 0.85rem;
  margin-right: 12px;
}

.save-feedback.error {
  color: var(--red);
}

.save-feedback.success {
  color: var(--green);
  font-weight: 600;
}

.footer-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .stat-tiles {
    grid-template-columns: repeat(2, 1fr);
  }

  .claim-row {
    grid-template-columns: 48px 1fr;
    gap: 12px;
  }

  .claim-amount,
  .claim-tier,
  .due-badge {
    grid-column: 2;
    text-align: left;
    min-width: 0;
  }

  .claim-amount { margin-top: -4px; }
  .nav-links {
    display: none;
  }

  .mobile-nav {
    display: flex !important;
  }
}

.mobile-nav {
  display: none;
  gap: 4px;
  padding: 8px 16px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

@media (max-width: 600px) {
  .main {
    padding: 20px 14px 40px;
  }

  .stat-tiles {
    grid-template-columns: 1fr;
  }

  .login-card {
    padding: 28px 20px 22px;
  }

  .topbar {
    padding: 0 14px;
  }

  .persona-meta .name {
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
}

/* ---------- Azentio extras ---------- */
.login-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0 14px;
  color: var(--text-muted);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.login-divider::before,
.login-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.btn-sso {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  color: var(--navy);
  font-weight: 600;
}

.btn-sso:hover:not(:disabled) {
  background: var(--navy-soft);
  border-color: var(--navy);
}

.modal-backdrop,
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 34, 43, 0.45);
  z-index: 80;
  display: flex;
  justify-content: flex-end;
}

.modal-backdrop {
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-card {
  width: min(420px, 100%);
  background: var(--surface);
  border-radius: 14px;
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.modal-card h2 {
  margin: 0 0 8px;
  font-size: 1.15rem;
  color: var(--navy-deep);
}

.modal-copy {
  margin: 0 0 16px;
  color: var(--text-secondary);
  font-size: 0.875rem;
  line-height: 1.45;
}

.sso-persona-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.sso-persona {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
  cursor: pointer;
}

.sso-persona:hover {
  border-color: var(--accent);
  background: var(--navy-soft);
}

.sso-persona strong {
  display: block;
  font-size: 0.9rem;
}

.sso-persona small {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.claim-link {
  background: none;
  border: none;
  padding: 0;
  color: var(--accent);
  font-weight: 700;
  font-size: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.claim-link:hover {
  color: var(--accent-hover);
}

.claim-drawer {
  width: min(420px, 100%);
  height: 100%;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -8px 0 32px rgba(22, 48, 61, 0.12);
  display: flex;
  flex-direction: column;
  animation: slideIn 0.2s ease;
}

@keyframes slideIn {
  from { transform: translateX(24px); opacity: 0.6; }
  to { transform: translateX(0); opacity: 1; }
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}

.drawer-header h2 {
  margin: 0;
  font-size: 1.05rem;
}

.drawer-sub {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 0.8rem;
  font-family: var(--mono);
}

.drawer-body {
  padding: 18px 20px 28px;
  overflow: auto;
}

.drawer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.drawer-section-title {
  margin: 22px 0 10px;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stage-score-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stage-score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  background: var(--surface-muted);
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
}

.icon-btn {
  padding: 6px;
}

.check-code {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent-text);
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 1px 6px;
  margin-right: 6px;
}

.score-circle.xs {
  width: 28px;
  height: 28px;
  font-size: 0.7rem;
  border-width: 2px;
}

.stage-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.stage-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.stage-block {
  margin-bottom: 18px;
}

.stage-block-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.stage-block-header h3 {
  margin: 0;
  font-size: 0.95rem;
  color: var(--navy-deep);
}

.stage-block-header p {
  margin: 2px 0 0;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.config-subhead {
  margin: 16px 0 8px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stage-config .running-total {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.stage-fail-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stage-fail-card {
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

.stage-fail-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.85rem;
  margin-bottom: 8px;
}

.stage-fail-top span {
  color: var(--text-muted);
}

.stage-fail-top-uc {
  margin: 8px 0 0;
  font-size: 0.75rem;
  color: var(--text-secondary);
  line-height: 1.35;
}

.usecase-fail-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.usecase-fail-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
  align-items: center;
}

.usecase-fail-meta {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.usecase-fail-meta strong {
  display: block;
  font-size: 0.875rem;
}

.usecase-fail-meta small {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.usecase-fail-bar-wrap {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
}

@media (max-width: 800px) {
  .stage-fail-grid,
  .usecase-fail-row,
  .drawer-grid {
    grid-template-columns: 1fr;
  }
}

/* ---------- Config table ---------- */
.config-page-header {
  align-items: flex-end;
}

.config-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.version-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.current-version-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent-text);
}

.readonly-tag {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--surface);
  border-radius: 999px;
  padding: 2px 8px;
  color: var(--text-muted);
}

.prev-versions-wrap {
  position: relative;
}

.prev-versions-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.prev-versions-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 280px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 40;
  padding: 6px;
}

.prev-version-item {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--text);
}

.prev-version-item:hover {
  background: var(--mint-soft);
}

.prev-empty {
  padding: 12px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.config-table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.config-table-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-muted);
}

.config-table-wrap {
  overflow: auto;
}

.config-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.config-table th {
  text-align: left;
  padding: 12px 14px;
  background: #f7fcf9;
  border-bottom: 1px solid var(--border);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  white-space: nowrap;
}

.config-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.config-table .col-menu {
  width: 44px;
  padding-left: 10px;
  padding-right: 4px;
}

.uc-name {
  font-weight: 600;
  color: var(--navy-deep);
  min-width: 180px;
}

.uc-desc {
  color: var(--text-secondary);
  max-width: 320px;
  line-height: 1.4;
}

.uc-weight {
  font-family: var(--mono);
  font-weight: 600;
}

.empty-cell {
  text-align: center;
  color: var(--text-muted);
  padding: 28px !important;
}

.cat-pill {
  display: inline-flex;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: capitalize;
}

.cat-critical {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-border);
}

.cat-high {
  background: var(--amber-bg);
  color: var(--amber);
  border: 1px solid var(--amber-border);
}

.cat-low {
  background: var(--mint-soft);
  color: var(--accent-text);
  border: 1px solid var(--accent);
}

.row-menu-wrap {
  position: relative;
}

.row-menu-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
}

.row-menu-btn:hover {
  background: var(--mint-soft);
  color: var(--accent-text);
}

.row-menu {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 200px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  z-index: 30;
  padding: 4px;
}

.row-menu button {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  padding: 8px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.825rem;
}

.row-menu button:hover {
  background: var(--mint-soft);
}

.row-menu button.danger {
  color: var(--red);
}

.btn-danger {
  background: var(--red);
  color: white;
  border: 1px solid var(--red);
}

.btn-danger:hover:not(:disabled) {
  background: #991b1b;
}

.modal-card-wide {
  width: min(560px, 100%);
}

.field-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.field-row-2 {
  grid-template-columns: repeat(2, 1fr);
}

.version-dates-block {
  margin-top: 16px;
  padding: 14px 14px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

.version-dates-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.version-dates-hint {
  margin: 0 0 12px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-secondary);
}

.version-dates-error {
  margin: 0 0 12px;
  font-size: 12px;
  color: #b91c1c;
  font-weight: 500;
}

.optional-label {
  font-weight: 400;
  color: var(--text-secondary);
}

.required-mark {
  color: #b91c1c;
  font-weight: 700;
}

.modal-card input[type='date'] {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font: inherit;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.value-readonly {
  padding: 10px 12px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-weight: 600;
}

.modal-card textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  resize: vertical;
  background: var(--surface-muted);
  color: var(--text-secondary);
  font: inherit;
}

.modal-card select,
.config-table-filters select,
.config-table-filters input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

@media (max-width: 700px) {
  .field-row {
    grid-template-columns: 1fr;
  }
}




.version-notice {
  margin: 0 0 14px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid #86efac;
  background: #f0fdf4;
  color: #166534;
  font-size: 13px;
  line-height: 1.45;
  font-weight: 500;
}

.btn-request {
  background: #0f766e;
}

.btn-request:hover:not(:disabled) {
  background: #0d9488;
}

.uc-picker {
  position: relative;
}

.uc-picker-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  font: inherit;
  color: var(--text);
}

.uc-picker-trigger-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.uc-picker-caret {
  color: var(--text-secondary);
}

.uc-status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  background: #cbd5e1;
}

.uc-picker-trigger.is-enabled .uc-status-dot,
.uc-picker-option.is-enabled .uc-status-dot,
.uc-status-dot.is-enabled {
  background: #22c55e;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
}

.uc-picker-trigger.is-locked .uc-status-dot,
.uc-picker-option.is-locked .uc-status-dot,
.uc-status-dot.is-locked {
  background: #94a3b8;

function documentApplies(claim, def) {
  if (!def) return false;
  const type = claim.claimType || 'own_damage';
  if (!def.condition) return true;
  if (def.condition === 'tp') return type === 'tp';
  if (def.condition === 'theft') return type === 'theft';
  if (def.condition === 'total_loss') return type === 'total_loss';
  if (def.condition === 'towed') return !!claim.towed;
  if (def.condition === 'police') return type === 'tp' || type === 'theft';
  return true;
}

function emptyDocRecord() {
  return { status: 'missing', filename: null, thumb: null, note: '', count: 0 };
}

function getDocRecord(claim, docId) {
  return claim.documents?.[docId] || emptyDocRecord();
}

function countMeetsMin(def, rec) {
  return (rec.count || 0) >= (def.minCount || 1);
}

function isDocumentSatisfied(claim, def) {
  if (!def) return false;
  const rec = getDocRecord(claim, def.id);
  if (rec.status === 'waived') return true;
  if (rec.status === 'uploaded' && countMeetsMin(def, rec)) return true;
  if (def.carryFrom) {
    const prior = DOCUMENT_CATALOG.find((d) => d.id === def.carryFrom);
    if (prior && isDocumentSatisfied(claim, prior) && rec.status !== 'rejected') return true;
  }
  return false;
}

/** Required or applicable-conditional docs still outstanding for a check. */
function missingRequiredDocsForCheck(claim, checkId) {
  return DOCUMENT_CATALOG.filter((def) => {
    if (!def.linkedCheckIds?.includes(checkId)) return false;
    if (def.required === 'optional') return false;
    if (!documentApplies(claim, def)) return false;
    return !isDocumentSatisfied(claim, def);
  });
}

function uploadedDocsForCheck(claim, checkId) {
  return DOCUMENT_CATALOG.filter((def) => {
    if (!def.linkedCheckIds?.includes(checkId)) return false;
    if (!documentApplies(claim, def)) return false;
    const rec = getDocRecord(claim, def.id);
    return rec.status === 'uploaded' && countMeetsMin(def, rec);
  });
}

function getStageDocumentRows(claim, stageId) {
  return DOCUMENT_CATALOG.filter((def) => def.stage === stageId && documentApplies(claim, def)).map((def) => {
    const rec = getDocRecord(claim, def.id);
    const prior = def.carryFrom ? DOCUMENT_CATALOG.find((d) => d.id === def.carryFrom) : null;
    const carried =
      prior &&
      isDocumentSatisfied(claim, prior) &&
      rec.status !== 'uploaded' &&
      rec.status !== 'rejected' &&
      rec.status !== 'waived';
    return {
      def,
      rec,
      displayStatus: carried ? 'already_on_file' : rec.status,
      alreadyOnFile: !!carried,
    };
  });
}

function getStageDocCompleteness(claim, stageId) {
  const rows = getStageDocumentRows(claim, stageId).filter((row) => row.def.required !== 'optional');
  const done = rows.filter((row) => isDocumentSatisfied(claim, row.def)).length;
  return { done, total: rows.length };
}

function hasStageDocsComplete(claim, stageId) {
  const { done, total } = getStageDocCompleteness(claim, stageId);
  return total === 0 || done === total;
}

function hasPassedPriorStages(claim, stageIds) {
  return stageIds.every((id) => hasStageDocsComplete(claim, id));
}

/** Claims that cleared FNOL + Intimation and are waiting on surveyor submit. */
function isReadyForSurveyor(claim) {
  return hasPassedPriorStages(claim, ['fnol', 'intimation']) && !claim.surveyorSubmitted;
}

function submitSurveyorAssessment(claimId) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  if (!hasStageDocsComplete(claim, 'assessment')) {
    return { ok: false, message: 'Upload all required Surveyor documents before submitting.' };
  }
  claim.surveyorSubmitted = true;
  return { ok: true, message: 'Submitted for further scoring. This claim has moved to the next stage.' };
}

function defaultUploadedRecord(def) {
  const pdf = def.kind === 'pdf';
  const count = def.minCount || 1;
  return {
    status: 'uploaded',
    filename: pdf ? `${def.id}.pdf` : `${def.id}-01.jpg`,
    thumb: pdf ? 'PDF' : count > 1 ? `${count} photos` : 'Photo',
    note: 'On file from intake.',
    count,
  };
}

function seedDocuments(claim, overrides = {}) {
  const docs = {};
  DOCUMENT_CATALOG.forEach((def) => {
    if (!documentApplies(claim, def)) return;
    if (overrides[def.id]) {
      docs[def.id] = { ...emptyDocRecord(), ...overrides[def.id] };
      return;
    }
    if (def.required === 'optional') {
      docs[def.id] = {
        ...emptyDocRecord(),
        note: 'Not provided.',
      };
      return;
    }
    if (def.carryFrom) {
      docs[def.id] = emptyDocRecord();
      return;
    }
    docs[def.id] = defaultUploadedRecord(def);
  });
  return docs;
}

function mockUploadClaimDocument(claimId, docId) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  const def = DOCUMENT_CATALOG.find((d) => d.id === docId);
  if (!claim || !def) return null;
  const pdf = def.kind === 'pdf';
  const count = def.minCount || 1;
  claim.documents = claim.documents || {};
  claim.documents[docId] = {
    status: 'uploaded',
    filename: pdf ? `${def.id}-uploaded.pdf` : `${def.id}-upload-01.jpg`,
    thumb: pdf ? 'PDF' : count > 1 ? `${count} photos` : 'Photo',
    note: 'Uploaded in Claim Intel (demo).',
    count,
  };
  return claim.documents[docId];
}

function buildChecks(overrides = {}) {
  return USE_CASE_LIBRARY.map((def) => {
    const o = overrides[def.id] || {};
    return {
      checkId: def.id,
      state: /** @type {CheckState} */ (o.state || 'pass'),
      evidence:
        o.evidence ||
        (def.hardFail
          ? 'Matched policy record — no discrepancy found'
          : 'Within expected range for this claim profile'),
    };
  });
}

function shiftDate(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

const SESSION_KEY = 'claim-intel-session';
const WEIGHTS_KEY = 'claim-intel-weights-v3';
const CONFIG_KEY = 'claim-intel-config-v4';

/** Prototype "today" for version dating */
const CONFIG_TODAY = '2026-08-12';

function getSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

function setSession(user, keepSignedIn) {
  const session = {
    userId: user.id,
    username: user.username,
    name: user.name,
    role: user.role,
    initials: user.initials,
    keepSignedIn: !!keepSignedIn,
  };

  return session;
}

function clearSession() {
  sessionStorage.removeItem(SESSION_KEY);
}

function authenticate(username, password) {
  const user = USERS.find(
    (u) => u.username.toLowerCase() === username.trim().toLowerCase() && u.password === password
  );
  return user || null;
}

function cloneUseCases(list) {
  return list.map((u) => ({ ...u }));
}

function defaultUseCasesFromDefinitions() {
  return enabledSeedDefinitions().map((d) => {
    let weight = d.hardFail ? null : d.weight;
    // Stage soft totals after removing #11–#20 from the seeded table
    if (d.id === 8 || d.id === 10) weight = 100;
    return {
      id: d.id,
      code: checkCode(d.id),
      name: d.name,
      description: d.description,
      stage: d.stage,
      riskCategory: d.riskCategory || (d.hardFail ? 'critical' : 'high'),
      hardFail: !!d.hardFail,
      weight,
    };
  });
}

function seedConfigStore() {
  const base = defaultUseCasesFromDefinitions();
  return {
    versions: [
      {
        id: 1,
        number: 1,
        startDate: '2026-03-03',
        endDate: '2026-06-14',
        useCases: cloneUseCases(base),
      },
      {
        id: 2,
        number: 2,
        startDate: '2026-06-15',
        endDate: '2026-08-11',
        useCases: cloneUseCases(base),
      },
      {
        id: 3,
        number: 3,
        startDate: CONFIG_TODAY,
        endDate: null,
        useCases: cloneUseCases(base),
      },
    ],
    currentId: 3,
  };
}

function getConfigStore() {
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (!raw) {
      const seeded = seedConfigStore();
      localStorage.setItem(CONFIG_KEY, JSON.stringify(seeded));
      return seeded;
    }
    const parsed = JSON.parse(raw);
    if (!parsed.versions?.length) return seedConfigStore();
    return parsed;
  } catch {
    return seedConfigStore();
  }
}

function syncWeightsFromVersion(version) {
  const weights = {};
  version.useCases.forEach((u) => {
    if (!u.hardFail) weights[u.id] = Number(u.weight) || 0;
  });
  localStorage.setItem(WEIGHTS_KEY, JSON.stringify(weights));
}

function persistConfig(store) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(store));
  const current = store.versions.find((v) => v.id === store.currentId);
  if (current) syncWeightsFromVersion(current);
  return store;
}

/** Inclusive coverage: startDate <= asOf and (no end or endDate >= asOf). */
function versionCoversDate(version, asOf = CONFIG_TODAY) {
  if (!version?.startDate) return false;
  if (version.startDate > asOf) return false;
  if (version.endDate && version.endDate < asOf) return false;
  return true;
}

/** Active config version for a given date (defaults to prototype today). */
function getVersionForDate(asOf = CONFIG_TODAY, store = getConfigStore()) {
  const covering = store.versions
    .filter((v) => versionCoversDate(v, asOf))
    .sort((a, b) => a.number - b.number);
  if (covering.length) return covering[covering.length - 1];

  const started = store.versions
    .filter((v) => v.startDate && v.startDate <= asOf)
    .sort((a, b) => a.number - b.number);
  if (started.length) return started[started.length - 1];

  return store.versions.find((v) => v.id === store.currentId) || store.versions[store.versions.length - 1];
}

function getCurrentConfigVersion(store = getConfigStore()) {
  return getVersionForDate(CONFIG_TODAY, store);
}

function getConfigVersionById(id, store = getConfigStore()) {
  return store.versions.find((v) => v.id === Number(id)) || null;
}

function getActiveUseCases(store = getConfigStore()) {
  return getCurrentConfigVersion(store).useCases;
}

function getWeights() {
  const active = getActiveUseCases();
  const fromConfig = Object.fromEntries(
    active.filter((u) => !u.hardFail).map((u) => [u.id, u.weight ?? 0])
  );
  return { ...DEFAULT_WEIGHTS, ...fromConfig };
}

function dayBefore(iso) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

/**
 * Apply a mutation to current use-cases and open a new version.
 * @param {object[]} nextUseCases
 * @param {{ startDate?: string, endDate?: string|null }} [dates]
 */
function commitConfigChange(nextUseCases, dates = {}) {
  const store = getConfigStore();
  const startDate = dates.startDate || CONFIG_TODAY;
  const endDate = dates.endDate || null;

  // Close any open/overlapping versions that start before the new one.
  store.versions.forEach((v) => {
    if (v.startDate < startDate && (!v.endDate || v.endDate >= startDate)) {
      v.endDate = dayBefore(startDate);
    }
  });

  const newNumber = Math.max(...store.versions.map((v) => v.number)) + 1;
  const newVersion = {
    id: Math.max(...store.versions.map((v) => v.id)) + 1,
    number: newNumber,
    startDate,
    endDate,
    useCases: cloneUseCases(nextUseCases),
  };

  store.versions.push(newVersion);
  store.currentId = getVersionForDate(CONFIG_TODAY, store).id;
  return persistConfig(store);
}

function resetConfigStore() {
  localStorage.removeItem(CONFIG_KEY);
  localStorage.removeItem(WEIGHTS_KEY);
  return getConfigStore();
}

function saveWeights(weights) {
  const current = getCurrentConfigVersion();
  const next = current.useCases.map((u) => {
    if (u.hardFail) return { ...u };
    return { ...u, weight: weights[u.id] ?? u.weight ?? 0 };
  });
  return commitConfigChange(next);
}

function resetWeights() {
  resetConfigStore();
  return getWeights();
}

function formatLongDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  const dd = String(d.getDate()).padStart(2, '0');
  const month = d.toLocaleString('en-GB', { month: 'long' });
  const yyyy = d.getFullYear();
  return `${dd}-${month}-${yyyy}`;
}

function isFutureVersion(version, asOf = CONFIG_TODAY) {
  return !!version?.startDate && version.startDate > asOf;
}

function formatVersionLabel(version, { isCurrent = false } = {}) {
  const start = formatLongDate(version.startDate);
  const end = !version.endDate ? 'Present' : formatLongDate(version.endDate);
  const scheduled = isFutureVersion(version) ? ' · Scheduled' : '';
  void isCurrent;
  return `Version ${version.number} (${start} – ${end})${scheduled}`;
}


/* ==== js/scoring.js ==== */


function scoreBand(score) {
  if (score >= 8) return 'green';
  if (score >= 5) return 'yellow';
  return 'red';
}

function scoreSoftGroup(softResults) {
  const evaluable = softResults.filter((r) => r.state !== 'cant_evaluate');
  const passed = evaluable.filter((r) => r.state === 'pass');
  const activeWeight = evaluable.reduce((sum, r) => sum + (r.weight || 0), 0);
  const earnedWeight = passed.reduce((sum, r) => sum + (r.weight || 0), 0);

  if (activeWeight === 0) {
    return { score: 6, tier: 'yellow', activeWeight: 0, earnedWeight: 0, evaluable: 0 };
  }
  const score = Math.round((earnedWeight / activeWeight) * 10);
  return {
    score: Math.min(10, Math.max(0, score)),
    tier: scoreBand(score),
    activeWeight,
    earnedWeight,
    evaluable: evaluable.length,
  };
}

/**
 * Stage-based scoring using the active config use-case set.
 */
function scoreClaim(claim, weights = DEFAULT_WEIGHTS, activeUseCases = null) {
  const active = activeUseCases || getActiveUseCases();
  const activeIds = new Set(active.map((u) => u.id));
  const metaById = Object.fromEntries(active.map((u) => [u.id, u]));
  const defById = Object.fromEntries(USE_CASE_LIBRARY.map((d) => [d.id, d]));

  const results = claim.checks
    .filter((c) => activeIds.has(c.checkId))
    .map((c) => {
      const def = defById[c.checkId];
      const meta = metaById[c.checkId];
      const hardFail = meta?.hardFail ?? def.hardFail;
      let state = c.state;
      let evidence = c.evidence;
      const missingDocs = missingRequiredDocsForCheck(claim, c.checkId);
      if (missingDocs.length && state !== 'fail') {
        state = 'cant_evaluate';
        evidence = `Cannot evaluate — required document missing: ${missingDocs.map((d) => d.name).join(', ')}.`;
      } else {
        const onFile = uploadedDocsForCheck(claim, c.checkId);
        if (onFile.length && !/Document on file:/i.test(evidence)) {
          evidence = `${evidence} · Document on file: ${onFile.map((d) => d.name).join(', ')}.`;
        }
      }
      return {
        ...c,
        state,
        evidence,
        name: meta?.name || def.name,
        code: meta?.code || checkCode(def.id),
        description: meta?.description || def.description,
        category: def.category,
        stage: meta?.stage || def.stage,
        riskCategory: meta?.riskCategory || def.riskCategory,
        hardFail,
        weight: hardFail ? null : weights[c.checkId] ?? meta?.weight ?? def.weight,
      };
    });

  const hardFails = results.filter((r) => r.hardFail && r.state === 'fail');
  const soft = results.filter((r) => !r.hardFail);
  const failedSoft = soft.filter((r) => r.state === 'fail');
  const passedSoft = soft.filter((r) => r.state === 'pass');
  const cantEval = soft.filter((r) => r.state === 'cant_evaluate');

  const stageScores = CLAIM_STAGES.map((stage) => {
    const stageResults = results.filter((r) => r.stage === stage.id);
    const stageSoft = stageResults.filter((r) => !r.hardFail);
    const stageHardFails = stageResults.filter((r) => r.hardFail && r.state === 'fail');
    const scored = scoreSoftGroup(stageSoft);
    return {
      stageId: stage.id,
      stageName: stage.name,
      ...scored,
      hardFailCount: stageHardFails.length,
      softFailCount: stageSoft.filter((r) => r.state === 'fail').length,
      cantEvaluateCount: stageSoft.filter((r) => r.state === 'cant_evaluate').length,
      checkCount: stageResults.length,
    };
  }).filter((s) => s.checkCount > 0);

  // Keep stages with only can't-evaluate soft checks in the average (score 6)
  // so missing documents cannot hide a stage and make the claim look like Pass.
  const stagesForAverage = stageScores.filter((s) => s.activeWeight > 0 || s.cantEvaluateCount > 0);
  let contextScore;
  if (stagesForAverage.length === 0) {
    contextScore = 6;
  } else {
    contextScore = Math.round(
      stagesForAverage.reduce((sum, s) => sum + s.score, 0) / stagesForAverage.length
    );
  }

  const softTier = scoreBand(contextScore);
  const forcedRed = hardFails.length > 0;
  const tier = forcedRed ? 'red' : softTier;

  return {
    score: contextScore,
    tier,
    forcedRed,
    hardFails,
    results,
    stageScores,
    summary: {
      hardFailCount: hardFails.length,
      softFailCount: failedSoft.length,
      softPassCount: passedSoft.length,
      softTotal: soft.length,
      cantEvaluateCount: cantEval.length,
    },
  };
}

function scoreAllClaims(weights, activeUseCases) {
  const w = weights || getStoreWeights();
  const active = activeUseCases || getActiveUseCases();
  return RAW_CLAIMS.map((claim) => {
    const scored = scoreClaim(claim, w, active);
    return { ...claim, ...scored };
  });
}

/** Aggregate fail counts per use-case across a claim set */
function useCaseFailStats(claims) {
  const active = getActiveUseCases();
  const defById = Object.fromEntries(USE_CASE_LIBRARY.map((d) => [d.id, d]));
  const stats = active.map((def) => ({
    checkId: def.id,
    code: checkCode(def.id),
    name: def.name,
    stage: def.stage,
    hardFail: def.hardFail,
    fail: 0,
    pass: 0,
    cant_evaluate: 0,
    total: 0,
  }));
  const byId = Object.fromEntries(stats.map((s) => [s.checkId, s]));

  claims.forEach((claim) => {
    claim.results.forEach((r) => {
      const row = byId[r.checkId];
      if (!row) return;
      row.total += 1;
      row[r.state] += 1;
    });
  });

  return stats
    .map((s) => ({
      ...s,
      stageName: CLAIM_STAGES.find((st) => st.id === s.stage)?.name || s.stage,
      failRate: s.total ? Math.round((s.fail / s.total) * 100) : 0,
      category: defById[s.checkId]?.category,
    }))
    .sort((a, b) => b.fail - a.fail || b.failRate - a.failRate);
}

function tierLabel(tier) {
  if (tier === 'red') return 'High risk';
  if (tier === 'yellow') return 'Medium risk';
  return 'Pass';
}

function formatAED(amount) {
  return (
    'AED ' +
    Number(amount).toLocaleString('en-AE', {
      maximumFractionDigits: 0,
    })
  );
}

function formatDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  const dd = String(d.getDate()).padStart(2, '0');
  const mon = d.toLocaleString('en-GB', { month: 'short' });
  const yy = String(d.getFullYear()).slice(-2);
  return `${dd}-${mon}-${yy}`;
}

function sortChecksForDisplay(results) {
  const stageOrder = Object.fromEntries(CLAIM_STAGES.map((s, i) => [s.id, i]));
  const rank = (r) => {
    if (r.state === 'fail' && r.hardFail) return 0;
    if (r.state === 'fail') return 1;
    if (r.state === 'cant_evaluate') return 2;
    return 3;
  };
  return [...results].sort((a, b) => {
    const sa = stageOrder[a.stage] ?? 99;
    const sb = stageOrder[b.stage] ?? 99;
    if (sa !== sb) return sa - sb;
    const ra = rank(a);
    const rb = rank(b);
    if (ra !== rb) return ra - rb;
    if (ra === 1) return (b.weight || 0) - (a.weight || 0);
    return a.checkId - b.checkId;
  });
}

function canAccess(role, feature) {
  const matrix = {
    queue: ['claim_user', 'claim_head', 'admin', 'fiu', 'surveyor'],
    claim: ['claim_user', 'claim_head', 'admin', 'fiu', 'surveyor'],
    dashboard: ['claim_head', 'admin', 'fiu'],
    report: ['claim_head', 'admin', 'fiu'],
    config: ['admin', 'fiu'],
  };
  return (matrix[feature] || []).includes(role);
}

function homeRouteForRole(role) {
  if (role === 'admin' || role === 'fiu') return '#/dashboard';
  return '#/queue';
}

/** Restrict a scored claim to selected stages (surveyor sees prior-stage scores until submit). */
function withVisibleStages(scored, stageIds) {
  const idSet = new Set(stageIds);
  const results = (scored.results || []).filter((r) => idSet.has(r.stage));
  const stageScores = (scored.stageScores || []).filter((s) => idSet.has(s.stageId));
  const hardFails = results.filter((r) => r.hardFail && r.state === 'fail');
  const soft = results.filter((r) => !r.hardFail);
  const stagesForAverage = stageScores.filter((s) => s.activeWeight > 0 || s.cantEvaluateCount > 0);
  let contextScore = 6;
  if (stagesForAverage.length) {
    contextScore = Math.round(stagesForAverage.reduce((sum, s) => sum + s.score, 0) / stagesForAverage.length);
  }
  const forcedRed = hardFails.length > 0;
  return {
    ...scored,
    results,
    stageScores,
    hardFails,
    score: contextScore,
    tier: forcedRed ? 'red' : scoreBand(contextScore),
    forcedRed,
    summary: {
      hardFailCount: hardFails.length,
      softFailCount: soft.filter((r) => r.state === 'fail').length,
      softPassCount: soft.filter((r) => r.state === 'pass').length,
      softTotal: soft.length,
      cantEvaluateCount: soft.filter((r) => r.state === 'cant_evaluate').length,
    },
  };
}

}

        </div>

/* ==== js/views/queue.js ==== */



function renderQueue(root, session, claims, state, onChange) {
  const isSurveyor = session.role === 'surveyor';
  const { scope, sort } = state;
  const pool = isSurveyor ? claims.filter(isReadyForSurveyor) : claims;
  const mine = pool.filter((c) => c.assignedTo === session.userId);
  const list = isSurveyor ? pool : scope === 'mine' ? mine : pool;

  const sorted = [...list].sort((a, b) => {
    if (sort === 'deadline') {
      if (a.dueInDays !== b.dueInDays) return a.dueInDays - b.dueInDays;
      return a.score - b.score;
    }
    // Highest risk: red first, then yellow, then green; within tier lower score first
    const tierRank = { red: 0, yellow: 1, green: 2 };
    if (tierRank[a.tier] !== tierRank[b.tier]) return tierRank[a.tier] - tierRank[b.tier];
    if (a.score !== b.score) return a.score - b.score;
    return a.dueInDays - b.dueInDays;
  });

  const counts = {
    red: list.filter((c) => c.tier === 'red').length,
    yellow: list.filter((c) => c.tier === 'yellow').length,
    green: list.filter((c) => c.tier === 'green').length,
  };

  const title = isSurveyor ? 'Surveyor queue' : scope === 'mine' ? 'My claims' : 'All claims';
  const subtitle = isSurveyor
    ? `${list.length} claim${list.length === 1 ? '' : 's'} that passed FNOL and Intimation · awaiting your documents`
    : scope === 'mine'
      ? `${mine.length} assigned to you · already scored`
      : `${pool.length} claims in portfolio · already scored`;

  const content = `
    <div class="page-header">
      <div>
        <h1>${title} <span style="color:var(--text-muted);font-weight:500;font-size:1.1rem">(${list.length})</span></h1>
        <p class="page-subtitle">${subtitle}</p>
      </div>
      ${
        isSurveyor
          ? ''
          : `<div class="segmented" role="group" aria-label="Claim scope">
        <button type="button" data-scope="mine" class="${scope === 'mine' ? 'active' : ''}">My claims</button>
        <button type="button" data-scope="all" class="${scope === 'all' ? 'active' : ''}">All claims</button>
      </div>`
      }
    </div>

    <div class="tier-strip">
      <div class="tier-stat"><span class="dot red"></span><strong>${counts.red}</strong> High risk</div>
      <div class="tier-stat"><span class="dot yellow"></span><strong>${counts.yellow}</strong> Medium risk</div>
      <div class="tier-stat"><span class="dot green"></span><strong>${counts.green}</strong> Pass</div>
    </div>

    <div class="toolbar">
      <div>
        <span class="toolbar-label">Sort</span>
        <div class="segmented" role="group" aria-label="Sort mode">
          <button type="button" data-sort="risk" class="${sort === 'risk' ? 'active' : ''}">Highest risk</button>
          <button type="button" data-sort="deadline" class="${sort === 'deadline' ? 'active' : ''}">Deadline</button>
        </div>
      </div>
    </div>

    <div class="claims-list">
      ${
        sorted.length === 0
          ? `<div class="empty-state">No claims in this view.</div>`
          : sorted
              .map((c) => {
                const dueClass = c.dueInDays <= 2 ? 'urgent' : '';
                const dueText =
                  c.dueInDays < 0
                    ? `overdue ${Math.abs(c.dueInDays)}d`
                    : c.dueInDays === 0
                      ? 'due today'
                      : `due in ${c.dueInDays}d`;
                return `
            <button type="button" class="claim-row" data-claim-id="${c.id}">
              <div class="score-circle sm ${c.tier}">${c.score}</div>
              <div class="claim-main">
                <div class="claim-id-line">
                  <span class="claim-id">${c.id}</span>
                  ${c.forcedRed ? `<span class="tag critical">Critical fail</span>` : ''}
                </div>
                <div class="claim-name">${c.claimant}</div>
              </div>
              <div class="claim-amount">${formatAED(c.amount)}</div>
              <div class="claim-tier ${c.tier}">${tierLabel(c.tier)}</div>
              <div class="due-badge ${dueClass}">${dueText}</div>
            </button>
          `;
              })
              .join('')
      }
    </div>
  `;

  root.innerHTML = renderShell(session, '#/queue', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  root.querySelectorAll('[data-scope]').forEach((btn) => {
    btn.addEventListener('click', () => onChange({ ...state, scope: btn.dataset.scope }));
  });
  root.querySelectorAll('[data-sort]').forEach((btn) => {
    btn.addEventListener('click', () => onChange({ ...state, sort: btn.dataset.sort }));
  });
  root.querySelectorAll('[data-claim-id]').forEach((btn) => {
    btn.addEventListener('click', () => {
      location.hash = `#/claim/${btn.dataset.claimId}`;
    });
  });
}


/* ==== js/views/claim.js ==== */



function stateIcon(state) {
  if (state === 'pass') return iconCheck();
  if (state === 'fail') return iconX();
  return iconAlert();
}

function requiredTag(def) {
  if (def.required === 'optional') return `<span class="tag doc-optional">Optional</span>`;
  if (def.required === 'conditional') return `<span class="tag doc-conditional">Conditional</span>`;
  return `<span class="tag doc-required">Required</span>`;
}

function docStatusLabel(status) {
  if (status === 'uploaded') return 'Uploaded';
  if (status === 'rejected') return 'Rejected';
  if (status === 'waived') return 'Waived';
  if (status === 'already_on_file') return 'Already on file';
  return 'Missing';
}

function docThumb(row) {
  const { def, rec, displayStatus } = row;
  if (displayStatus === 'already_on_file') {
    return `<div class="doc-chip on-file" title="Already on file">On file</div>`;
  }
  if (displayStatus === 'waived') {
    return `<div class="doc-chip waived">Waived</div>`;
  }
  if (displayStatus === 'missing') {
    return `<div class="doc-chip missing">${def.kind === 'pdf' ? 'PDF' : 'IMG'}</div>`;
  }
  const isPdf = def.kind === 'pdf' || (rec.filename && rec.filename.toLowerCase().endsWith('.pdf'));
  if (isPdf) {
    return `<div class="doc-chip pdf" title="${rec.filename || ''}"><span>PDF</span><span class="doc-chip-name">${rec.filename || 'Document.pdf'}</span></div>`;
  }
  return `<div class="doc-thumb" title="${rec.filename || rec.thumb || ''}"><span>${rec.thumb || 'Photo'}</span></div>`;
}

function documentChecklistHtml(claim, stageId, { readOnly = false } = {}) {
  const rows = getStageDocumentRows(claim, stageId);
  if (!rows.length) return '';
  return `
    <div class="doc-checklist">
      <div class="doc-checklist-label">Documents</div>
      ${rows
        .map((row) => {
          const clickable =
            !readOnly && (row.displayStatus === 'missing' || row.displayStatus === 'rejected');
          const statusNote =
            row.displayStatus === 'already_on_file'
              ? 'Captured at an earlier stage — not requested again.'
              : row.rec.note || '';
          return `
            <${clickable ? 'button type="button"' : 'div'}
              class="doc-row ${row.displayStatus}${clickable ? ' is-action' : ''}"
              ${clickable ? `data-action="upload-doc" data-doc-id="${row.def.id}"` : ''}
            >
              <div class="doc-row-main">
                <div class="doc-row-title">
                  <span class="doc-name">${row.def.name}${
                    row.def.minCount > 1 ? ` <span class="doc-min">(min ${row.def.minCount})</span>` : ''
                  }</span>
                  ${requiredTag(row.def)}
                  <span class="doc-status ${row.displayStatus}">${docStatusLabel(row.displayStatus)}</span>
                </div>
                ${statusNote ? `<p class="doc-note">${statusNote}</p>` : ''}
                <p class="doc-why">Why we need this: ${row.def.why}</p>
              </div>
              ${docThumb(row)}
            </${clickable ? 'button' : 'div'}>
          `;
        })
        .join('')}
    </div>
  `;
}

function renderClaimDetail(root, session, claim, filter, onFilter, { drawerOpen = false } = {}) {
  if (!claim) {
    root.innerHTML = renderShell(
      session,
      '#/queue',
      `<div class="empty-state">Claim not found. <a href="#/queue">Back to queue</a></div>`
    );
    root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
    return;
  }

  const isSurveyor = session.role === 'surveyor';
  const isClaimUser = session.role === 'claim_user' || isSurveyor;
  const surveyorCanWork =
    isSurveyor && hasPassedPriorStages(claim, ['fnol', 'intimation']) && !claim.surveyorSubmitted;
  const surveyorSubmitted = isSurveyor && !!claim.surveyorSubmitted;

  if (isSurveyor && !hasPassedPriorStages(claim, ['fnol', 'intimation'])) {
    root.innerHTML = renderShell(
      session,
      '#/queue',
      `<div class="empty-state">This claim has not passed FNOL and Intimation yet. <a href="#/queue">Back to surveyor queue</a></div>`
    );
    root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
    return;
  }

  const displayStages = isSurveyor
    ? CLAIM_STAGES.filter((s) => s.id !== 'settlement')
    : CLAIM_STAGES;
  const sorted = sortChecksForDisplay(claim.results);
  const counts = {
    all: claim.results.length,
    pass: claim.results.filter((r) => r.state === 'pass').length,
    fail: claim.results.filter((r) => r.state === 'fail').length,
    cant_evaluate: claim.results.filter((r) => r.state === 'cant_evaluate').length,
  };

  const filtered =
    filter === 'all' ? sorted : sorted.filter((r) => r.state === filter);

  const s = claim.summary;
  const summaryLine = [
    s.hardFailCount
      ? `${s.hardFailCount} critical fail${s.hardFailCount > 1 ? 's' : ''}`
      : null,
    `${s.softFailCount} of ${s.softTotal} soft checks failed`,
    s.cantEvaluateCount ? `${s.cantEvaluateCount} could not be evaluated` : null,
  ]
    .filter(Boolean)
    .join(' · ');

  const hardFailNames = claim.hardFails.map((h) => `${checkCode(h.checkId)} ${h.name}`).join('; ');

  const checksByStage = displayStages.map((stage) => {
    const items = filtered.filter((r) => r.stage === stage.id);
    return { stage, items };
  });

  const content = `
    <button type="button" class="back-link" data-action="back">${iconBack()} Back to claims</button>

    <div class="claim-detail-header">
      <div class="claim-detail-grid">
        <div class="meta-item">
          <label>Claim number</label>
          <div class="value">
            <button type="button" class="claim-link" data-action="open-drawer">${claim.id}</button>
          </div>
        </div>
        <div class="meta-item">
          <label>Policy number</label>
          <div class="value">${claim.policyNumber}</div>
        </div>
        <div class="meta-item">
          <label>Claimant</label>
          <div class="value">${claim.claimant}</div>
        </div>
        <div class="meta-item">
          <label>Claim amount</label>
          <div class="value">${formatAED(claim.amount)}</div>
        </div>
        ${
          isClaimUser
            ? ''
            : `<div class="meta-item">
          <label>Assigned to</label>
          <div class="value">${claim.assignedName}</div>
        </div>`
        }
        <div class="meta-item">
          <label>Loss date</label>
          <div class="value">${formatDate(claim.lossDate)}</div>
        </div>
        <div class="meta-item">
          <label>Vehicle</label>
          <div class="value">${claim.vehicle}</div>
        </div>
        <div class="meta-item">
          <label>Claim type</label>
          <div class="value">${
            { own_damage: 'Own damage', tp: 'Third party', theft: 'Theft', total_loss: 'Total loss' }[
              claim.claimType
            ] || claim.claimType || 'Own damage'
          }</div>
        </div>
      </div>
    </div>

    ${
      surveyorCanWork
        ? `<div class="surveyor-banner">
        <strong>Prior-stage scoring</strong>
        <p>This claim has passed FNOL and Intimation. Upload your Surveyor documents and submit to run the next-stage score.</p>
      </div>`
        : ''
    }
    ${
      surveyorSubmitted
        ? `<div class="surveyor-banner is-done">
        <strong>Submitted for further scoring</strong>
        <p>Surveyor documents are on file. Assessment scoring is now included and the claim has moved to the next stage.</p>
      </div>`
        : ''
    }
    ${
      claim.forcedRed
        ? `
      <div class="hardfail-banner">
        <div class="banner-icon">${iconAlert()}</div>
        <div>
          <strong>Critical check failed — routed to red</strong>
          <p>${hardFailNames}. The score below is a context score only; the hard fail overrides the tier.</p>
        </div>
      </div>
    `
        : ''
    }

    <div class="score-panel">
      <div class="score-circle lg ${claim.tier}">${claim.score}</div>
      <div class="score-panel-text">
        <h2>Fraud risk score <span style="font-weight:500;color:var(--text-muted);font-size:0.9rem">/ 10</span></h2>
        <div class="tier-label ${claim.tier}" style="color:var(--${claim.tier === 'yellow' ? 'amber' : claim.tier})">${tierLabel(claim.tier)}</div>
        <p class="summary-line">${summaryLine}${
          isSurveyor && !surveyorSubmitted
            ? ' · Score reflects FNOL and Intimation only'
            : ''
        }</p>
      </div>
    </div>

    <div class="stage-chips">
      ${(claim.stageScores || [])
        .map((st) => {
          const docs = getStageDocCompleteness(claim, st.stageId);
          return `
        <div class="stage-chip">
          <span class="stage-chip-name">${stageDisplayName(st.stageId)}</span>
          <span class="score-circle xs ${st.tier}">${st.score}</span>
          ${docs.total ? `<span class="doc-complete-chip">${docs.done}/${docs.total} docs</span>` : ''}
        </div>
      `;
        })
        .join('')}
    </div>

    <div class="result-filters">
      <button type="button" class="result-filter ${filter === 'all' ? 'active' : ''}" data-filter="all">
        All <span class="count">${counts.all}</span>
      </button>
      <button type="button" class="result-filter ${filter === 'pass' ? 'active' : ''}" data-filter="pass">
        Passed <span class="count">${counts.pass}</span>
      </button>
      <button type="button" class="result-filter ${filter === 'fail' ? 'active' : ''}" data-filter="fail">
        Failed <span class="count">${counts.fail}</span>
      </button>
      <button type="button" class="result-filter ${filter === 'cant_evaluate' ? 'active' : ''}" data-filter="cant_evaluate">
        Can't evaluate <span class="count">${counts.cant_evaluate}</span>
      </button>
    </div>

    <div class="checks-by-stage">
      ${checksByStage
              .map(({ stage, items }) => {
                const stageScore = (claim.stageScores || []).find((x) => x.stageId === stage.id);
                const docs = getStageDocCompleteness(claim, stage.id);
                return `
            <section class="stage-block">
              <div class="stage-block-header">
                <div>
                  <h3>${stageDisplayName(stage.id)}</h3>
                  <p>${stage.id === 'assessment' ? 'Surveyor inspection, repair photos & damage assessment' : stage.description}</p>
                </div>
                <div class="stage-block-score">
                  ${docs.total ? `<span class="doc-complete-chip">${docs.done}/${docs.total} docs</span>` : ''}
                  ${
                    stageScore
                      ? `<span class="score-circle sm ${stageScore.tier}">${stageScore.score}</span>`
                      : ''
                  }
                </div>
              </div>
              <div class="checks-list">
                ${
                  items.length === 0
                    ? filter === 'all'
                      ? ''
                      : `<div class="empty-checks">No checks in this result state.</div>`
                    : items
                        .map((r) => {
                          const metaLabel = r.hardFail ? 'Hard-fail' : '';
                          return `
                  <div class="check-row ${r.state}">
                    <div class="check-state-icon ${r.state}">${stateIcon(r.state)}</div>
                    <div class="check-body">
                      <div class="check-name">
                        <span class="check-code">${checkCode(r.checkId)}</span>
                        ${r.name}
                        ${r.hardFail && r.state === 'fail' ? `<span class="tag critical">Critical</span>` : ''}
                        ${r.hardFail && r.state !== 'fail' ? `<span class="tag knockout">Hard-fail</span>` : ''}
                      </div>
                      <p class="evidence">${r.evidence}</p>
                    </div>
                    <div class="check-weight">${metaLabel}</div>
                  </div>
                `;
                        })
                        .join('')
                }
              </div>
              ${documentChecklistHtml(claim, stage.id, {
                readOnly: isSurveyor && (stage.id !== 'assessment' || surveyorSubmitted),
              })}
              ${
                stage.id === 'assessment' && surveyorCanWork
                  ? `
                <div class="surveyor-submit">
                  <p>${
                    hasStageDocsComplete(claim, 'assessment')
                      ? 'Required Surveyor documents are on file. Submit to run further scoring and move this claim to the next stage.'
                      : 'Upload every required Surveyor document, then submit for further scoring.'
                  }</p>
                  <button type="button" class="btn btn-primary" data-action="submit-surveyor" ${
                    hasStageDocsComplete(claim, 'assessment') ? '' : 'disabled'
                  }>Submit for further scoring</button>
                </div>`
                  : ''
              }
            </section>
          `;
              })
              .join('')}
    </div>

    ${drawerOpen ? claimInfoDrawer(claim) : ''}
  `;

  root.innerHTML = renderShell(session, '#/queue', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  root.querySelector('[data-action="back"]').addEventListener('click', () => {
    location.hash = '#/queue';
  });
  root.querySelectorAll('[data-filter]').forEach((btn) => {
    btn.addEventListener('click', () => onFilter(btn.dataset.filter, { drawerOpen: false }));
  });
  root.querySelectorAll('[data-action="open-drawer"]').forEach((btn) => {
    btn.addEventListener('click', () => onFilter(filter, { drawerOpen: true }));
  });
  root.querySelectorAll('[data-action="close-drawer"]').forEach((btn) => {
    btn.addEventListener('click', () => onFilter(filter, { drawerOpen: false }));
  });
  root.querySelectorAll('[data-action="upload-doc"]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      mockUploadClaimDocument(claim.id, btn.dataset.docId);
      onFilter(filter, { drawerOpen });
    });
  });
  root.querySelector('[data-action="submit-surveyor"]')?.addEventListener('click', () => {
    const result = submitSurveyorAssessment(claim.id);
    onFilter(filter, { drawerOpen, surveyorMessage: result.message });
  });
}
