let chartInstance = null;

function destroyChart() {
  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }
}

function filterClaims(claims, period, branch) {
  const today = new Date('2026-08-11T12:00:00');
  let days = 30;
  if (period === '7') days = 7;
  if (period === 'quarter') days = 90;
  const cutoff = new Date(today);
  cutoff.setDate(cutoff.getDate() - days);

  return claims.filter((c) => {
    const filed = new Date(c.filedAt + 'T12:00:00');
    if (filed < cutoff) return false;
    if (branch !== 'All branches' && c.branch !== branch) return false;
    return true;
  });
}

function drawChart(canvas, mode) {
  destroyChart();
  if (!window.Chart || !canvas) return;

  if (!TREND_HISTORY.length) {
    return;
  }

  const labels = TREND_HISTORY.map((p) => formatDate(p.date));

  if (mode === 'share') {
    chartInstance = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'High risk %',
            data: TREND_HISTORY.map((p) => p.redPct),
            borderColor: '#b91c1c',
            backgroundColor: 'transparent',
            tension: 0.25,
            pointRadius: 3,
          },
          {
            label: 'Medium risk %',
            data: TREND_HISTORY.map((p) => p.yellowPct),
            borderColor: '#d97706',
            backgroundColor: 'transparent',
            tension: 0.25,
            pointRadius: 3,
          },
          {
            label: 'Pass %',
            data: TREND_HISTORY.map((p) => p.greenPct),
            borderColor: '#15803d',
            backgroundColor: 'transparent',
            tension: 0.25,
            pointRadius: 3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'IBM Plex Sans', size: 12 } } },
        },
        scales: {
          y: {
            min: 0,
            max: 100,
            ticks: { callback: (v) => v + '%' },
            grid: { color: '#eef2f6' },
          },
          x: { grid: { display: false } },
        },
      },
    });
  } else {
    chartInstance = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Claims scored',
            data: TREND_HISTORY.map((p) => p.volume),
            borderColor: '#16303D',
            backgroundColor: 'rgba(22, 48, 61, 0.08)',
            fill: true,
            tension: 0.25,
            pointRadius: 3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'IBM Plex Sans', size: 12 } } },
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { precision: 0 },
            grid: { color: '#eef2f6' },
          },
          x: { grid: { display: false } },
        },
      },
    });
  }
}

function renderDashboard(root, session, claims, state, onChange) {
  if (!canAccess(session.role, 'dashboard')) {
    location.hash = '#/queue';
    return;
  }

  const { period, branch, chartMode } = state;
  const filtered = filterClaims(claims, period, branch);

  const totalCount = filtered.length;
  const totalValue = filtered.reduce((s, c) => s + c.amount, 0);
  const red = filtered.filter((c) => c.tier === 'red');
  const yellow = filtered.filter((c) => c.tier === 'yellow');
  const green = filtered.filter((c) => c.tier === 'green');
  const cantEvalClaims = filtered.filter((c) => c.summary.cantEvaluateCount > 0);

  const redValue = red.reduce((s, c) => s + c.amount, 0);
  const yellowValue = yellow.reduce((s, c) => s + c.amount, 0);
  const greenValue = green.reduce((s, c) => s + c.amount, 0);

  const flaggedPct = totalCount ? Math.round((red.length / totalCount) * 100) : 0;
  const cantEvalPct = totalCount ? Math.round((cantEvalClaims.length / totalCount) * 100) : 0;

  const maxCount = Math.max(red.length, yellow.length, green.length, 1);
  const maxValue = Math.max(redValue, yellowValue, greenValue, 1);

  const hasTrend = TREND_HISTORY.length >= 2;
  const failStats = useCaseFailStats(filtered);
  const topFails = failStats.filter((s) => s.fail > 0).slice(0, 8);
  const maxFails = Math.max(...topFails.map((s) => s.fail), 1);

  const stageFailSummary = CLAIM_STAGES.map((stage) => {
    const rows = failStats.filter((s) => s.stage === stage.id);
    const fails = rows.reduce((n, r) => n + r.fail, 0);
    const total = rows.reduce((n, r) => n + r.total, 0);
    return {
      ...stage,
      fails,
      total,
      rate: total ? Math.round((fails / total) * 100) : 0,
      top: rows.slice().sort((a, b) => b.fail - a.fail)[0],
    };
  });

  const content = `
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p class="page-subtitle">Portfolio risk overview · use-case fail insight</p>
      </div>
    </div>

    <div class="filters-bar">
      <div class="filter-group">
        <label for="period">Time period</label>
        <select id="period">
          <option value="7" ${period === '7' ? 'selected' : ''}>Last 7 days</option>
          <option value="30" ${period === '30' ? 'selected' : ''}>Last 30 days</option>
          <option value="quarter" ${period === 'quarter' ? 'selected' : ''}>This quarter</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="branch">Branch / region</label>
        <select id="branch">
          ${BRANCHES.map((b) => `<option value="${b}" ${branch === b ? 'selected' : ''}>${b}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="stat-tiles">
      <div class="stat-tile">
        <div class="label">Claims scored</div>
        <div class="value">${totalCount}</div>
        <div class="sub">In selected period</div>
      </div>
      <div class="stat-tile">
        <div class="label">Total claim value</div>
        <div class="value" style="font-size:1.2rem">${formatAED(totalValue)}</div>
        <div class="sub">Sum of claim amounts</div>
      </div>
      <div class="stat-tile">
        <div class="label">Flagged high-risk</div>
        <div class="value">${flaggedPct}%</div>
        <div class="sub">${formatAED(redValue)} exposed</div>
      </div>
      <div class="stat-tile">
        <div class="label">Couldn't evaluate</div>
        <div class="value">${cantEvalPct}%</div>
        <div class="sub">Data-quality indicator</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Risk breakdown</h2>
      </div>
      <div class="risk-breakdown">
        ${[
          { key: 'red', label: 'High risk', count: red.length, value: redValue },
          { key: 'yellow', label: 'Medium risk', count: yellow.length, value: yellowValue },
          { key: 'green', label: 'Pass', count: green.length, value: greenValue },
        ]
          .map(
            (row) => `
          <div class="risk-row">
            <div class="risk-row-label"><span class="dot ${row.key}"></span>${row.label}</div>
            <div class="risk-metrics">
              <div class="risk-numbers">
                <span><strong>${row.count}</strong> claims</span>
                <span><strong>${formatAED(row.value)}</strong></span>
              </div>
              <div class="bar-track"><div class="bar-fill ${row.key}" style="width:${Math.round((row.value / maxValue) * 100)}%"></div></div>
              <div class="bar-track" style="height:5px;opacity:0.65"><div class="bar-fill ${row.key}" style="width:${Math.round((row.count / maxCount) * 100)}%;opacity:0.55"></div></div>
            </div>
          </div>
        `
          )
          .join('')}
      </div>
      <p style="margin:12px 0 0;font-size:0.75rem;color:var(--text-muted)">Bars: claim value (primary) · count (secondary)</p>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Use-case fails by stage</h2>
      </div>
      <div class="stage-fail-grid">
        ${stageFailSummary
          .map(
            (st) => `
          <div class="stage-fail-card">
            <div class="stage-fail-top">
              <strong>${st.name}</strong>
              <span>${st.fails} fails · ${st.rate}%</span>
            </div>
            <div class="bar-track"><div class="bar-fill red" style="width:${st.rate}%"></div></div>
            <p class="stage-fail-top-uc">${
              st.top && st.top.fail
                ? `Most fails: ${st.top.code} ${st.top.name} (${st.top.fail})`
                : 'No fails in period'
            }</p>
          </div>
        `
          )
          .join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Top failing use-cases</h2>
      </div>
      ${
        topFails.length === 0
          ? `<div class="chart-empty">No failed use-cases in this filter.</div>`
          : `<div class="usecase-fail-list">
        ${topFails
          .map(
            (row) => `
          <div class="usecase-fail-row">
            <div class="usecase-fail-meta">
              <span class="check-code">${row.code}</span>
              <div>
                <strong>${row.name}</strong>
                <small>${row.stageName} · ${row.failRate}% fail rate</small>
              </div>
            </div>
            <div class="usecase-fail-bar-wrap">
              <div class="bar-track"><div class="bar-fill red" style="width:${Math.round((row.fail / maxFails) * 100)}%"></div></div>
              <strong>${row.fail}</strong>
            </div>
          </div>
        `
          )
          .join('')}
      </div>`
      }
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Risk trend</h2>
        <div class="segmented" role="group" aria-label="Chart mode">
          <button type="button" data-chart="share" class="${chartMode === 'share' ? 'active' : ''}">Risk share %</button>
          <button type="button" data-chart="volume" class="${chartMode === 'volume' ? 'active' : ''}">Claim volume</button>
        </div>
      </div>
      ${
        hasTrend
          ? `<div class="chart-wrap"><canvas id="trend-chart"></canvas></div>`
          : `<div class="chart-empty">Not enough history yet to show a reliable trend.</div>`
      }
    </div>
  `;

  root.innerHTML = renderShell(session, '#/dashboard', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  root.querySelector('#period').addEventListener('change', (e) => {
    onChange({ ...state, period: e.target.value });
  });
  root.querySelector('#branch').addEventListener('change', (e) => {
    onChange({ ...state, branch: e.target.value });
  });
  root.querySelectorAll('[data-chart]').forEach((btn) => {
    btn.addEventListener('click', () => onChange({ ...state, chartMode: btn.dataset.chart }));
  });

  if (hasTrend) {
    requestAnimationFrame(() => {
      const canvas = root.querySelector('#trend-chart');
      drawChart(canvas, chartMode);
    });
  } else {
    destroyChart();
  }
}

function stageName(id) {
  return CLAIM_STAGES.find((s) => s.id === id)?.name || id;
}

function categoryLabel(id) {
  return RISK_CATEGORIES.find((c) => c.id === id)?.name || id;
}

function iconHistory() {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 109-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 5v4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function iconDots() {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>`;
}

function iconFilter() {
  return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
}

/** @type {{ stage: string, riskCategory: string, query: string }} */
let filters = { stage: 'all', riskCategory: 'all', query: '' };
/** @type {number|null} viewing historical version id */
let viewingVersionId = null;
let openMenuId = null;
let modal = null; // { type: 'add'|'edit'|'delete', useCaseId?, draft? }
let prevVersionsOpen = false;
let feedback = null;
let ucPickerOpen = false;

function getViewVersion() {
  const store = getConfigStore();
  if (viewingVersionId && viewingVersionId !== store.currentId) {
    return getConfigVersionById(viewingVersionId, store);
  }
  return getCurrentConfigVersion(store);
}

function isReadOnly() {
  const store = getConfigStore();
  return viewingVersionId != null && viewingVersionId !== store.currentId;
}

function filteredRows(useCases) {
  return useCases.filter((u) => {
    if (filters.stage !== 'all' && u.stage !== filters.stage) return false;
    if (filters.riskCategory !== 'all' && u.riskCategory !== filters.riskCategory) return false;
    if (filters.query) {
      const q = filters.query.toLowerCase();
      const blob = `${u.code} ${u.name} ${u.description}`.toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function defaultVersionDates() {
  return { startDate: '', endDate: '' };
}

function readVersionDates(root) {
  const startDate = root.querySelector('#modal-start-date')?.value || '';
  const endRaw = root.querySelector('#modal-end-date')?.value || '';
  return {
    startDate,
    endDate: endRaw || null,
  };
}

function validateVersionDates(dates) {
  if (!dates.startDate) return 'Please select a start date for the new version.';
  if (!dates.endDate) return 'Please select an end date for the new version.';
  if (dates.endDate < dates.startDate) {
    return 'End date must be on or after the start date.';
  }
  return null;
}

function hasCompleteVersionDates(draft = {}) {
  return !!(draft.startDate && draft.endDate && draft.endDate >= draft.startDate);
}

function applyMutation(mutator, dates) {
  const store = getConfigStore();
  const current = getCurrentConfigVersion(store);
  const next = mutator(cloneUseCases(current.useCases));
  const result = commitConfigChange(next, dates);
  const created = result.versions[result.versions.length - 1];
  viewingVersionId = null;
  const endLabel = created.endDate ? formatLongDate(created.endDate) : 'Present';
  const when = isFutureVersion(created) ? 'scheduled' : 'created';
  feedback = {
    type: 'success',
    message: `Version ${created.number} ${when} (${formatLongDate(created.startDate)} – ${endLabel}).`,
  };
}

function cloneUseCases(list) {
  return list.map((u) => ({ ...u }));
}

function versionNoticeHtml() {
  return `
    <div class="version-notice" role="status">
      Your changes will be saved as a new version. Select the start date and end date for this new version to continue.
    </div>
  `;
}

function versionDateFieldsHtml(draft = {}) {
  const start = draft.startDate || '';
  const end = draft.endDate || '';
  const err = draft.dateError
    ? `<p class="version-dates-error">${draft.dateError}</p>`
    : '';
  return `
    <div class="version-dates-block">
      <div class="version-dates-title">Select version dates</div>
      <p class="version-dates-hint">Both dates are required before a new version can be created. Use a future start date to schedule this version.</p>
      <div class="field-row field-row-2">
        <div class="field">
          <label for="modal-start-date">Start date <span class="required-mark">*</span></label>
          <input type="date" id="modal-start-date" value="${start}" required />
        </div>
        <div class="field">
          <label for="modal-end-date">End date <span class="required-mark">*</span></label>
          <input type="date" id="modal-end-date" value="${end}" required />
        </div>
      </div>
      ${err}
    </div>
  `;
}

function useCasePickerHtml(currentUseCases, draft = {}) {
  const catalog = USE_CASE_LIBRARY.filter((d) => !currentUseCases.some((u) => u.id === d.id));
  const enabled = catalog.filter((d) => isTenantEnabledUseCase(d));
  const locked = catalog.filter((d) => !isTenantEnabledUseCase(d));
  const selected = draft.id ? USE_CASE_LIBRARY.find((d) => d.id === Number(draft.id)) : null;
  const selectedEnabled = selected ? isTenantEnabledUseCase(selected) : null;

  const optionBtn = (d) => {
    const enabledUc = isTenantEnabledUseCase(d);
    const selectedCls = Number(draft.id) === d.id ? 'is-selected' : '';
    return `
      <button type="button"
        class="uc-picker-option ${enabledUc ? 'is-enabled' : 'is-locked'} ${selectedCls}"
        data-pick-uc="${d.id}">
        <span class="uc-status-dot" aria-hidden="true"></span>
        <span class="uc-picker-option-text">
          <span class="uc-picker-code">${checkCode(d.id)}</span>
          <span class="uc-picker-name">${d.name}</span>
        </span>
        <span class="uc-picker-badge">${enabledUc ? 'Available' : 'Not enabled'}</span>
      </button>
    `;
  };

  const triggerLabel = selected
    ? `${checkCode(selected.id)} — ${selected.name}`
    : 'Select use-case…';

  return `
    <div class="field">
      <label>Use-case</label>
      <div class="uc-picker ${ucPickerOpen ? 'is-open' : ''}">
        <button type="button" class="uc-picker-trigger ${selected ? (selectedEnabled ? 'is-enabled' : 'is-locked') : ''}" data-action="toggle-uc-picker" aria-expanded="${ucPickerOpen ? 'true' : 'false'}">
          <span class="uc-status-dot" aria-hidden="true"></span>
          <span class="uc-picker-trigger-label">${triggerLabel}</span>
          <span class="uc-picker-caret" aria-hidden="true">▾</span>
        </button>
        ${
          ucPickerOpen
            ? `
          <div class="uc-picker-menu" role="listbox">
            <div class="uc-picker-legend">
              <span><span class="uc-status-dot is-enabled"></span> Available (enabled)</span>
              <span><span class="uc-status-dot is-locked"></span> Not enabled</span>
            </div>
            ${
              enabled.length
                ? `<div class="uc-picker-group-label">Available</div>${enabled.map(optionBtn).join('')}`
                : `<div class="uc-picker-empty">No available use-cases left to add.</div>`
            }
            ${
              locked.length
                ? `<div class="uc-picker-group-label">Not enabled for your organisation</div>${locked.map(optionBtn).join('')}`
                : ''
            }
            ${!enabled.length && !locked.length ? `<div class="uc-picker-empty">All catalog use-cases are already configured.</div>` : ''}
          </div>
        `
            : ''
        }
      </div>
    </div>
  `;
}

function renderConfig(root, session) {
  if (!canAccess(session.role, 'config')) {
    location.hash = '#/queue';
    return;
  }

  const store = getConfigStore();
  const current = getCurrentConfigVersion(store);
  const view = getViewVersion() || current;
  const readOnly = isReadOnly();
  const previous = store.versions
    .filter((v) => v.id !== store.currentId)
    .sort((a, b) => b.number - a.number);
  const rows = filteredRows(view.useCases);

  const content = `
    <div class="page-header config-page-header">
      <div>
        <h1>Configuration</h1>
        <p class="page-subtitle">Manage use-cases, categories, and stage weightage</p>
      </div>
      ${
        readOnly
          ? `<button type="button" class="btn btn-secondary" data-action="back-current">Back to current version</button>`
          : `<button type="button" class="btn btn-primary" data-action="add-uc">+ Add Use-Case</button>`
      }
    </div>

    <div class="config-toolbar">
      <div class="version-controls">
        <div class="current-version-pill">
          ${formatVersionLabel(readOnly ? view : current, { isCurrent: !readOnly })}
          ${readOnly ? '<span class="readonly-tag">Read-only</span>' : ''}
          ${isFutureVersion(view) ? '<span class="readonly-tag">Scheduled</span>' : ''}
        </div>
        <div class="prev-versions-wrap">
          <button type="button" class="btn btn-secondary prev-versions-btn" data-action="toggle-prev">
            ${iconHistory()}
            Previous Versions
          </button>
          ${
            prevVersionsOpen
              ? `
            <div class="prev-versions-menu">
              ${
                previous.length === 0
                  ? `<div class="prev-empty">No previous versions yet.</div>`
                  : previous
                      .map(
                        (v) => `
                    <button type="button" class="prev-version-item" data-view-version="${v.id}">
                      ${formatVersionLabel(v)}
                    </button>
                  `
                      )
                      .join('')
              }
            </div>
          `
              : ''
          }
        </div>
      </div>
      ${feedback ? `<span class="save-feedback ${feedback.type}">${feedback.message}</span>` : ''}
    </div>

    <div class="config-table-card">
      <div class="config-table-filters">
        <div class="filter-group">
          <label>Search</label>
          <input type="search" id="uc-search" placeholder="Search use-cases…" value="${filters.query.replace(/"/g, '&quot;')}" />
        </div>
        <div class="filter-group">
          <label>Stage ${iconFilter()}</label>
          <select id="filter-stage">
            <option value="all">All stages</option>
            ${CLAIM_STAGES.map((s) => `<option value="${s.id}" ${filters.stage === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
          </select>
        </div>
        <div class="filter-group">
          <label>Category ${iconFilter()}</label>
          <select id="filter-category">
            <option value="all">All categories</option>
            ${RISK_CATEGORIES.map((c) => `<option value="${c.id}" ${filters.riskCategory === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="config-table-wrap">
        <table class="config-table">
          <thead>
            <tr>
              <th class="col-menu"></th>
              <th>Use-case no.</th>
              <th>Use-case name</th>
              <th>Use-case description</th>
              <th>Stage</th>
              <th>Category</th>
              <th>Weightage</th>
            </tr>
          </thead>
          <tbody>
            ${
              rows.length === 0
                ? `<tr><td colspan="7" class="empty-cell">No use-cases match the current filters.</td></tr>`
                : rows
                    .map((u) => {
                      const catClass = `cat-${u.riskCategory}`;
                      return `
                <tr>
                  <td class="col-menu">
                    ${
                      readOnly
                        ? ''
                        : `
                      <div class="row-menu-wrap">
                        <button type="button" class="row-menu-btn" data-menu="${u.id}" aria-label="Actions">${iconDots()}</button>
                        ${
                          openMenuId === u.id
                            ? `
                          <div class="row-menu">
                            <button type="button" data-edit="${u.id}">Edit category / weightage</button>
                            <button type="button" class="danger" data-delete="${u.id}">Delete use-case</button>
                          </div>
                        `
                            : ''
                        }
                      </div>
                    `
                    }
                  </td>
                  <td><span class="check-code">${u.code}</span></td>
                  <td class="uc-name">${u.name}</td>
                  <td class="uc-desc">${u.description || '—'}</td>
                  <td>${stageName(u.stage)}</td>
                  <td><span class="cat-pill ${catClass}">${categoryLabel(u.riskCategory)}</span></td>
                  <td class="uc-weight">${u.hardFail ? '—' : `${u.weight ?? 0}%`}</td>
                </tr>
              `;
                    })
                    .join('')
            }
          </tbody>
        </table>
      </div>
    </div>

    ${renderModalHtml(view.useCases)}
  `;

  root.innerHTML = renderShell(session, '#/config', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
  bindConfigEvents(root, session, view.useCases);
}

function renderModalHtml(currentUseCases) {
  if (!modal) return '';

  const draft = modal.draft || defaultVersionDates();
  const step = modal.step || 'form';

  // Step 2: require start/end dates before creating the version
  if (step === 'version-dates') {
    const summary =
      modal.type === 'delete'
        ? `Delete use-case from configuration`
        : modal.type === 'add'
          ? `Add ${draft.code || ''} ${draft.name || 'use-case'}`
          : `Update ${draft.code || ''} ${draft.name || 'use-case'}`;
    return `
      <div class="modal-backdrop" data-action="close-modal">
        <div class="modal-card modal-card-wide" onclick="event.stopPropagation()">
          <h2>Create new version</h2>
          ${versionNoticeHtml()}
          <p class="modal-copy"><strong>Change:</strong> ${summary}</p>
          ${versionDateFieldsHtml(draft)}
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="back-form-step">Back</button>
            <button type="button" class="btn btn-primary" data-action="confirm-version" ${hasCompleteVersionDates(draft) ? '' : 'disabled'}>
              Create version
            </button>
          </div>
        </div>
      </div>
    `;
  }

  if (modal.type === 'delete') {
    const uc = currentUseCases.find((u) => u.id === modal.useCaseId);
    return `
      <div class="modal-backdrop" data-action="close-modal">
        <div class="modal-card modal-card-wide" onclick="event.stopPropagation()">
          <h2>Delete use-case?</h2>
          <div class="version-notice" role="status">Your changes will be saved as a new version.</div>
          <p class="modal-copy">Remove <strong>${uc?.code} ${uc?.name}</strong> from the configuration? You’ll set the new version’s start and end dates next.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-danger" data-action="continue-version-dates">Continue</button>
          </div>
        </div>
      </div>
    `;
  }

  const isAdd = modal.type === 'add';
  const selectedDef = draft.id ? USE_CASE_LIBRARY.find((d) => d.id === Number(draft.id)) : null;
  const isCriticalHard = selectedDef?.hardFail || draft.hardFail;
  const selectedEnabled = selectedDef ? isTenantEnabledUseCase(selectedDef) : false;
  const isLockedSelection = isAdd && selectedDef && !selectedEnabled;

  let primaryLabel = 'Continue';
  let primaryAction = 'continue-version-dates';
  let primaryDisabled = false;
  let primaryClass = 'btn btn-primary';

  if (isAdd) {
    if (!selectedDef) {
      primaryLabel = 'Add Use-Case';
      primaryDisabled = true;
      primaryAction = 'continue-version-dates';
    } else if (isLockedSelection) {
      primaryLabel = 'Raise a Request';
      primaryAction = 'raise-request';
      primaryClass = 'btn btn-primary btn-request';
      primaryDisabled = false;
    } else {
      primaryLabel = 'Add Use-Case';
      primaryDisabled = false;
      primaryAction = 'continue-version-dates';
    }
  }

  return `
    <div class="modal-backdrop" data-action="close-modal">
      <div class="modal-card modal-card-wide" onclick="event.stopPropagation()">
        <h2>${isAdd ? 'Add use-case' : 'Edit use-case'}</h2>
        ${
          isLockedSelection
            ? `<p class="modal-copy">This use-case is not enabled for your organisation. Raise a request to Azentio to enable it.</p>`
            : `<div class="version-notice" role="status">Your changes will be saved as a new version.</div>
               <p class="modal-copy">${isAdd ? 'Select an available (green) use-case and set category / weightage.' : 'Update category or weightage.'}</p>`
        }

        ${isAdd ? useCasePickerHtml(currentUseCases, draft) : `
        <div class="field">
          <label>Use-case</label>
          <div class="value-readonly"><span class="check-code">${draft.code}</span> ${draft.name}</div>
        </div>`}

        <div class="field">
          <label>Description</label>
          <textarea id="modal-desc" rows="3" readonly>${(draft.description || selectedDef?.description || '').replace(/</g, '&lt;')}</textarea>
        </div>

        ${
          isLockedSelection
            ? ''
            : `
        <div class="field-row">
          <div class="field">
            <label>Stage</label>
            <select id="modal-stage" ${isAdd && !selectedDef ? 'disabled' : ''}>
              ${CLAIM_STAGES.map((s) => `<option value="${s.id}" ${(draft.stage || selectedDef?.stage) === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Category</label>
            <select id="modal-category" ${isAdd && !selectedDef ? 'disabled' : ''}>
              ${RISK_CATEGORIES.map((c) => `<option value="${c.id}" ${(draft.riskCategory || selectedDef?.riskCategory || 'high') === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Weightage %</label>
            <input type="number" id="modal-weight" min="0" max="100" step="1"
              value="${isCriticalHard ? '' : draft.weight ?? selectedDef?.weight ?? 0}"
              ${isCriticalHard || (isAdd && !selectedDef) ? 'disabled placeholder="N/A"' : ''} />
          </div>
        </div>
        `
        }

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
          <button type="button" class="${primaryClass}" data-action="${primaryAction}" ${primaryDisabled ? 'disabled' : ''}>${primaryLabel}</button>
        </div>
      </div>
    </div>
  `;
}

function bindConfigEvents(root, session, currentUseCases) {
  const rerender = () => renderConfig(root, session);

  root.querySelector('#uc-search')?.addEventListener('input', (e) => {
    filters.query = e.target.value;
    rerender();
  });
  root.querySelector('#filter-stage')?.addEventListener('change', (e) => {
    filters.stage = e.target.value;
    rerender();
  });
  root.querySelector('#filter-category')?.addEventListener('change', (e) => {
    filters.riskCategory = e.target.value;
    rerender();
  });

  root.querySelector('[data-action="toggle-prev"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    prevVersionsOpen = !prevVersionsOpen;
    openMenuId = null;
    rerender();
  });

  root.querySelectorAll('[data-view-version]').forEach((btn) => {
    btn.addEventListener('click', () => {
      viewingVersionId = Number(btn.dataset.viewVersion);
      prevVersionsOpen = false;
      feedback = null;
      rerender();
    });
  });

  root.querySelector('[data-action="back-current"]')?.addEventListener('click', () => {
    viewingVersionId = null;
    feedback = null;
    rerender();
  });

  root.querySelector('[data-action="add-uc"]')?.addEventListener('click', () => {
    openMenuId = null;
    ucPickerOpen = false;
    modal = {
      type: 'add',
      step: 'form',
      draft: { riskCategory: 'high', weight: 0, stage: 'fnol', ...defaultVersionDates() },
    };
    rerender();
  });

  root.querySelectorAll('[data-menu]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.menu);
      openMenuId = openMenuId === id ? null : id;
      prevVersionsOpen = false;
      rerender();
    });
  });

  root.querySelectorAll('[data-edit]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.edit);
      const uc = currentUseCases.find((u) => u.id === id);
      openMenuId = null;
      ucPickerOpen = false;
      modal = { type: 'edit', step: 'form', useCaseId: id, draft: { ...uc, ...defaultVersionDates() } };
      rerender();
    });
  });

  root.querySelectorAll('[data-delete]').forEach((btn) => {
    btn.addEventListener('click', () => {
      openMenuId = null;
      ucPickerOpen = false;
      modal = {
        type: 'delete',
        step: 'form',
        useCaseId: Number(btn.dataset.delete),
        draft: defaultVersionDates(),
      };
      rerender();
    });
  });

  root.querySelectorAll('[data-action="close-modal"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      modal = null;
      ucPickerOpen = false;
      rerender();
    });
  });

  root.querySelector('[data-action="toggle-uc-picker"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    ucPickerOpen = !ucPickerOpen;
    rerender();
  });

  root.querySelectorAll('[data-pick-uc]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.pickUc);
      const def = USE_CASE_LIBRARY.find((d) => d.id === id);
      if (!def) return;
      modal.draft = {
        ...(modal.draft || {}),
        id: def.id,
        code: checkCode(def.id),
        name: def.name,
        description: def.description,
        stage: def.stage,
        riskCategory: def.riskCategory,
        hardFail: def.hardFail,
        weight: def.hardFail ? null : def.weight,
        startDate: '',
        endDate: '',
        dateError: null,
      };
      ucPickerOpen = false;
      rerender();
    });
  });

  function captureFormDraft() {
    const stage = root.querySelector('#modal-stage')?.value;
    const riskCategory = root.querySelector('#modal-category')?.value;
    const weightRaw = root.querySelector('#modal-weight')?.value;
    const weight = weightRaw === '' || weightRaw == null ? null : parseInt(weightRaw, 10);
    modal.draft = {
      ...(modal.draft || {}),
      stage: stage || modal.draft?.stage,
      riskCategory: riskCategory || modal.draft?.riskCategory,
      weight: modal.draft?.hardFail ? null : Number.isFinite(weight) ? weight : modal.draft?.weight,
      dateError: null,
    };
  }

  root.querySelector('[data-action="continue-version-dates"]')?.addEventListener('click', () => {
    if (modal.type === 'add') {
      const id = Number(modal.draft?.id);
      const def = USE_CASE_LIBRARY.find((d) => d.id === id);
      if (!def || !isTenantEnabledUseCase(def)) {
        feedback = { type: 'error', message: 'Select an available (green) use-case to add.' };
        rerender();
        return;
      }
      captureFormDraft();
      if (!def.hardFail) {
        const w = modal.draft.weight;
        if (!Number.isFinite(w) || w < 0) {
          feedback = { type: 'error', message: 'Enter a whole-number weightage.' };
          rerender();
          return;
        }
      }
    } else if (modal.type === 'edit') {
      captureFormDraft();
    } else if (modal.type === 'delete') {
      const uc = currentUseCases.find((u) => u.id === modal.useCaseId);
      modal.draft = {
        ...(modal.draft || defaultVersionDates()),
        code: uc?.code,
        name: uc?.name,
        dateError: null,
      };
    }
    modal.step = 'version-dates';
    ucPickerOpen = false;
    rerender();
  });

  root.querySelector('[data-action="back-form-step"]')?.addEventListener('click', () => {
    const dates = readVersionDates(root);
    modal.draft = {
      ...(modal.draft || {}),
      startDate: dates.startDate || '',
      endDate: dates.endDate || '',
      dateError: null,
    };
    modal.step = 'form';
    rerender();
  });

  const syncVersionDateDraft = () => {
    const dates = readVersionDates(root);
    modal.draft = {
      ...(modal.draft || {}),
      startDate: dates.startDate || '',
      endDate: dates.endDate || '',
      dateError: null,
    };
    const btn = root.querySelector('[data-action="confirm-version"]');
    if (btn) btn.disabled = !hasCompleteVersionDates(modal.draft);
  };

  root.querySelector('#modal-start-date')?.addEventListener('change', syncVersionDateDraft);
  root.querySelector('#modal-end-date')?.addEventListener('change', syncVersionDateDraft);
  root.querySelector('#modal-start-date')?.addEventListener('input', syncVersionDateDraft);
  root.querySelector('#modal-end-date')?.addEventListener('input', syncVersionDateDraft);

  root.querySelector('[data-action="confirm-version"]')?.addEventListener('click', () => {
    const dates = readVersionDates(root);
    const dateError = validateVersionDates(dates);
    if (dateError) {
      modal.draft = {
        ...(modal.draft || {}),
        startDate: dates.startDate || '',
        endDate: dates.endDate || '',
        dateError,
      };
      rerender();
      return;
    }

    if (modal.type === 'add') {
      const def = USE_CASE_LIBRARY.find((d) => d.id === Number(modal.draft?.id));
      if (!def || !isTenantEnabledUseCase(def)) {
        feedback = { type: 'error', message: 'Select an available (green) use-case to add.' };
        modal = null;
        rerender();
        return;
      }
      applyMutation(
        (list) => [
          ...list,
          {
            id: def.id,
            code: checkCode(def.id),
            name: def.name,
            description: def.description,
            stage: modal.draft.stage || def.stage,
            riskCategory: modal.draft.riskCategory || def.riskCategory,
            hardFail: def.hardFail,
            weight: def.hardFail ? null : modal.draft.weight,
          },
        ],
        dates
      );
    } else if (modal.type === 'edit') {
      const id = modal.useCaseId;
      applyMutation(
        (list) =>
          list.map((u) => {
            if (u.id !== id) return u;
            return {
              ...u,
              stage: modal.draft.stage || u.stage,
              riskCategory: modal.draft.riskCategory || u.riskCategory,
              weight: u.hardFail ? null : modal.draft.weight,
            };
          }),
        dates
      );
    } else if (modal.type === 'delete') {
      const id = modal.useCaseId;
      applyMutation((list) => list.filter((u) => u.id !== id), dates);
    }

    modal = null;
    ucPickerOpen = false;
    rerender();
  });

  root.querySelector('[data-action="raise-request"]')?.addEventListener('click', () => {
    const def = USE_CASE_LIBRARY.find((d) => d.id === Number(modal?.draft?.id));
    feedback = {
      type: 'success',
      message: def
        ? `Request raised for ${checkCode(def.id)} — ${def.name}. Azentio will follow up to enable it.`
        : 'Request raised. Azentio will follow up.',
    };
    modal = null;
    ucPickerOpen = false;
    rerender();
  });

  // Keep picker open clicks from bubbling; close menus on outside click
  root.querySelector('.uc-picker-menu')?.addEventListener('click', (e) => e.stopPropagation());

  root.querySelector('.main')?.addEventListener(
    'click',
    () => {
      if (openMenuId != null || prevVersionsOpen || ucPickerOpen) {
        openMenuId = null;
        prevVersionsOpen = false;
        ucPickerOpen = false;
        rerender();
      }
    },
    { once: true }
  );
}

function renderReport(root, session, claims) {
  if (!canAccess(session.role, 'report')) {
    location.hash = '#/queue';
    return;
  }

  const byTier = {
    red: claims.filter((c) => c.tier === 'red'),
    yellow: claims.filter((c) => c.tier === 'yellow'),
    green: claims.filter((c) => c.tier === 'green'),
  };

  const rows = [...claims].sort((a, b) => {
    const rank = { red: 0, yellow: 1, green: 2 };
    return rank[a.tier] - rank[b.tier] || a.score - b.score;
  });

  const failStats = useCaseFailStats(claims);
  const topFails = failStats.filter((s) => s.fail > 0);

  const content = `
    <div class="page-header">
      <div>
        <h1>Detailed report</h1>
        <p class="page-subtitle">Scored portfolio snapshot · ${formatDate('2026-08-11')}</p>

      <div class="tier-stat"><span class="dot yellow"></span><strong>${byTier.yellow.length}</strong> Medium risk · ${formatAED(byTier.yellow.reduce((s, c) => s + c.amount, 0))}</div>

      <div class="panel-header"><h2>Use-case fail ranking</h2></div>
      <div class="panel" style="padding:0;overflow:auto;border:none;margin:0">
        <table style="width:100%;border-collapse:collapse;font-size:0.875rem">
          <thead>
            <tr style="background:var(--surface-muted);text-align:left">
              <th style="padding:12px 16px;border-bottom:1px solid var(--border)">#</th>
              <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Use-case</th>
              <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Stage</th>
              <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Fails</th>
              <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Can't eval</th>
              <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Fail rate</th>
            </tr>
          </thead>
          <tbody>
            ${topFails
              .map(
                (r) => `
              <tr>
                <td style="padding:10px 16px;border-bottom:1px solid var(--border)"><span class="check-code">${r.code}</span></td>
                <td style="padding:10px 16px;border-bottom:1px solid var(--border)">${r.name}${r.hardFail ? ' <span class="tag critical">Hard-fail</span>' : ''}</td>
                <td style="padding:10px 16px;border-bottom:1px solid var(--border)">${r.stageName}</td>
                <td style="padding:10px 16px;border-bottom:1px solid var(--border);font-weight:700;color:var(--red)">${r.fail}</td>
                <td style="padding:10px 16px;border-bottom:1px solid var(--border)">${r.cant_evaluate}</td>
                <td style="padding:10px 16px;border-bottom:1px solid var(--border)">${r.failRate}%</td>
              </tr>
            `
              )
              .join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel" style="padding:0;overflow:auto">
      <table style="width:100%;border-collapse:collapse;font-size:0.875rem">
        <thead>
          <tr style="background:var(--surface-muted);text-align:left">
            <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Claim</th>
            <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Policy</th>
            <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Claimant</th>
            <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Branch</th>
            <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Amount</th>
            <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Score</th>
            <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Tier</th>
            <th style="padding:12px 16px;border-bottom:1px solid var(--border)">Notes</th>
          </tr>
        </thead>
        <tbody>
          ${rows
            .map(
              (c) => `
            <tr>
              <td style="padding:10px 16px;border-bottom:1px solid var(--border)"><a href="#/claim/${c.id}" style="color:var(--accent);font-weight:600">${c.id}</a></td>

              </td>
            </tr>
          `
            )
            .join('')}
        </tbody>
      </table>
    </div>
  `;

  root.innerHTML = renderShell(session, '#/report', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
}

const root = document.getElementById('app');

/** @type {{ scope: 'mine'|'all', sort: 'risk'|'deadline' }} */

let claimDrawerOpen = false;

let weightDraft = { ...weights };
let configFeedback = null;

function presentClaimForSession(session, claim) {
  if (!claim || session.role !== 'surveyor') return claim;
  if (claim.surveyorSubmitted) {
    return withVisibleStages(claim, ['fnol', 'intimation', 'assessment']);
  }
  return withVisibleStages(claim, ['fnol', 'intimation']);
}

function parseRoute() {
  const hash = location.hash || '#/login';
  const path = hash.replace(/^#/, '') || '/login';
  const parts = path.split('/').filter(Boolean);
  return { parts, path };
}

function bindGlobalActions() {
  root.querySelectorAll('[data-action="logout"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      clearSession();
      destroyChart();
      location.hash = '#/login';
      render();
    });
  });
}

function render() {
  const session = getSession();
  const { parts } = parseRoute();
  const route = parts[0] || 'login';

  if (!session && route !== 'login') {
    renderLogin(root);
    return;
  }

  if (session && route === 'login') {
    location.hash = homeRouteForRole(session.role);
    return;
  }

  if (route === 'login') {
    destroyChart();
    renderLogin(root);
    return;
  }

  const claims = scoreAllClaims(weights);

  if (route === 'queue') {
    destroyChart();
    const queueClaims =
      session.role === 'surveyor'
        ? claims.filter(isReadyForSurveyor).map((c) => presentClaimForSession(session, c))
        : claims;
    renderQueue(root, session, queueClaims, queueState, (next) => {
      queueState = next;
      render();
    });
  } else if (route === 'claim') {
    destroyChart();
    const id = parts.slice(1).join('/');
    const claim = presentClaimForSession(
      session,
      claims.find((c) => c.id === id)
    );
    renderClaimDetail(root, session, claim, claimFilter, (f, opts = {}) => {
      claimFilter = f;
      claimDrawerOpen = !!opts.drawerOpen;
      render();
    }, { drawerOpen: claimDrawerOpen });
  } else if (route === 'dashboard') {
    if (!canAccess(session.role, 'dashboard')) {
      location.hash = '#/queue';
      return;
    }
    renderDashboard(root, session, claims, dashState, (next) => {
      dashState = next;
      render();
    });
  } else if (route === 'report') {
    destroyChart();
    if (!canAccess(session.role, 'report')) {
      location.hash = '#/queue';
      return;
    }
    renderReport(root, session, claims);
  } else if (route === 'config') {
    destroyChart();
    if (!canAccess(session.role, 'config')) {
      location.hash = '#/queue';
      return;
    }
    renderConfig(root, session);
    // Refresh weights from config store after config interactions
    weights = getWeights();
    weightDraft = { ...weights };
  } else {
    location.hash = session ? homeRouteForRole(session.role) : '#/login';
    return;
  }

  bindGlobalActions();
}

window.addEventListener('hashchange', () => {
  const { parts } = parseRoute();
  if (parts[0] !== 'claim') {
    claimFilter = 'all';
    claimDrawerOpen = false;
  }
  render();
});

if (!location.hash) {
  const session = getSession();
  location.hash = session ? homeRouteForRole(session.role) : '#/login';
} else {
  render();
}

window.addEventListener('load', render);

})();

  </script>
</body>
</html>
