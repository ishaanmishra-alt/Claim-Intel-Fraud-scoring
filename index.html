<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Intel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b2a24'/%3E%3Cpath d='M8 22V10l8-4 8 4v12l-8 4-8-4z' fill='%235fffbe'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
:root {
  --bg: #f3faf7;
  --surface: #ffffff;
  --surface-muted: #f5fbf8;
  --border: #d5e8df;
  --border-strong: #b7d4c8;
  --text: #16303d;
  --text-secondary: #3d5563;
  --text-muted: #6b7f8a;
  --navy: #16303d;
  --navy-deep: #0f222b;
  --navy-soft: #e8fff6;
  --accent: #5fffbe;
  --accent-hover: #3aefad;
  --accent-text: #16303d;
  --mint: #5fffbe;
  --mint-soft: #e8fff6;
  --green: #15803d;
  --green-bg: #ecfdf3;
  --green-border: #bbf7d0;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --amber-border: #fde68a;
  --red: #b91c1c;
  --red-bg: #fef2f2;
  --red-border: #fecaca;
  --urgent: #dc2626;
  --shadow: 0 1px 2px rgba(22, 48, 61, 0.05), 0 8px 24px rgba(22, 48, 61, 0.06);
  --radius: 10px;
  --radius-sm: 6px;
  --font: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button,
input,
select {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

#app {
  min-height: 100vh;
}

/* ---------- Login ---------- */
.login-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 32px 20px;
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%, rgba(26, 107, 122, 0.12), transparent 55%),
    radial-gradient(ellipse 70% 50% at 90% 100%, rgba(22, 48, 61, 0.1), transparent 50%),
    linear-gradient(160deg, #e8eef2 0%, #f4f7f9 45%, #eef3f6 100%);
}

.login-card {
  width: min(420px, 100%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 36px 32px 28px;
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.azentio-logo {
  display: block;
  height: 28px;
  width: auto;
}

.brand-divider {
  width: 1px;
  height: 22px;
  background: var(--border-strong);
  flex-shrink: 0;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(145deg, #5fffbe 0%, #3aefad 100%);
  display: grid;
  place-items: center;
  color: var(--accent-text);
  flex-shrink: 0;
}

.brand-icon svg {
  width: 22px;
  height: 22px;
}

.brand-name {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.login-helper {
  margin: 0 0 28px;
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.45;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.field input[type="text"],
.field input[type="password"],
.field input[type="number"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(13, 110, 138, 0.15);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 18px 0 22px;
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.checkbox-row input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: var(--accent-text);
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  color: var(--accent-text);
}

.btn-secondary {
  background: var(--surface);
  border-color: var(--border-strong);
  color: var(--text);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--surface-muted);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border-color: transparent;
}

.btn-ghost:hover:not(:disabled) {
  background: var(--navy-soft);
  color: var(--navy);
}

.btn-block {
  width: 100%;
}

.btn-sm {
  padding: 6px 10px;
  font-size: 0.75rem;
  gap: 4px;
}

.login-error {
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  color: var(--red);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  margin-bottom: 14px;
}

.demo-accounts {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

.demo-accounts h3 {
  margin: 0 0 10px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.demo-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.demo-chip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}

.demo-chip:hover {
  border-color: var(--accent);
  background: var(--navy-soft);
}

.demo-chip .role {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--navy);
}

.demo-chip .creds {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-family: var(--mono);
}

/* ---------- App shell ---------- */
.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 28px;
  min-width: 0;
}

.topbar .brand-mark {
  margin: 0;
}

.topbar .azentio-logo {
  height: 24px;
}

.topbar .brand-icon {
  width: 28px;
  height: 28px;
  border-radius: 7px;
}

.topbar .brand-icon svg {
  width: 18px;
  height: 18px;
}

.topbar .brand-name {
  font-size: 1.05rem;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
}

.nav-link {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-secondary);
}

.nav-link:hover {
  background: var(--surface-muted);
  color: var(--text);
}

.nav-link.active {
  background: var(--mint-soft);
  color: var(--accent-text);
  font-weight: 600;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.persona-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 6px 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-muted);
}

.persona-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  display: grid;
  place-items: center;
  font-size: 0.7rem;
  font-weight: 700;
}

.persona-meta {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.persona-meta .name {
  font-size: 0.8rem;
  font-weight: 600;
}

.persona-meta .role {
  font-size: 0.7rem;
  color: var(--text-muted);
}

.main {
  flex: 1;
  padding: 28px 24px 48px;
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.page-header h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.page-subtitle {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--accent);
  margin-bottom: 12px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.back-link:hover {
  text-decoration: underline;
}

/* ---------- Controls ---------- */
.segmented {
  display: inline-flex;
  padding: 3px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  gap: 2px;
}

.segmented button {
  border: none;
  background: transparent;
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 0.825rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
}

.segmented button.active {
  background: var(--surface);
  color: var(--navy);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
}

.tier-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
}

.tier-stat {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.tier-stat strong {
  color: var(--text);
  font-weight: 600;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot.red { background: var(--red); }
.dot.yellow { background: #d97706; }
.dot.green { background: var(--green); }
.dot.amber { background: #d97706; }

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.toolbar-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-right: 8px;
}

.toolbar > div {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.toolbar select {
  padding: 8px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  min-width: 160px;
  color: var(--text);
}

/* ---------- Claims list ---------- */
.claims-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.claims-list-head,
.claim-row {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) 7.5rem 5.75rem 7.25rem 6.75rem;
  align-items: center;
  gap: 16px;
}

.claims-list-head {
  padding: 0 16px 6px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.claims-list.has-audit .claims-list-head {
  grid-template-columns: 32px 56px minmax(0, 1fr) 7.5rem 5.75rem 7.25rem 6.75rem;
}

.claims-list-head .h-amount,
.claim-amount {
  text-align: right;
}

.claims-list-head .h-risk,
.claim-tier,
.claims-list-head .h-stage,
.claim-stage-cell {
  text-align: center;
}

.claims-list-head .h-due,
.due-badge {
  text-align: right;
}

.claim-row {
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  text-align: left;
  width: 100%;
}

.claim-row:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow);
}

.claim-item {
  display: flex;
  flex-direction: column;
}

.claim-row-line {
  display: grid;
  grid-template-columns: 32px 1fr;
  align-items: stretch;
}

.audit-toggle {
  display: grid;
  place-items: center;
  width: 32px;
  padding: 0;
  border: 1px solid var(--border);
  border-right: 0;
  border-radius: var(--radius) 0 0 var(--radius);
  background: var(--surface-muted);
  color: var(--text-muted);
  cursor: pointer;
}

.audit-toggle:hover {
  color: var(--navy-deep);
  background: var(--navy-soft);
}

.audit-toggle.is-open {
  color: var(--navy-deep);
  background: var(--navy-soft);
}

.audit-toggle svg {
  transition: transform 0.15s ease;
}

.audit-toggle.is-open svg {
  transform: rotate(90deg);
}

.claim-item .claim-row {
  border-radius: 0 var(--radius) var(--radius) 0;
}

.claim-item.is-open .claim-row {
  border-radius: 0 var(--radius) 0 0;
}

.claim-item.is-open .audit-toggle {
  border-radius: var(--radius) 0 0 0;
}

.claim-audit {
  border: 1px solid var(--border);
  border-top: 0;
  border-radius: 0 0 var(--radius) var(--radius);
  background: var(--surface-muted);
}

.claim-audit-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px 8px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.claim-audit-head strong {
  color: var(--navy-deep);
  font-size: 0.85rem;
}

.claim-audit-scroll {
  overflow-x: auto;
  padding: 0 10px 12px;
}

.claim-audit-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.claim-audit-table.version-table {
  min-width: 0;
}

.claim-audit-table th,
.claim-audit-table td {
  padding: 7px 8px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  white-space: nowrap;
}

.claim-audit-table th {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: #f8fbf9;
}

.claim-audit-table tr:last-child td {
  border-bottom: 0;
}

.claim-audit-table .mono {
  font-family: var(--mono);
}

.claim-audit-table .audit-comment {
  white-space: normal;
  min-width: 180px;
  color: var(--text-secondary);
}

.audit-status {
  display: inline-flex;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--green-bg);
  color: var(--green);
  font-weight: 600;
}

.audit-status.is-fail {
  background: var(--red-bg);
  color: var(--red);
}

.audit-status.is-bypassed,
.audit-status.is-waived {
  background: var(--amber-bg);
  color: var(--amber);
}

.version-link {
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  font-family: var(--mono);
  font-weight: 700;
  color: var(--navy);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}

.version-link:hover {
  color: var(--navy-deep);
}

.modal-card-version {
  width: min(760px, 100%);
  max-height: 88vh;
  overflow: auto;
  padding: 20px 22px 24px;
}

.version-modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.version-modal-kicker {
  margin: 0 0 4px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.version-modal-head h2 {
  margin: 0;
  font-size: 1.15rem;
}

.version-modal-section {
  margin-top: 16px;
}

.version-modal-section h3 {
  margin: 0 0 8px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.version-modal-copy {
  margin: 0 0 8px;
  color: var(--text-secondary);
  font-size: 0.875rem;
  line-height: 1.45;
}

.version-detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 16px;
  margin: 0;
}

@media (max-width: 640px) {
  .version-detail-grid {
    grid-template-columns: 1fr;
  }
}

.version-detail-grid dt {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.version-detail-grid dd {
  margin: 2px 0 0;
  font-size: 0.875rem;
}

.version-change-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}

.version-change-table th,
.version-change-table td {
  text-align: left;
  padding: 7px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.version-change-table th {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.version-uc-scroll {
  overflow-x: auto;
}

.ledger-table.version-table {
  min-width: 0;
}

.version-claim-scroll {
  max-height: min(560px, 70vh);
  overflow: auto;
}

.version-claim-scroll thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #f8fbf9;
}

.version-modal-backdrop {
  z-index: 90;
}

.claim-audit-empty {
  padding: 16px;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.score-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 0.72rem;
  font-family: var(--mono);
  border: 2px solid;
}

.score-circle.sm {
  width: 42px;
  height: 42px;
  font-size: 0.68rem;
}

.score-circle.lg {
  width: 96px;
  height: 96px;
  font-size: 1.35rem;
  border-width: 3px;
}

.score-circle.is-fail-text {
  font-size: 0.62rem;
  letter-spacing: 0.02em;
}

.score-circle.sm.is-fail-text {
  font-size: 0.55rem;
}

.score-circle.lg.is-fail-text {
  font-size: 1.05rem;
}

.score-circle.red {
  color: var(--red);
  background: var(--red-bg);
  border-color: var(--red);
}

.score-circle.yellow {
  color: var(--amber);
  background: var(--amber-bg);
  border-color: #d97706;
}

.score-circle.green {
  color: var(--green);
  background: var(--green-bg);
  border-color: var(--green);
}

.claim-main {
  min-width: 0;
}

.claim-id-line {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 2px;
}

.claim-id {
  font-weight: 600;
  font-size: 0.9rem;
  white-space: nowrap;
}

.claim-name {
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.tag.critical {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-border);
}

.tag.knockout {
  background: #f1f5f9;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.tag.override {
  background: var(--mint-soft);
  color: var(--accent-text);
  border: 1px solid var(--accent);
}

.claim-amount {
  font-weight: 600;
  font-size: 0.9rem;
  text-align: right;
  white-space: nowrap;
}

.claim-tier {
  font-size: 0.8rem;
  font-weight: 600;
  min-width: 88px;
  text-align: center;
}

.claim-tier.red { color: var(--red); }
.claim-tier.yellow { color: var(--amber); }
.claim-tier.green { color: var(--green); }

.claim-stage-cell {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-align: center;
  min-width: 96px;
}

.due-badge {
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  min-width: 72px;
  text-align: right;
}

.due-badge.urgent {
  color: var(--urgent);
  font-weight: 700;
}

.empty-state {
  padding: 48px 24px;
  text-align: center;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}

/* ---------- Claim detail ---------- */
.claim-detail-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}

.claim-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
}

.meta-item label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.meta-item .value {
  font-size: 0.95rem;
  font-weight: 600;
}

.hardfail-banner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  color: var(--red);
}

.hardfail-banner .banner-icon {
  flex-shrink: 0;
  margin-top: 2px;
}

.hardfail-banner strong {
  display: block;
  font-size: 0.95rem;
  margin-bottom: 2px;
}

.hardfail-banner p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
  color: #991b1b;
}

.score-panel {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 22px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.score-panel-text h2 {
  margin: 0 0 6px;
  font-size: 1.15rem;
}

.score-panel-text .tier-label {
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 6px;
}

.score-panel-text .summary-line {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.result-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.result-filter {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
}

.result-filter.active {
  border-color: var(--navy);
  background: var(--navy-soft);
  color: var(--navy);
  font-weight: 600;
}

.result-filter .count {
  font-family: var(--mono);
  font-size: 0.75rem;
  margin-left: 4px;
  opacity: 0.8;
}

.checks-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.check-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.check-row.no-weight {
  grid-template-columns: 28px 1fr;
}

.check-row.fail {
  border-left: 3px solid var(--red);
}

.check-row.cant_evaluate {
  border-left: 3px solid #d97706;
}

.check-row.pass {
  border-left: 3px solid var(--green);
}

.check-row.bypassed,
.check-row.waived {
  border-left: 3px solid var(--accent);
}

.check-state-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin-top: 1px;
}

.check-state-icon.pass {
  background: var(--green-bg);
  color: var(--green);
}

.check-state-icon.fail {
  background: var(--red-bg);
  color: var(--red);
}

.check-state-icon.cant_evaluate {
  background: var(--amber-bg);
  color: var(--amber);
}

.check-state-icon.bypassed,
.check-state-icon.waived {
  background: var(--navy-soft);
  color: var(--navy);
}

.check-body .check-name {
  font-weight: 600;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.check-body .evidence {
  margin: 4px 0 0;
  font-size: 0.825rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.check-weight {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  font-family: var(--mono);
  white-space: nowrap;
  padding-top: 2px;
  text-align: right;
}

.check-weight-was,
.check-weight-excluded,
.check-weight-gate {
  display: block;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--text-muted);
}

.stage-norm-hint {
  margin: 8px 0 0;
  font-size: 0.78rem;
  color: var(--text-secondary);
}

/* ---------- Dashboard ---------- */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
  align-items: flex-end;
}

.filter-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.filter-group input[type="date"] {
  padding: 8px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
}

.scope-line {
  margin: 0 0 16px;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.report-sticky-bar {
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--bg);
  padding: 4px 0 4px;
  margin: 0 0 8px;
}

.report-sticky-bar .scope-line {
  margin-bottom: 8px;
}

.report-scorecard {
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}

.report-compose {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 24px;
}

.compose-title {
  margin: 0 0 10px;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.compose-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: baseline;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}

.compose-row .muted,
.sample-table .muted,
.ledger-comment {
  color: var(--text-muted);
}

.section-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}

.chip {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
}

.chip:hover,
.chip.active {
  border-color: var(--accent);
  background: var(--mint-soft);
  color: var(--navy-deep);
}

.usecase-fail-row.is-button {
  width: 100%;
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  cursor: pointer;
}

.usecase-fail-row.is-button:hover,
.usecase-fail-row.is-selected {
  border-color: var(--accent);
  background: var(--navy-soft);
}

.sample-table-wrap {
  overflow-x: auto;
}

.sample-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.825rem;
}

.sample-table th,
.sample-table td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}

.sample-table th {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-muted);
}

.sample-table a {
  font-weight: 600;
  color: var(--navy-deep);
}

.sample-table .mono {
  font-family: var(--mono);
  font-weight: 600;
}

.ledger-day {
  margin-top: 14px;
}

.ledger-day-title {
  margin: 0 0 8px;
  font-size: 0.8rem;
  color: var(--navy-deep);
}

.ledger-table {
  min-width: 1100px;
}

.ledger-row {
  display: grid;
  grid-template-columns: 52px minmax(120px, auto) minmax(110px, 1fr) minmax(160px, 1.6fr) auto auto minmax(120px, 1fr);
  gap: 10px;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
}

.ledger-time {
  font-family: var(--mono);
  color: var(--text-muted);
}

.ledger-claim {
  font-weight: 600;
  color: var(--navy-deep);
}

.ledger-delta {
  color: var(--text);
}

.ledger-chip {
  display: inline-flex;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--navy-soft);
  color: var(--navy);
  font-size: 0.7rem;
  font-weight: 600;
}

.ledger-comment {
  font-size: 0.75rem;
}

@media (max-width: 900px) {
  .ledger-row {
    grid-template-columns: 1fr 1fr;
  }
}

.stat-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}

.stat-tile .label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: 8px;
}

.stat-tile .value {
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.stat-tile .sub {
  margin-top: 4px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.panel-header h2 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
}

.risk-breakdown {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.risk-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 16px;
  align-items: center;
}

.risk-row-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 0.875rem;
}

.risk-metrics {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.risk-numbers {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.risk-numbers strong {
  color: var(--text);
}

.bar-track {
  height: 8px;
  background: #eef2f6;
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 999px;
}

.bar-fill.red { background: var(--red); }
.bar-fill.yellow { background: #d97706; }
.bar-fill.green { background: var(--green); }

.chart-wrap {
  position: relative;
  height: 280px;
}

.chart-empty {
  height: 220px;
  display: grid;
  place-items: center;
  color: var(--text-muted);
  font-size: 0.9rem;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

/* ---------- Config ---------- */
.info-banner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  background: #f1f5f9;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
  color: var(--text-secondary);
}

.info-banner .lock-icon {
  flex-shrink: 0;
  color: var(--text-muted);
  margin-top: 1px;
}

.info-banner strong {
  display: block;
  color: var(--text);
  margin-bottom: 2px;
  font-size: 0.9rem;
}

.info-banner p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
}

.config-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.config-section h2 {
  margin: 0 0 4px;
  font-size: 1rem;
}

.config-section .section-desc {
  margin: 0 0 16px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.config-check {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.config-check:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.config-check:first-of-type {
  padding-top: 0;
}

.config-check .name {
  font-weight: 600;
  font-size: 0.9rem;
}

.config-check .category {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.weight-input-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}

.weight-input-wrap input {
  width: 72px;
  padding: 7px 8px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  text-align: right;
  font-family: var(--mono);
  font-size: 0.875rem;
}

.weight-input-wrap input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(13, 110, 138, 0.12);
}

.weight-input-wrap .pct {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-weight: 600;
}

.config-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  position: sticky;
  bottom: 16px;
  box-shadow: var(--shadow);
}

.running-total {
  font-size: 0.95rem;
  font-weight: 600;
}

.running-total .total-value {
  font-family: var(--mono);
  font-size: 1.1rem;
  margin-left: 6px;
}

.running-total.at-100 .total-value {
  color: var(--green);
}

.running-total.not-100 .total-value {
  color: var(--amber);
}

.save-feedback {
  font-size: 0.85rem;
  margin-right: 12px;
}

.save-feedback.error {
  color: var(--red);
}

.save-feedback.success {
  color: var(--green);
  font-weight: 600;
}

.footer-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .stat-tiles {
    grid-template-columns: repeat(2, 1fr);
  }

  .claims-list-head {
    display: none;
  }

  .claim-row,
  .claims-list.has-audit .claim-row {
    grid-template-columns: 48px 1fr;
    gap: 12px;
  }

  .claim-amount,
  .claim-tier,
  .claim-stage-cell,
  .due-badge {
    grid-column: 2;
    text-align: left;
    min-width: 0;
  }

  .claim-amount { margin-top: -4px; }
  .nav-links {
    display: none;
  }

  .mobile-nav {
    display: flex !important;
  }
}

.mobile-nav {
  display: none;
  gap: 4px;
  padding: 8px 16px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

@media (max-width: 600px) {
  .main {
    padding: 20px 14px 40px;
  }

  .stat-tiles {
    grid-template-columns: 1fr;
  }

  .login-card {
    padding: 28px 20px 22px;
  }

  .topbar {
    padding: 0 14px;
  }

  .persona-meta .name {
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
}

/* ---------- Azentio extras ---------- */
.login-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0 14px;
  color: var(--text-muted);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.login-divider::before,
.login-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.btn-sso {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  color: var(--navy);
  font-weight: 600;
}

.btn-sso:hover:not(:disabled) {
  background: var(--navy-soft);
  border-color: var(--navy);
}

.modal-backdrop,
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 34, 43, 0.45);
  z-index: 80;
  display: flex;
  justify-content: flex-end;
}

.modal-backdrop {
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-card {
  width: min(420px, 100%);
  background: var(--surface);
  border-radius: 14px;
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.modal-card h2 {
  margin: 0 0 8px;
  font-size: 1.15rem;
  color: var(--navy-deep);
}

.modal-copy {
  margin: 0 0 16px;
  color: var(--text-secondary);
  font-size: 0.875rem;
  line-height: 1.45;
}

.sso-persona-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.sso-persona {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
  cursor: pointer;
}

.sso-persona:hover {
  border-color: var(--accent);
  background: var(--navy-soft);
}

.sso-persona strong {
  display: block;
  font-size: 0.9rem;
}

.sso-persona small {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.claim-link {
  background: none;
  border: none;
  padding: 0;
  color: var(--accent);
  font-weight: 700;
  font-size: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.claim-link:hover {
  color: var(--accent-hover);
}

.claim-drawer {
  width: min(420px, 100%);
  height: 100%;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -8px 0 32px rgba(22, 48, 61, 0.12);
  display: flex;
  flex-direction: column;
  animation: slideIn 0.2s ease;
}

@keyframes slideIn {
  from { transform: translateX(24px); opacity: 0.6; }
  to { transform: translateX(0); opacity: 1; }
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}

.drawer-header h2 {
  margin: 0;
  font-size: 1.05rem;
}

.drawer-sub {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 0.8rem;
  font-family: var(--mono);
}

.drawer-body {
  padding: 18px 20px 28px;
  overflow: auto;
}

.drawer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.drawer-section-title {
  margin: 22px 0 10px;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stage-score-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stage-score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  background: var(--surface-muted);
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
}

.icon-btn {
  padding: 6px;
}

.check-code {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent-text);
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 1px 6px;
  margin-right: 6px;
}

.score-circle.xs {
  width: 34px;
  height: 34px;
  font-size: 0.55rem;
  border-width: 2px;
}

.score-circle.xs.is-fail-text {
  font-size: 0.48rem;
}

.stage-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.stage-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
}

button.stage-chip {
  cursor: pointer;
  font: inherit;
}

button.stage-chip:hover {
  border-color: var(--border-strong);
}

button.stage-chip.is-active {
  border-color: var(--accent);
  background: var(--mint-soft);
  color: var(--navy-deep);
}

.stage-block {
  margin-bottom: 18px;
}

.stage-block-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.stage-block-header h3 {
  margin: 0;
  font-size: 0.95rem;
  color: var(--navy-deep);
}

.stage-block-header p {
  margin: 2px 0 0;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.config-subhead {
  margin: 16px 0 8px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stage-config .running-total {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.stage-fail-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stage-fail-card {
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

.stage-fail-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.85rem;
  margin-bottom: 8px;
}

.stage-fail-top span {
  color: var(--text-muted);
}

.stage-fail-top-uc {
  margin: 8px 0 0;
  font-size: 0.75rem;
  color: var(--text-secondary);
  line-height: 1.35;
}

.usecase-fail-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.usecase-fail-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
  align-items: center;
}

.usecase-fail-meta {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.usecase-fail-meta strong {
  display: block;
  font-size: 0.875rem;
}

.usecase-fail-meta small {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.usecase-fail-bar-wrap {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
}

@media (max-width: 800px) {
  .stage-fail-grid,
  .usecase-fail-row,
  .drawer-grid {
    grid-template-columns: 1fr;
  }
}

/* ---------- Config table ---------- */
.config-layout {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.config-subnav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 12px;
}

.config-subnav-item {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}

.config-subnav-item:hover,
.config-subnav-item.is-active {
  border-color: var(--accent);
  background: var(--mint-soft);
  color: var(--navy-deep);
}

.config-stage-pane {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.config-criteria-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.config-criteria-card h2 {
  margin: 0 0 6px;
  font-size: 1rem;
}

.config-criteria-card p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.config-pass-field {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.config-pass-input {
  display: flex;
  align-items: center;
  gap: 6px;
}

.config-pass-input input {
  width: 72px;
}

.config-mix-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  width: 100%;
}

.config-mix-card {
  flex-direction: column;
}

.config-weight-footer {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface-muted);
  font-size: 0.85rem;
}

.config-weight-footer.is-ok strong {
  color: var(--green);
}

.config-weight-footer.is-warn strong {
  color: var(--amber);
}

.config-weight-footer small {
  color: var(--text-muted);
}

@media (max-width: 900px) {
  .config-layout {
    grid-template-columns: 1fr;
  }
  .config-subnav {
    flex-direction: row;
    flex-wrap: wrap;
    position: static;
  }
}

.config-page-header {
  align-items: flex-end;
}

.config-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.version-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.current-version-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent-text);
}

.readonly-tag {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--surface);
  border-radius: 999px;
  padding: 2px 8px;
  color: var(--text-muted);
}

.prev-versions-wrap {
  position: relative;
}

.prev-versions-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.prev-versions-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 280px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 40;
  padding: 6px;
}

.prev-version-item {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--text);
}

.prev-version-item:hover {
  background: var(--mint-soft);
}

.prev-empty {
  padding: 12px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.config-table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.config-table-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-muted);
}

.config-table-wrap {
  overflow: auto;
}

.config-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

.config-table th {
  text-align: left;
  padding: 12px 14px;
  background: #f7fcf9;
  border-bottom: 1px solid var(--border);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  white-space: nowrap;
}

.config-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.config-table .col-menu {
  width: 44px;
  padding-left: 10px;
  padding-right: 4px;
}

.uc-name {
  font-weight: 600;
  color: var(--navy-deep);
  min-width: 180px;
}

.uc-desc {
  color: var(--text-secondary);
  max-width: 320px;
  line-height: 1.4;
}

.uc-weight {
  font-family: var(--mono);
  font-weight: 600;
}

.empty-cell {
  text-align: center;
  color: var(--text-muted);
  padding: 28px !important;
}

.cat-pill {
  display: inline-flex;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: capitalize;
}

.cat-critical {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-border);
}

.cat-high {
  background: var(--amber-bg);
  color: var(--amber);
  border: 1px solid var(--amber-border);
}

.cat-low {
  background: var(--mint-soft);
  color: var(--accent-text);
  border: 1px solid var(--accent);
}

.row-menu-wrap {
  position: relative;
}

.row-menu-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
}

.row-menu-btn:hover {
  background: var(--mint-soft);
  color: var(--accent-text);
}

.row-menu {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 200px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  z-index: 30;
  padding: 4px;
}

.row-menu button {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  padding: 8px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.825rem;
}

.row-menu button:hover {
  background: var(--mint-soft);
}

.row-menu button.danger {
  color: var(--red);
}

.btn-danger {
  background: var(--red);
  color: white;
  border: 1px solid var(--red);
}

.btn-danger:hover:not(:disabled) {
  background: #991b1b;
}

.modal-card-wide {
  width: min(560px, 100%);
}

.field-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.field-row-2 {
  grid-template-columns: repeat(2, 1fr);
}

.version-dates-block {
  margin-top: 16px;
  padding: 14px 14px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
}

.version-dates-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.version-dates-hint {
  margin: 0 0 12px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-secondary);
}

.version-dates-error {
  margin: 0 0 12px;
  font-size: 12px;
  color: #b91c1c;
  font-weight: 500;
}

.optional-label {
  font-weight: 400;
  color: var(--text-secondary);
}

.required-mark {
  color: #b91c1c;
  font-weight: 700;
}

.modal-card input[type='date'] {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font: inherit;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.value-readonly {
  padding: 10px 12px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-weight: 600;
}

.modal-card textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  resize: vertical;
  background: var(--surface-muted);
  color: var(--text-secondary);
  font: inherit;
}

.modal-card select,
.config-table-filters select,
.config-table-filters input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

@media (max-width: 700px) {
  .field-row {
    grid-template-columns: 1fr;
  }
}




.version-notice {
  margin: 0 0 14px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid #86efac;
  background: #f0fdf4;
  color: #166534;
  font-size: 13px;
  line-height: 1.45;
  font-weight: 500;
}

.btn-request {
  background: #0f766e;
}

.btn-request:hover:not(:disabled) {
  background: #0d9488;
}

.uc-picker {
  position: relative;
}

.uc-picker-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  font: inherit;
  color: var(--text);
}

.uc-picker-trigger-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.uc-picker-caret {
  color: var(--text-secondary);
}

.uc-status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  background: #cbd5e1;
}

.uc-picker-trigger.is-enabled .uc-status-dot,
.uc-picker-option.is-enabled .uc-status-dot,
.uc-status-dot.is-enabled {
  background: #22c55e;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
}

.uc-picker-trigger.is-locked .uc-status-dot,
.uc-picker-option.is-locked .uc-status-dot,
.uc-status-dot.is-locked {
  background: #94a3b8;
}

.uc-picker-menu {
  position: absolute;
  z-index: 40;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  max-height: 280px;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
  padding: 8px;
}

.uc-picker-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 4px 6px 10px;
  font-size: 12px;
  color: var(--text-secondary);
}

.uc-picker-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.uc-picker-group-label {
  padding: 8px 8px 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.uc-picker-empty {
  padding: 12px;
  font-size: 13px;
  color: var(--text-secondary);
}

.uc-picker-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: var(--text);
}

.uc-picker-option:hover,
.uc-picker-option.is-selected {
  background: var(--surface-muted);
}

.uc-picker-option.is-locked {
  color: #64748b;
}

.uc-picker-option-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.uc-picker-code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 600;
}

.uc-picker-name {
  font-size: 13px;
  line-height: 1.35;
}

.uc-picker-badge {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
}

.uc-picker-option.is-enabled .uc-picker-badge {
  background: #dcfce7;
  color: #166534;
}

.stage-block-score {
  display: flex;
  align-items: center;
  gap: 8px;
}

.empty-checks {
  padding: 10px 12px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.doc-complete-chip {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--navy);
  background: var(--mint-soft);
  border: 1px solid var(--accent);
  border-radius: 999px;
  padding: 3px 8px;
  white-space: nowrap;
}

.doc-disclosure {
  margin-top: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-muted);
}

.doc-disclosure > summary {
  cursor: pointer;
  list-style: none;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 10px 14px;
}

.doc-disclosure > summary::-webkit-details-marker {
  display: none;
}

.doc-disclosure > summary::after {
  content: '▸';
  float: right;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.doc-disclosure[open] > summary::after {
  content: '▾';
}

.doc-disclosure .doc-checklist {
  margin-top: 0;
  padding: 0 10px 10px;
}

.doc-checklist {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.doc-checklist-label {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 2px 2px 0;
}

.stage-hold-note {
  margin: 0 0 10px;
  padding: 10px 12px;
  font-size: 0.82rem;
  line-height: 1.45;
  color: var(--text-secondary);
  background: var(--amber-bg, #fff6e5);
  border: 1px solid var(--amber);
  border-radius: var(--radius-sm);
}

.doc-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: left;
  font: inherit;
  color: inherit;
  width: 100%;
}

.doc-row.is-action {
  cursor: pointer;
}

.doc-row.is-action:hover {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(95, 255, 190, 0.25);
}

.doc-row.missing {
  border-left: 3px solid var(--amber);
}

.doc-row.rejected {
  border-left: 3px solid var(--red);
}

.doc-row.is-highlight.missing {
  background: var(--amber-bg, #fff8eb);
}

.doc-row.is-highlight.rejected {
  background: var(--red-bg, #fff1f1);
}

.doc-row.uploaded,
.doc-row.already_on_file,
.doc-row.waived {
  border-left: 3px solid var(--green);
}

.doc-row-title {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.doc-name {
  font-weight: 600;
  font-size: 0.88rem;
}

.doc-min {
  font-weight: 500;
  color: var(--text-muted);
  font-size: 0.75rem;
}

.doc-note {
  margin: 4px 0 0;
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.doc-why {
  margin: 4px 0 0;
  font-size: 0.78rem;
  color: var(--text-muted);
  line-height: 1.4;
}

.doc-status {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.doc-status.missing { color: var(--amber); }
.doc-status.rejected { color: var(--red); }
.doc-status.uploaded,
.doc-status.already_on_file,
.doc-status.waived { color: var(--green); }

.tag.doc-required {
  background: var(--navy-soft);
  color: var(--navy);
  border: 1px solid var(--border-strong);
}

.tag.doc-optional {
  background: #f1f5f9;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.tag.doc-conditional {
  background: #fff7ed;
  color: #c2410c;
  border: 1px solid #fdba74;
}

.doc-thumb {
  width: 56px;
  height: 44px;
  border-radius: 6px;
  background: linear-gradient(135deg, #16303d 0%, #1d4d3c 100%);
  color: var(--mint);
  display: grid;

function documentApplies(claim, def) {
  if (!def) return false;
  const type = claim.claimType || 'own_damage';
  if (!def.condition) return true;
  if (def.condition === 'tp') return type === 'tp';
  if (def.condition === 'theft') return type === 'theft';
  if (def.condition === 'total_loss') return type === 'total_loss';
  if (def.condition === 'towed') return !!claim.towed;
  if (def.condition === 'police') return type === 'tp' || type === 'theft';
  return true;
}

function countMeetsMin(def, rec) {
  return (rec.count || 0) >= (def.minCount || 1);
}

function isDocumentSatisfied(claim, def) {
  if (!def) return false;
  const rec = getDocRecord(claim, def.id);
  if (rec.status === 'waived') return true;
  if (rec.status === 'uploaded' && countMeetsMin(def, rec)) return true;
  if (def.carryFrom) {
    const prior = DOCUMENT_CATALOG.find((d) => d.id === def.carryFrom);
    if (prior && isDocumentSatisfied(claim, prior) && rec.status !== 'rejected') return true;
  }
  return false;
}

/** Required or applicable-conditional docs still outstanding for a check. */
function missingRequiredDocsForCheck(claim, checkId) {
  return DOCUMENT_CATALOG.filter((def) => {
    if (!def.linkedCheckIds?.includes(checkId)) return false;
    if (def.required === 'optional') return false;
    if (!documentApplies(claim, def)) return false;
    return !isDocumentSatisfied(claim, def);
  });
}

function uploadedDocsForCheck(claim, checkId) {
  return DOCUMENT_CATALOG.filter((def) => {
    if (!def.linkedCheckIds?.includes(checkId)) return false;
    if (!documentApplies(claim, def)) return false;
    const rec = getDocRecord(claim, def.id);
    return rec.status === 'uploaded' && countMeetsMin(def, rec);
  });
}

function getStageDocumentRows(claim, stageId) {
  return DOCUMENT_CATALOG.filter((def) => def.stage === stageId && documentApplies(claim, def)).map((def) => {
    const rec = getDocRecord(claim, def.id);
    const prior = def.carryFrom ? DOCUMENT_CATALOG.find((d) => d.id === def.carryFrom) : null;
    const carried =
      prior &&
      isDocumentSatisfied(claim, prior) &&
      rec.status !== 'uploaded' &&
      rec.status !== 'rejected' &&
      rec.status !== 'waived';
    return {
      def,
      rec,
      displayStatus: carried ? 'already_on_file' : rec.status,
      alreadyOnFile: !!carried,
    };
  });
}

function getStageDocCompleteness(claim, stageId) {
  const rows = getStageDocumentRows(claim, stageId).filter((row) => row.def.required !== 'optional');
  const done = rows.filter((row) => isDocumentSatisfied(claim, row.def)).length;
  return { done, total: rows.length };
}

function hasStageDocsComplete(claim, stageId) {
  const { done, total } = getStageDocCompleteness(claim, stageId);
  return total === 0 || done === total;
}

function hasPassedPriorStages(claim, stageIds) {
  return stageIds.every((id) => hasStageDocsComplete(claim, id) && !stageHasCriticalFail(claim, id));
}

/** Claims that cleared FNOL + Registration and are waiting on assessment submit. */
function isReadyForSurveyor(claim) {
  return hasPassedPriorStages(claim, ['fnol', 'intimation']) && !claim.surveyorSubmitted;
}

function stageHasCriticalFail(claim, stageId, stageScores = claim?.stageScores) {
  return (stageScores || []).some((s) => s.stageId === stageId && s.criticalFailed);
}

/** Current workflow stage for queue column / filters. A critical fail holds the claim on that stage. */
function getClaimWorkflowStage(claim, stageScores) {
  const scores = stageScores || claim?.stageScores;
  if (!hasStageDocsComplete(claim, 'fnol') || stageHasCriticalFail(claim, 'fnol', scores)) return 'fnol';
  if (!hasStageDocsComplete(claim, 'intimation') || stageHasCriticalFail(claim, 'intimation', scores)) return 'intimation';
  if (!claim.surveyorSubmitted || !hasStageDocsComplete(claim, 'assessment') || stageHasCriticalFail(claim, 'assessment', scores)) {
    return 'assessment';
  }
  return 'settlement';
}

const WORKFLOW_STAGES = [
  { id: 'fnol', name: 'FNOL' },
  { id: 'intimation', name: 'Registration' },
  { id: 'assessment', name: 'Assessment' },
  { id: 'settlement', name: 'Settlement' },
];

function submitSurveyorAssessment(claimId) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  if (!hasStageDocsComplete(claim, 'assessment')) {
    return { ok: false, message: 'Upload all required Assessment documents before submitting.' };
  }
  claim.surveyorSubmitted = true;
  appendClaimAudit(claimId, {
    user: 'Hassan Al-Falasi',
    action: 'Submitted',
    changeType: 'Status',
    entity: 'Stage',
    field: 'Claim stage',
    oldValue: 'Assessment',
    newValue: 'Settlement',
    comments: 'Assessment documents submitted for further scoring.',
  });
  return { ok: true, message: 'Submitted for further scoring. This claim has moved to the next stage.' };
}

function defaultUploadedRecord(def) {
  const pdf = def.kind === 'pdf';
  const count = def.minCount || 1;
  return {
    status: 'uploaded',
    filename: pdf ? `${def.id}.pdf` : `${def.id}-01.jpg`,
    thumb: pdf ? 'PDF' : count > 1 ? `${count} photos` : 'Photo',
    note: 'On file from intake.',
    count,
  };
}

function seedDocuments(claim, overrides = {}) {
  const docs = {};
  DOCUMENT_CATALOG.forEach((def) => {
    if (!documentApplies(claim, def)) return;
    if (overrides[def.id]) {
      docs[def.id] = { ...emptyDocRecord(), ...overrides[def.id] };
      return;
    }
    if (def.required === 'optional') {
      docs[def.id] = {
        ...emptyDocRecord(),
        note: 'Not provided.',
      };
      return;
    }
    if (def.carryFrom) {
      docs[def.id] = emptyDocRecord();
      return;
    }
    docs[def.id] = defaultUploadedRecord(def);
  });
  return docs;
}

function mockUploadClaimDocument(claimId, docId, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  const def = DOCUMENT_CATALOG.find((d) => d.id === docId);
  if (!claim || !def) return null;
  const pdf = def.kind === 'pdf';
  const count = def.minCount || 1;
  const prev = claim.documents?.[docId];
  claim.documents = claim.documents || {};
  claim.documents[docId] = {
    status: 'uploaded',
    filename: pdf ? `${def.id}-uploaded.pdf` : `${def.id}-upload-01.jpg`,
    thumb: pdf ? 'PDF' : count > 1 ? `${count} photos` : 'Photo',
    note: 'Uploaded in Claim Intel (demo).',
    count,
  };
  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: 'Uploaded',
    changeType: 'Upload',
    entity: 'Document',
    field: def.name,
    oldValue: prev?.filename || 'Missing',
    newValue: claim.documents[docId].filename,
    comments: `Document captured at ${stageDisplayName(def.stage)}.`,
  });
  return claim.documents[docId];
}

function buildChecks(overrides = {}) {
  return USE_CASE_LIBRARY.map((def) => {
    const o = overrides[def.id] || {};
    return {
      checkId: def.id,
      state: /** @type {CheckState} */ (o.state || 'pass'),
      evidence:
        o.evidence ||
        (def.hardFail
          ? 'Matched policy record — no discrepancy found'
          : 'Within expected range for this claim profile'),
    };
  });
}

function shiftDate(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function parseVehicle(vehicle) {
  const raw = String(vehicle || '');
  const [left, colourPart] = raw.split('·').map((s) => s.trim());
  const yearMatch = (left || '').match(/(\d{4})$/);
  const year = yearMatch ? yearMatch[1] : '';
  const rest = (left || '').replace(/\s+\d{4}$/, '').trim();
  const parts = rest.split(' ').filter(Boolean);
  return {
    make: parts[0] || '',
    model: parts.slice(1).join(' '),
    year,
    colour: colourPart || '',
  };
}

function composeVehicle(claim) {
  const year = claim.vehicleYear ? ` ${claim.vehicleYear}` : '';
  const colour = claim.vehicleColour ? ` · ${claim.vehicleColour}` : '';
  return `${claim.vehicleMake || ''} ${claim.vehicleModel || ''}${year}${colour}`.replace(/\s+/g, ' ').trim();
}

function pad2(n) {
  return String(n).padStart(2, '0');
}

function formatAuditAmount(amount) {
  return `AED ${Number(amount).toLocaleString('en-US')}`;
}

function nextAuditStamp() {
  const seq = (nextAuditStamp.seq = (nextAuditStamp.seq || 0) + 1);
  const mins = 15 + seq;
  return { date: '2026-08-14', time: `${pad2(16 + Math.floor(mins / 60))}:${pad2(mins % 60)}` };
}

const MAX_CLAIM_VERSIONS = 6;
const STAGE_FLOW = ['fnol', 'intimation', 'assessment', 'settlement'];

function formatUseCaseCode(id) {
  return `UC${Number(id)}`;
}

function formatClaimVersionLabel(index) {
  return `V${Number(index)}`;
}

function sortVersionsChronological(rows) {
  return [...(rows || [])].sort((a, b) => {
    const byWhen = `${a.date}T${a.time || '00:00'}`.localeCompare(`${b.date}T${b.time || '00:00'}`);
    if (byWhen) return byWhen;
    return String(a.version || '').localeCompare(String(b.version || ''));
  });
}

function decorateVersion(row, claim, index) {
  return {
    status: 'Completed',
    comments: row.comments || '',
    oldValue: row.oldValue ?? '—',
    newValue: row.newValue ?? '—',
    entity: row.entity || 'Claim',
    field: row.field || '—',
    action: row.action || 'Updated',
    changeType: row.changeType || 'Update',
    user: row.user || 'Claim Intel',
    summary: row.summary || row.comments || row.action || 'Updated',
    changes:
      row.changes && row.changes.length
        ? row.changes
        : [
            {
              field: row.field || row.action || 'Change',
              oldValue: row.oldValue ?? '—',
              newValue: row.newValue ?? '—',
            },
          ],
    ...row,
    version: formatClaimVersionLabel(index),
    fnolNumber: row.fnolNumber || claim.fnolNumber || claim.id.replace(/^CLM-/, 'FNOL-'),
    registrationNo: row.registrationNo || claim.id,
    stage: row.stage || 'fnol',
  };
}

function capClaimVersions(rows, claim) {
  const sorted = sortVersionsChronological(rows);
  const kept =
    sorted.length <= MAX_CLAIM_VERSIONS ? sorted : [sorted[0], ...sorted.slice(-(MAX_CLAIM_VERSIONS - 1))];
  return kept.map((row, i) => decorateVersion(row, claim, i));
}

function docChange(row) {
  const statusLabel =
    row.displayStatus === 'waived'
      ? 'Waived'
      : row.displayStatus === 'already_on_file'
        ? 'Already on file'
        : row.rec.filename || 'Uploaded';
  return {
    field: row.def.name,
    oldValue: 'Missing',
    newValue: statusLabel,
  };
}

function getClaimVersions(claim) {
  const raw = RAW_CLAIMS.find((c) => c.id === claim?.id) || claim;
  const rows = raw?.versions || raw?.auditLog || [];
  return [...rows].sort((a, b) => {
    const byWhen = `${a.date}T${a.time || '00:00'}`.localeCompare(`${b.date}T${b.time || '00:00'}`);
    if (byWhen) return byWhen;
    return parseInt(String(a.version).replace(/\D/g, '') || '0', 10) - parseInt(String(b.version).replace(/\D/g, '') || '0', 10);
  });
}

function getClaimAuditLog(claim) {
  return getClaimVersions(claim);
}

function findClaimVersion(claim, versionId) {
  return getClaimVersions(claim).find((row) => String(row.version) === String(versionId)) || null;
}

function useCaseScoresForVersion(claim, version) {
  const stage = version?.stage || 'fnol';
  const maxIdx = Math.max(0, STAGE_FLOW.indexOf(stage));
  const results = claim.results || [];
  const versionTouchedBypass = /bypass/i.test(`${version?.action || ''} ${version?.summary || ''} ${version?.comments || ''}`);
  const source = results.length
    ? results.filter((r) => STAGE_FLOW.indexOf(r.stage) <= maxIdx)
    : USE_CASE_LIBRARY.filter((d) => STAGE_FLOW.indexOf(d.stage) <= maxIdx).map((d) => ({
        checkId: d.id,
        name: d.name,
        stage: d.stage,
        hardFail: isCriticalUseCase(d),
        weight: d.weight,
        state: (claim.checks || []).find((c) => c.checkId === d.id)?.state || 'pass',
        evidence: (claim.checks || []).find((c) => c.checkId === d.id)?.evidence || '',
      }));

  return source.map((r) => {
    let state = r.state;
    if (!versionTouchedBypass && state === 'bypassed') state = 'fail';
    return {
      checkId: r.checkId,
      code: formatUseCaseCode(r.checkId),
      name: r.name,
      state,
      hardFail: !!r.hardFail,
      weight: r.displayWeight ?? r.weight ?? 0,
      stage: r.stage,
      stageName: stageDisplayName(r.stage),
      evidence: r.evidence || '',
    };
  });
}

function appendClaimAudit(claimId, partial) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return;
  const stamp = nextAuditStamp();
  const row = {
    date: stamp.date,
    time: stamp.time,
    user: 'Demo user',
    action: 'Updated',
    changeType: 'Update',
    entity: 'Claim',
    field: '—',
    oldValue: '—',
    newValue: '—',
    status: 'Completed',
    comments: '',
    stage: getClaimWorkflowStage(claim),
    ...partial,
  };
  row.summary = partial.summary || partial.comments || partial.action || 'Updated';
  row.changes =
    partial.changes && partial.changes.length
      ? partial.changes
      : [{ field: row.field, oldValue: row.oldValue, newValue: row.newValue }];
  claim.versions = capClaimVersions([...(claim.versions || claim.auditLog || []), row], claim);
  claim.auditLog = claim.versions;
}

function loadRuntimeStore() {
  try {
    const parsed = JSON.parse(localStorage.getItem(CLAIM_RUNTIME_KEY) || 'null');
    if (parsed && parsed.claims) return parsed;

  }
  return { claims: {} };
}

function persistClaimRuntime(claim) {
  const store = loadRuntimeStore();
  const fields = {};
  RUNTIME_FIELDS.forEach((key) => {
    if (claim[key] != null) fields[key] = claim[key];
  });
  store.claims[claim.id] = {
    fields,
    exceptions: claim.exceptions || [],
    waivedCheckIds: claim.waivedCheckIds || [],
    bypassedCheckIds: claim.bypassedCheckIds || [],
    dispositions: claim.dispositions || {},
    versions: claim.versions || claim.auditLog || [],
  };
  localStorage.setItem(CLAIM_RUNTIME_KEY, JSON.stringify(store));
}

function hydrateClaimRuntime() {
  const store = loadRuntimeStore();
  RAW_CLAIMS.forEach((claim) => {
    const slice = store.claims[claim.id];
    if (!slice) return;
    Object.assign(claim, slice.fields || {});
    if (slice.fields?.vehicleMake || slice.fields?.vehicleColour) {
      claim.vehicle = composeVehicle(claim);
    }
    claim.exceptions = slice.exceptions || [];
    claim.waivedCheckIds = slice.waivedCheckIds || [];
    claim.bypassedCheckIds = slice.bypassedCheckIds || [];
    claim.dispositions = slice.dispositions || {};
    if (Array.isArray(slice.versions) && slice.versions.length) {
      claim.versions = capClaimVersions(slice.versions, claim);
      claim.auditLog = claim.versions;
    }
    if (settleCoreBypasses(claim)) persistClaimRuntime(claim);
  });
}

function applyProposedFields(claim, proposed = {}) {
  Object.entries(proposed).forEach(([key, value]) => {
    claim[key] = NUMBER_FIELDS.has(key) ? Number(value) : value;
  });
  if (
    proposed.vehicleMake != null ||
    proposed.vehicleModel != null ||
    proposed.vehicleYear != null ||
    proposed.vehicleColour != null
  ) {
    claim.vehicle = composeVehicle(claim);
  }
}

function actorSnapshot(actor) {
  return {
    userId: actor?.userId || actor?.id || '',
    name: actor?.name || 'Demo user',

}

function settleCoreBypasses(claim) {
  let changed = false;
  (claim.exceptions || []).forEach((ex) => {
    if (ex.type === 'bypass' && ex.status === 'pending') {
      ex.status = 'approved';
      ex.decidedBy = { userId: 'core', name: 'Core system', role: 'core' };
      ex.decidedAt = ex.decidedAt || '2026-08-14';
      ex.decisionComment = ex.decisionComment || 'Approved in the core system.';
      changed = true;
    }
  });
  const ids = new Set(claim.bypassedCheckIds || []);
  (claim.exceptions || []).forEach((ex) => {
    if (ex.type === 'bypass' && ex.status === 'approved' && !ids.has(ex.checkId)) {
      ids.add(ex.checkId);
      changed = true;
    }
  });
  claim.bypassedCheckIds = [...ids];
  return changed;
}

/**
 * Claim User Bypass sends a notification to the core system (out of scope).
 * This prototype applies the approved bypass immediately so scoring can be demoed:
 * the use-case drops out and remaining stage weights are normalised to 100%.
 */
function requestCoreBypass(claimId, checkId, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  const id = Number(checkId);
  if ((claim.bypassedCheckIds || []).includes(id)) {
    return { ok: false, message: 'This use-case is already bypassed.' };
  }

  const stamp = nextAuditStamp();
  const exception = {
    id: `ex-${claim.id}-${(claim.exceptions || []).length + 1}`,
    checkId: id,
    type: 'bypass',
    status: 'approved',
    comment: 'Bypass notification sent to the core system.',
    proposedFields: {},
    previousFields: {},
    hardFail: false,
    disposition: null,
    requestedBy: actorSnapshot(actor),
    requestedAt: stamp.date,
    decidedBy: { userId: 'core', name: 'Core system', role: 'core' },
    decidedAt: stamp.date,
    decisionComment: 'Approved in the core system.',
  };
  claim.exceptions = claim.exceptions || [];
  claim.exceptions.push(exception);
  const ids = new Set(claim.bypassedCheckIds || []);
  ids.add(id);
  claim.bypassedCheckIds = [...ids];
  persistClaimRuntime(claim);

  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: 'Bypass approved',
    changeType: 'Exception',
    entity: 'Use-case',
    field: checkCode(id),
    oldValue: 'Fail',
    newValue: 'Bypassed',
    summary: `${checkCode(id)} bypassed after core approval.`,
    comments: 'Notification sent to core; use-case excluded from the stage.',
    changes: [
      { field: checkCode(id), oldValue: 'Fail', newValue: 'Notification sent to core' },
      { field: checkCode(id), oldValue: 'Fail', newValue: 'Bypassed' },
    ],
  });
  persistClaimRuntime(claim);
  return {
    ok: true,
    message:
      'A bypass notification was sent to the core system. This prototype shows the claim after core approval — that use-case is out of the stage score, and remaining weights in the stage are normalised to 100%.',
  };
}

function fieldSummary(fields = {}) {
  const parts = Object.entries(fields).map(([k, v]) => `${k}=${v}`);
  return parts.join(', ') || '—';
}

function proposeCheckException(claimId, payload, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  const checkId = Number(payload.checkId);
  const type = payload.type;
  const comment = String(payload.comment || '').trim();
  if (!['resolve', 'reject', 'approve', 'bypass'].includes(type)) {
    return { ok: false, message: 'Unknown exception action.' };
  }
  if (!comment) return { ok: false, message: 'A comment is required.' };

  const pending = latestExceptionForCheck(claim, checkId);
  if (pending?.status === 'pending') {
    return { ok: false, message: 'This check already has a pending exception.' };
  }

  const hardFail = !!payload.hardFail;
  if (type === 'reject' && hardFail && actor?.role === 'claim_user') {
    return { ok: false, message: 'Claim Users cannot waive a hard-fail. Resolve the data or refer to FIU.' };
  }
  if (type === 'reject' && hardFail && !isCheckerRole(actor?.role)) {
    return { ok: false, message: 'Only Claim Head or FIU can waive a hard-fail.' };
  }

  const proposedFields = type === 'resolve' ? { ...(payload.proposedFields || {}) } : {};
  if (type === 'resolve') {
    const allowed = new Set(getExceptionFields(checkId).map((f) => f.key));
    Object.keys(proposedFields).forEach((key) => {
      if (!allowed.has(key)) delete proposedFields[key];
    });
  }

  const previousFields = {};
  Object.keys(proposedFields).forEach((key) => {
    previousFields[key] = claim[key] ?? '—';
  });

  const exception = {
    id: `ex-${claim.id}-${(claim.exceptions || []).length + 1}`,
    checkId,
    type,
    status: 'pending',
    comment,
    proposedFields,
    previousFields,
    hardFail,
    disposition: type === 'approve' ? (hardFail ? 'refer' : 'continue') : null,
    requestedBy: actorSnapshot(actor),
    requestedAt: '2026-08-14',
    decidedBy: null,
    decidedAt: null,
    decisionComment: '',
  };
  claim.exceptions = claim.exceptions || [];
  claim.exceptions.push(exception);
  persistClaimRuntime(claim);

  const actionLabel =
    type === 'resolve'
      ? 'Exception resolve'
      : type === 'reject'
        ? 'Exception reject'
        : type === 'bypass'
          ? 'Bypass requested'
          : 'Exception approve';
  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: actionLabel,
    changeType: 'Exception',
    entity: 'Use-case',
    field: checkCode(checkId),
    oldValue: type === 'resolve' ? fieldSummary(previousFields) : 'Active fail',
    newValue:
      type === 'resolve'
        ? fieldSummary(proposedFields)
        : type === 'reject'
          ? 'Pending waive'
          : type === 'bypass'
            ? 'Pending bypass'
            : exception.disposition,
    comments: comment,
  });
  persistClaimRuntime(claim);
  return { ok: true, exception };
}

function decideCheckException(claimId, exceptionId, decision, comment, actor) {
  const claim = RAW_CLAIMS.find((c) => c.id === claimId);
  if (!claim) return { ok: false, message: 'Claim not found.' };
  if (!isCheckerRole(actor?.role)) {
    return { ok: false, message: 'Only Claim Head, Admin, or FIU can decide an exception.' };
  }
  const exception = (claim.exceptions || []).find((e) => e.id === exceptionId);
  if (!exception || exception.status !== 'pending') {
    return { ok: false, message: 'No pending exception found.' };
  }
  const actorId = actor?.userId || actor?.id;
  if (actorId && exception.requestedBy?.userId && actorId === exception.requestedBy.userId) {
    return { ok: false, message: 'Maker cannot approve their own request.' };
  }
  if (decision === 'sent_back') {
    const note = String(comment || '').trim();
    if (!note) return { ok: false, message: 'A comment is required to send back.' };
    exception.status = 'sent_back';
    exception.decisionComment = note;
    exception.decidedBy = actorSnapshot(actor);
    exception.decidedAt = '2026-08-14';
    persistClaimRuntime(claim);
    appendClaimAudit(claimId, {
      user: actor?.name || 'Demo user',
      action: 'Exception sent back',
      changeType: 'Exception',
      entity: 'Use-case',
      field: checkCode(exception.checkId),
      oldValue: 'Pending',
      newValue: 'Sent back',
      comments: note,
    });
    persistClaimRuntime(claim);
    return { ok: true, exception };
  }
  if (decision !== 'approved') return { ok: false, message: 'Unknown decision.' };

  exception.status = 'approved';
  exception.decisionComment = String(comment || '').trim();
  exception.decidedBy = actorSnapshot(actor);
  exception.decidedAt = '2026-08-14';

  if (exception.type === 'resolve') {
    applyProposedFields(claim, exception.proposedFields);
  } else if (exception.type === 'reject') {
    const ids = new Set(claim.waivedCheckIds || []);
    ids.add(exception.checkId);
    claim.waivedCheckIds = [...ids];
  } else if (exception.type === 'bypass') {
    const ids = new Set(claim.bypassedCheckIds || []);
    ids.add(exception.checkId);
    claim.bypassedCheckIds = [...ids];
  } else if (exception.type === 'approve') {
    claim.dispositions = { ...(claim.dispositions || {}), [exception.checkId]: exception.disposition };
  }
  persistClaimRuntime(claim);
  appendClaimAudit(claimId, {
    user: actor?.name || 'Demo user',
    action: 'Exception approved',
    changeType: 'Exception',
    entity: 'Use-case',
    field: checkCode(exception.checkId),
    oldValue:
      exception.type === 'resolve'
        ? fieldSummary(exception.previousFields)
        : exception.type === 'reject' || exception.type === 'bypass'
          ? 'Fail'
          : 'Fail',
    newValue:
      exception.type === 'resolve'
        ? fieldSummary(exception.proposedFields)
        : exception.type === 'reject'
          ? 'Waived'
          : exception.type === 'bypass'
            ? 'Bypassed'
          : exception.disposition === 'refer'
            ? 'Refer to FIU'
            : 'Accept risk',
    comments: exception.decisionComment || exception.comment,
  });
  persistClaimRuntime(claim);
  return { ok: true, exception };
}

/** Inclusive coverage: startDate <= asOf and (no end or endDate >= asOf). */
function versionCoversDate(version, asOf = CONFIG_TODAY) {
  if (!version?.startDate) return false;
  if (version.startDate > asOf) return false;
  if (version.endDate && version.endDate < asOf) return false;
  return true;
}

/** Active config version for a given date (defaults to prototype today). */
function getVersionForDate(asOf = CONFIG_TODAY, store = getConfigStore()) {
  const covering = store.versions
    .filter((v) => versionCoversDate(v, asOf))
    .sort((a, b) => a.number - b.number);
  if (covering.length) return covering[covering.length - 1];

  const started = store.versions
    .filter((v) => v.startDate && v.startDate <= asOf)
    .sort((a, b) => a.number - b.number);
  if (started.length) return started[started.length - 1];

  return store.versions.find((v) => v.id === store.currentId) || store.versions[store.versions.length - 1];
}

function getCurrentConfigVersion(store = getConfigStore()) {
  return getVersionForDate(CONFIG_TODAY, store);
}

function getConfigVersionById(id, store = getConfigStore()) {
