                    <button type="button" class="prev-version-item" data-view-version="${v.id}">
                      ${formatVersionLabel(v)}
                    </button>
                  `
                      )
                      .join('')
              }
            </div>
          `
              : ''
          }
        </div>
      </div>
      ${feedback ? `<span class="save-feedback ${feedback.type}">${feedback.message}</span>` : ''}
    </div>

    <div class="config-layout">
      <nav class="config-subnav" aria-label="Scoring stages">
        ${SCORING_TABS.map(
          (tab) => `
          <button type="button" class="config-subnav-item ${scoringTab === tab.id ? 'is-active' : ''}" data-scoring-tab="${tab.id}">
            ${tab.label}
          </button>`
        ).join('')}
      </nav>

      <div class="config-stage-pane">
        <div class="config-criteria-card">
          <div>
            <h2>${tabLabel} pass / fail</h2>
            <p>Critical use-cases are pass / fail only. If they pass, remaining use-cases share 100% weightage. A failed critical fails the stage and the claim does not move on.</p>
          </div>
          <div class="config-pass-field">
            <label for="stage-pass-pct">Pass mark</label>
            <div class="config-pass-input">
              <input type="number" id="stage-pass-pct" min="0" max="100" step="1" value="${passPct}" ${readOnly ? 'disabled' : ''} />
              <span>%</span>
            </div>
            ${
              readOnly
                ? ''
                : `<button type="button" class="btn btn-secondary" data-action="save-pass">Save pass mark</button>`
            }
          </div>
        </div>

        <div class="config-table-card">
          <div class="config-table-filters">
            <div class="filter-group">
              <label>Search</label>
              <input type="search" id="uc-search" placeholder="Search ${tabLabel} use-cases…" value="${filters.query.replace(/"/g, '&quot;')}" />
            </div>
            <div class="filter-group">
              <label>Category ${iconFilter()}</label>
              <select id="filter-category">
                <option value="all">All categories</option>
                ${RISK_CATEGORIES.map((c) => `<option value="${c.id}" ${filters.riskCategory === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="config-table-wrap">
            <table class="config-table">
              <thead>
                <tr>
                  <th class="col-menu"></th>
                  <th>Use-case no.</th>
                  <th>Use-case name</th>
                  <th>Use-case description</th>
                  <th>Category</th>
                  <th>Weightage</th>
                </tr>
              </thead>
              <tbody>
                ${
                  rows.length === 0
                    ? `<tr><td colspan="6" class="empty-cell">No use-cases in ${tabLabel} yet. Add one to start scoring this stage.</td></tr>`
                    : rows
                        .map((u) => {
                          const catClass = `cat-${u.riskCategory}`;
                          return `
                    <tr>
                      <td class="col-menu">
                        ${
                          readOnly
                            ? ''
                            : `
                          <div class="row-menu-wrap">
                            <button type="button" class="row-menu-btn" data-menu="${u.id}" aria-label="Actions">${iconDots()}</button>
                            ${
                              openMenuId === u.id
                                ? `
                              <div class="row-menu">
                                <button type="button" data-edit="${u.id}">Edit category / weightage</button>
                                <button type="button" class="danger" data-delete="${u.id}">Delete use-case</button>
                              </div>
                            `
                                : ''
                            }
                          </div>
                        `
                        }
                      </td>
                      <td><span class="check-code">${u.code}</span></td>
                      <td class="uc-name">${u.name}</td>
                      <td class="uc-desc">${u.description || '—'}</td>
                      <td><span class="cat-pill ${catClass}">${categoryLabel(u.riskCategory)}</span></td>
                      <td class="uc-weight">${isCriticalUseCase(u) ? 'Pass / fail' : `${u.weight ?? 0}%`}</td>
                    </tr>
                  `;
                        })
                        .join('')
                }
              </tbody>
            </table>
          </div>
          <div class="config-weight-footer ${weightFooterOk ? 'is-ok' : 'is-warn'}">
            <span>Stage weightage</span>
            <strong>${weightedRows.length === 0 ? '—' : `${weightTotal}% / 100%`}</strong>
            <small>${
              weightedRows.length === 0
                ? 'Critical use-cases have no weight. This stage is pass / fail on critical checks only.'
                : weightTotal === 100
                  ? 'Remaining (non-critical) weights add up to 100%.'
                  : 'Remaining use-cases in this stage should add to 100%.'
            }</small>
          </div>
        </div>
      </div>
    </div>

    ${renderModalHtml(view.useCases)}
  `;

  root.innerHTML = renderShell(session, '#/config', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
  bindConfigEvents(root, session, view.useCases);
}

function renderModalHtml(currentUseCases) {
  if (!modal) return '';

  const draft = modal.draft || defaultVersionDates();
  const step = modal.step || 'form';

  if (step === 'version-dates') {
    const summary =
      modal.type === 'delete'
        ? `Delete use-case from configuration`
        : modal.type === 'add'
          ? `Add ${draft.code || ''} ${draft.name || 'use-case'}`
          : modal.type === 'pass'
            ? `Set ${stageName(scoringTab)} pass mark to ${draft.passPct}%`
              : `Update ${draft.code || ''} ${draft.name || 'use-case'}`;
    return `
      <div class="modal-backdrop" data-action="close-modal">
        <div class="modal-card modal-card-wide" onclick="event.stopPropagation()">
          <h2>Create new version</h2>
          ${versionNoticeHtml()}
          <p class="modal-copy"><strong>Change:</strong> ${summary}</p>
          ${versionDateFieldsHtml(draft)}
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="back-form-step">Back</button>
            <button type="button" class="btn btn-primary" data-action="confirm-version" ${hasCompleteVersionDates(draft) ? '' : 'disabled'}>
              Create version
            </button>
          </div>
        </div>
      </div>
    `;
  }

  if (modal.type === 'delete') {
    const uc = currentUseCases.find((u) => u.id === modal.useCaseId);
    return `
      <div class="modal-backdrop" data-action="close-modal">
        <div class="modal-card modal-card-wide" onclick="event.stopPropagation()">
          <h2>Delete use-case?</h2>
          <div class="version-notice" role="status">Your changes will be saved as a new version.</div>
          <p class="modal-copy">Remove <strong>${uc?.code} ${uc?.name}</strong> from the configuration? You’ll set the new version’s start and end dates next.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-danger" data-action="continue-version-dates">Continue</button>
          </div>
        </div>
      </div>
    `;
  }

  if (modal.type === 'pass') {
    return `
      <div class="modal-backdrop" data-action="close-modal">
        <div class="modal-card modal-card-wide" onclick="event.stopPropagation()">
          <h2>Save pass mark</h2>
          <div class="version-notice" role="status">Your changes will be saved as a new version.</div>
          <p class="modal-copy">${stageName(scoringTab)} will pass at ${draft.passPct}%.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
            <button type="button" class="btn btn-primary" data-action="continue-version-dates">Continue</button>
          </div>
        </div>
      </div>
    `;
  }

  const isAdd = modal.type === 'add';
  const selectedDef = draft.id ? USE_CASE_LIBRARY.find((d) => d.id === Number(draft.id)) : null;
  const selectedEnabled = selectedDef ? isTenantEnabledUseCase(selectedDef) : false;
  const isLockedSelection = isAdd && selectedDef && !selectedEnabled;
  const draftCritical = (draft.riskCategory || selectedDef?.riskCategory) === 'critical';

  let primaryLabel = 'Continue';
  let primaryAction = 'continue-version-dates';
  let primaryDisabled = false;
  let primaryClass = 'btn btn-primary';

  if (isAdd) {
    if (!selectedDef) {
      primaryLabel = 'Add Use-Case';
      primaryDisabled = true;
    } else if (isLockedSelection) {
      primaryLabel = 'Raise a Request';
      primaryAction = 'raise-request';
      primaryClass = 'btn btn-primary btn-request';
    } else {
      primaryLabel = 'Add Use-Case';
    }
  }

  return `
    <div class="modal-backdrop" data-action="close-modal">
      <div class="modal-card modal-card-wide" onclick="event.stopPropagation()">
        <h2>${isAdd ? 'Add use-case' : 'Edit use-case'}</h2>
        ${
          isLockedSelection
            ? `<p class="modal-copy">This use-case is not enabled for your organisation. Raise a request to Azentio to enable it.</p>`
            : `<div class="version-notice" role="status">Your changes will be saved as a new version.</div>
               <p class="modal-copy">${isAdd ? 'Select an available (green) use-case and set category / weightage.' : 'Update category or weightage.'}</p>`
        }

        ${
          isAdd
            ? useCasePickerHtml(currentUseCases, draft)
            : `
        <div class="field">
          <label>Use-case</label>
          <div class="value-readonly"><span class="check-code">${draft.code}</span> ${draft.name}</div>
        </div>`
        }

        <div class="field">
          <label>Description</label>
          <textarea id="modal-desc" rows="3" readonly>${(draft.description || selectedDef?.description || '').replace(/</g, '&lt;')}</textarea>
        </div>

        ${
          isLockedSelection
            ? ''
            : `
        <div class="field-row">
          <div class="field">
            <label>Stage</label>
            <select id="modal-stage" ${isAdd && !selectedDef ? 'disabled' : ''}>
              ${CLAIM_STAGES.map((s) => `<option value="${s.id}" ${(draft.stage || selectedDef?.stage || scoringTab) === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Category</label>
            <select id="modal-category" ${isAdd && !selectedDef ? 'disabled' : ''}>
              ${RISK_CATEGORIES.map((c) => `<option value="${c.id}" ${(draft.riskCategory || selectedDef?.riskCategory || 'high') === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Weightage %</label>
            ${
              draftCritical
                ? `<div class="value-readonly">Pass / fail — no weightage</div>`
                : `<input type="number" id="modal-weight" min="0" max="100" step="1"
              value="${draft.weight ?? selectedDef?.weight ?? 0}"
              ${isAdd && !selectedDef ? 'disabled' : ''} />`
            }
          </div>
        </div>
        `
        }

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button>
          <button type="button" class="${primaryClass}" data-action="${primaryAction}" ${primaryDisabled ? 'disabled' : ''}>${primaryLabel}</button>
        </div>
      </div>
    </div>
  `;
}

function bindConfigEvents(root, session, currentUseCases) {
  const rerender = () => renderConfig(root, session);

  root.querySelectorAll('[data-scoring-tab]').forEach((btn) => {
    btn.addEventListener('click', () => {
      scoringTab = btn.dataset.scoringTab;
      openMenuId = null;
      filters.query = '';
      rerender();
    });
  });

  root.querySelector('#uc-search')?.addEventListener('input', (e) => {
    filters.query = e.target.value;
    rerender();
  });
  root.querySelector('#filter-category')?.addEventListener('change', (e) => {
    filters.riskCategory = e.target.value;
    rerender();
  });

  root.querySelector('[data-action="toggle-prev"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    prevVersionsOpen = !prevVersionsOpen;
    openMenuId = null;
    rerender();
  });

  root.querySelectorAll('[data-view-version]').forEach((btn) => {
    btn.addEventListener('click', () => {
      viewingVersionId = Number(btn.dataset.viewVersion);
      prevVersionsOpen = false;
      feedback = null;
      rerender();
    });
  });

  root.querySelector('[data-action="back-current"]')?.addEventListener('click', () => {
    viewingVersionId = null;
    feedback = null;
    rerender();
  });

  root.querySelector('[data-action="add-uc"]')?.addEventListener('click', () => {
    openMenuId = null;
    ucPickerOpen = false;
    modal = {
      type: 'add',
      step: 'form',
      draft: { riskCategory: 'high', weight: 0, stage: scoringTab, ...defaultVersionDates() },
    };
    rerender();
  });

  root.querySelector('[data-action="save-pass"]')?.addEventListener('click', () => {
    const raw = Number(root.querySelector('#stage-pass-pct')?.value);
    if (!Number.isFinite(raw) || raw < 0 || raw > 100) {
      feedback = { type: 'error', message: 'Enter a pass mark between 0 and 100.' };
      rerender();
      return;
    }
    modal = {
      type: 'pass',
      step: 'form',
      draft: { passPct: Math.round(raw), ...defaultVersionDates() },
    };
    rerender();
  });

  root.querySelectorAll('[data-menu]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.menu);
      openMenuId = openMenuId === id ? null : id;
      prevVersionsOpen = false;
      rerender();
    });
  });

  root.querySelectorAll('[data-edit]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.edit);
      const uc = currentUseCases.find((u) => u.id === id);
      openMenuId = null;
      ucPickerOpen = false;
      modal = { type: 'edit', step: 'form', useCaseId: id, draft: { ...uc, ...defaultVersionDates() } };
      rerender();
    });
  });

  root.querySelectorAll('[data-delete]').forEach((btn) => {
    btn.addEventListener('click', () => {
      openMenuId = null;
      ucPickerOpen = false;
      modal = {
        type: 'delete',
        step: 'form',
        useCaseId: Number(btn.dataset.delete),
        draft: defaultVersionDates(),
      };
      rerender();
    });
  });

  root.querySelectorAll('[data-action="close-modal"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      modal = null;
      ucPickerOpen = false;
      rerender();
    });
  });

  root.querySelector('[data-action="toggle-uc-picker"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    ucPickerOpen = !ucPickerOpen;
    rerender();
  });

  root.querySelectorAll('[data-pick-uc]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.pickUc);
      const def = USE_CASE_LIBRARY.find((d) => d.id === id);
      if (!def) return;
      modal.draft = {
        ...(modal.draft || {}),
        id: def.id,
        code: checkCode(def.id),
        name: def.name,
        description: def.description,
        stage: scoringTab,
        riskCategory: def.riskCategory,
        hardFail: isCriticalUseCase(def),
        weight: isCriticalUseCase(def) ? 0 : def.weight ?? 0,
        startDate: '',
        endDate: '',
        dateError: null,
      };
      ucPickerOpen = false;
      rerender();
    });
  });

  function captureFormDraft() {
    const stage = root.querySelector('#modal-stage')?.value;
    const riskCategory = root.querySelector('#modal-category')?.value;
    const weightRaw = root.querySelector('#modal-weight')?.value;
    const critical = riskCategory === 'critical';
    const weight = critical
      ? 0
      : weightRaw === '' || weightRaw == null
        ? modal.draft?.weight ?? 0
        : parseInt(weightRaw, 10);
    modal.draft = {
      ...(modal.draft || {}),
      stage: stage || modal.draft?.stage || scoringTab,
      riskCategory: riskCategory || modal.draft?.riskCategory,
      hardFail: critical,
      weight: Number.isFinite(weight) ? weight : modal.draft?.weight ?? 0,
      dateError: null,
    };
  }

  root.querySelector('#modal-category')?.addEventListener('change', () => {
    captureFormDraft();
    rerender();
  });

  root.querySelector('[data-action="continue-version-dates"]')?.addEventListener('click', () => {
    if (modal.type === 'add') {
      const id = Number(modal.draft?.id);
      const def = USE_CASE_LIBRARY.find((d) => d.id === id);
      if (!def || !isTenantEnabledUseCase(def)) {
        feedback = { type: 'error', message: 'Select an available (green) use-case to add.' };
        rerender();
        return;
      }
      captureFormDraft();
      if (!isCriticalUseCase(modal.draft) && (!Number.isFinite(modal.draft.weight) || modal.draft.weight < 0)) {
        feedback = { type: 'error', message: 'Enter a whole-number weightage.' };
        rerender();
        return;
      }
    } else if (modal.type === 'edit') {
      captureFormDraft();
      if (!isCriticalUseCase(modal.draft) && (!Number.isFinite(modal.draft.weight) || modal.draft.weight < 0)) {
        feedback = { type: 'error', message: 'Enter a whole-number weightage.' };
        rerender();
        return;
      }
    } else if (modal.type === 'delete') {
      const uc = currentUseCases.find((u) => u.id === modal.useCaseId);
      modal.draft = {
        ...(modal.draft || defaultVersionDates()),
        code: uc?.code,
        name: uc?.name,
        dateError: null,
      };
    }
    modal.step = 'version-dates';
    ucPickerOpen = false;
    rerender();
  });

  root.querySelector('[data-action="back-form-step"]')?.addEventListener('click', () => {
    const dates = readVersionDates(root);
    modal.draft = {
      ...(modal.draft || {}),
      startDate: dates.startDate || '',
      endDate: dates.endDate || '',
      dateError: null,
    };
    modal.step = 'form';
    rerender();
  });

  const syncVersionDateDraft = () => {
    const dates = readVersionDates(root);
    modal.draft = {
      ...(modal.draft || {}),
      startDate: dates.startDate || '',
      endDate: dates.endDate || '',
      dateError: null,
    };
    const btn = root.querySelector('[data-action="confirm-version"]');
    if (btn) btn.disabled = !hasCompleteVersionDates(modal.draft);
  };

  root.querySelector('#modal-start-date')?.addEventListener('change', syncVersionDateDraft);
  root.querySelector('#modal-end-date')?.addEventListener('change', syncVersionDateDraft);
  root.querySelector('#modal-start-date')?.addEventListener('input', syncVersionDateDraft);
  root.querySelector('#modal-end-date')?.addEventListener('input', syncVersionDateDraft);

  root.querySelector('[data-action="confirm-version"]')?.addEventListener('click', () => {
    const dates = readVersionDates(root);
    const dateError = validateVersionDates(dates);
    if (dateError) {
      modal.draft = {
        ...(modal.draft || {}),
        startDate: dates.startDate || '',
        endDate: dates.endDate || '',
        dateError,
      };
      rerender();
      return;
    }

    if (modal.type === 'add') {
      const def = USE_CASE_LIBRARY.find((d) => d.id === Number(modal.draft?.id));
      if (!def || !isTenantEnabledUseCase(def)) {
        feedback = { type: 'error', message: 'Select an available (green) use-case to add.' };
        modal = null;
        rerender();
        return;
      }
      applyMutation((list) => [
        ...list,
        {
          id: def.id,
          code: checkCode(def.id),
          name: def.name,
          description: def.description,
          stage: modal.draft.stage || scoringTab || def.stage,
          riskCategory: modal.draft.riskCategory || def.riskCategory,
          hardFail: (modal.draft.riskCategory || def.riskCategory) === 'critical',
          weight: (modal.draft.riskCategory || def.riskCategory) === 'critical' ? 0 : modal.draft.weight ?? def.weight ?? 0,
        },
      ], dates);
    } else if (modal.type === 'edit') {
      const id = modal.useCaseId;
      applyMutation(
        (list) =>
          list.map((u) => {
            if (u.id !== id) return u;
            return {
              ...u,
              stage: modal.draft.stage || u.stage,
              riskCategory: modal.draft.riskCategory || u.riskCategory,
              hardFail: (modal.draft.riskCategory || u.riskCategory) === 'critical',
              weight: (modal.draft.riskCategory || u.riskCategory) === 'critical' ? 0 : modal.draft.weight ?? u.weight ?? 0,
            };
          }),
        dates
      );
    } else if (modal.type === 'delete') {
      const id = modal.useCaseId;
      applyMutation((list) => list.filter((u) => u.id !== id), dates);
    } else if (modal.type === 'pass') {
      const current = getCurrentConfigVersion();
      const nextPass = { ...DEFAULT_STAGE_PASS, ...(current.stagePassPct || {}), [scoringTab]: modal.draft.passPct };
      applyMutation((list) => list, dates, { stagePassPct: nextPass });
    }

    modal = null;
    ucPickerOpen = false;
    rerender();
  });

  root.querySelector('[data-action="raise-request"]')?.addEventListener('click', () => {
    const def = USE_CASE_LIBRARY.find((d) => d.id === Number(modal?.draft?.id));
    feedback = {
      type: 'success',
      message: def
        ? `Request raised for ${checkCode(def.id)} — ${def.name}. Azentio will follow up to enable it.`
        : 'Request raised. Azentio will follow up.',
    };
    modal = null;
    ucPickerOpen = false;
    rerender();
  });

  root.querySelector('.uc-picker-menu')?.addEventListener('click', (e) => e.stopPropagation());

  root.querySelector('.main')?.addEventListener(
    'click',
    () => {
      if (openMenuId != null || prevVersionsOpen || ucPickerOpen) {
        openMenuId = null;
        prevVersionsOpen = false;
        ucPickerOpen = false;
        rerender();
      }
    },
    { once: true }
  );
}

/* ===== js/views/report.js ===== */
function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function sampleNote(claim) {
  const pending = getPendingExceptions(claim).length;
  if (pending) return `${pending} pending exception${pending === 1 ? '' : 's'}`;
  if (claim.forcedRed) return 'Critical fail override';
  if (claim.hasOverride) return 'Override (waived)';
  if (claim.summary?.failCount) return `${claim.summary.failCount} failed check${claim.summary.failCount === 1 ? '' : 's'}`;
  return '—';
}

function csvEscape(value) {
  const s = String(value ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function downloadCsv(filename, rows) {
  const csv = rows.map((r) => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exceptionSample(universe, state) {
  let rows = universe;
  if (state.sampleCheckId) {
    const id = Number(state.sampleCheckId);
    rows = rows.filter((c) => (c.results || []).some((r) => r.checkId === id && r.state === 'fail'));
    if (state.sampleTier === 'red') rows = rows.filter((c) => c.tier === 'red');
    if (state.sampleTier === 'yellow') rows = rows.filter((c) => c.tier === 'yellow');
    if (state.sampleTier === 'green') rows = rows.filter((c) => c.tier === 'green');
  } else {
    rows = rows.filter((c) => c.tier === 'red' || c.forcedRed);
  }
  if (state.samplePendingOnly) rows = rows.filter((c) => getPendingExceptions(c).length > 0);
  rows = [...rows].sort((a, b) => b.amount - a.amount);
  return { total: rows.length, rows: rows.slice(0, 20) };
}

function sampleCaption(state, shown, total) {
  if (state.sampleCheckId) {
    return `${shown} of ${total} claims where this check failed in this slice · sorted by value`;
  }
  return `${shown} of ${total} high-risk claims in this slice · sorted by value`;
}

function versionChangeSummary(version) {
  return version?.summary || version?.comments || version?.action || '—';
}

let keepVersionSearchFocus = false;

function claimVersionGroups(claims) {
  return [...claims]
    .map((claim) => {
      const versions = getClaimVersions(claim);
      const latest = versions[versions.length - 1] || null;
      return { claim, versions, latest };
    })
    .filter((g) => g.versions.length)
    .sort((a, b) => {
      const key = (g) => `${g.latest?.date || ''}T${g.latest?.time || '00:00'}`;
      const byWhen = key(b).localeCompare(key(a));
      if (byWhen) return byWhen;
      return String(a.claim.id).localeCompare(String(b.claim.id));
    });
}

function renderReport(root, session, claims, state, onChange) {
  if (!canAccess(session.role, 'report')) {
    location.hash = '#/queue';
    return;
  }

  const barFilters = {
    period: state.period,
    branch: state.branch,
    claimType: state.claimType,
    stage: state.stage,
    tier: state.tier,
    from: state.from,
    to: state.to,
  };
  const universe = filterClaimUniverse(claims, barFilters);
  const range = resolvePeriodRange(state.period, { from: state.from, to: state.to });
  const metrics = snapshotMetrics(universe);
  const empty = universe.length === 0;

  const byStage = WORKFLOW_STAGES.map((st) => {
    const rows = universe.filter((c) => getClaimWorkflowStage(c) === st.id);
    const red = rows.filter((c) => c.tier === 'red').length;
    return {
      ...st,
      count: rows.length,
      highRiskPct: rows.length ? Math.round((red / rows.length) * 100) : 0,
    };
  });

  const byType = CLAIM_TYPE_OPTIONS.filter((t) => t.id !== 'all').map((t) => {
    const rows = universe.filter((c) => c.claimType === t.id);
    return {
      ...t,
      count: rows.length,
      value: rows.reduce((sum, c) => sum + c.amount, 0),
    };
  });

  const showBranchBreak = state.branch === 'All branches';
  const byBranch = showBranchBreak
    ? BRANCHES.filter((b) => b !== 'All branches').map((name) => {
        const rows = universe.filter((c) => c.branch === name);
        return { name, count: rows.length, value: rows.reduce((sum, c) => sum + c.amount, 0) };
      })
    : [];

  let failStats = useCaseFailStats(universe);
  if (state.ucStage && state.ucStage !== 'all') {
    failStats = failStats.filter((s) => s.stage === state.ucStage);
  }
  if (state.ucHardFailOnly) failStats = failStats.filter((s) => s.hardFail);
  const ranked = failStats.filter((s) => s.fail > 0).slice(0, 15);

  const sample = exceptionSample(universe, state);
  const versionGroups = claimVersionGroups(universe);
  const versionQuery = String(state.versionQuery || '').trim().toLowerCase();
  const visibleGroups = versionQuery
    ? versionGroups.filter(({ claim }) => {
        const blob = `${claim.id} ${claim.fnolNumber || ''} ${claim.claimant || ''} ${claim.branch || ''}`.toLowerCase();
        return blob.includes(versionQuery);
      })
    : versionGroups;
  const historyClaim = state.historyClaimId
    ? claims.find((c) => c.id === state.historyClaimId) || null
    : null;

  const scope = describeClaimScope(universe, barFilters, { includeValue: true });

  const content = `
    <div class="page-header">
      <div>
        <h1>Report</h1>
        <p class="page-subtitle">Filtered management snapshot · prototype today ${formatDate('2026-08-11')}</p>
      </div>
      <button type="button" class="btn btn-secondary" data-action="export-report">Export report</button>
    </div>

    <div class="report-sticky-bar">
      <div class="filters-bar">
        <div class="filter-group">
          <label for="report-period">Date range</label>
          <select id="report-period">
            ${PERIOD_PRESETS.map(
              (p) => `<option value="${p.id}" ${state.period === p.id ? 'selected' : ''}>${p.label}</option>`
            ).join('')}
          </select>
        </div>
        <div class="filter-group">
          <label for="report-from">Start date</label>
          <input id="report-from" type="date" value="${esc(state.from || range.from)}" />
        </div>
        <div class="filter-group">
          <label for="report-to">End date</label>
          <input id="report-to" type="date" value="${esc(state.to || range.to)}" />
        </div>
        <div class="filter-group">
          <label for="report-branch">Branch</label>
          <select id="report-branch">
            ${BRANCHES.map((b) => `<option value="${b}" ${state.branch === b ? 'selected' : ''}>${b}</option>`).join('')}
          </select>
        </div>
        <div class="filter-group">
          <label for="report-type">Claim type</label>
          <select id="report-type">
            ${CLAIM_TYPE_OPTIONS.map(
              (t) => `<option value="${t.id}" ${state.claimType === t.id ? 'selected' : ''}>${t.label}</option>`
            ).join('')}
          </select>
        </div>
        <div class="filter-group">
          <label for="report-stage">Stage</label>
          <select id="report-stage">
            <option value="all" ${state.stage === 'all' ? 'selected' : ''}>All stages</option>
            ${WORKFLOW_STAGES.map(
              (s) => `<option value="${s.id}" ${state.stage === s.id ? 'selected' : ''}>${s.name}</option>`
            ).join('')}
          </select>
        </div>
        <div class="filter-group">
          <label for="report-tier">Tier</label>
          <select id="report-tier">
            <option value="all" ${state.tier === 'all' ? 'selected' : ''}>All</option>
            <option value="red" ${state.tier === 'red' ? 'selected' : ''}>High risk</option>
          </select>
        </div>
      </div>
      <p class="scope-line">${esc(scope)}</p>
    </div>

    <div class="stat-tiles report-scorecard">
      <div class="stat-tile">
        <div class="label">Claims scored</div>
        <div class="value">${metrics.count}</div>
        <div class="sub">Report universe</div>
      </div>
      <div class="stat-tile">
        <div class="label">Total value</div>
        <div class="value" style="font-size:1.2rem">${formatAED(metrics.value)}</div>
        <div class="sub">Sum of claim amounts</div>
      </div>
      <div class="stat-tile">
        <div class="label">High-risk rate</div>
        <div class="value">${metrics.highRiskRate}%</div>
        <div class="sub">${formatAED(metrics.redValue)} · ${metrics.redCount} claims</div>
      </div>
      <div class="stat-tile">
        <div class="label">Failed checks</div>
        <div class="value">${metrics.failRate}%</div>
        <div class="sub">${metrics.failCount} claims with a fail</div>
      </div>
      <div class="stat-tile">
        <div class="label">Exceptions</div>
        <div class="value" style="font-size:1.05rem">${metrics.hardFails} · ${metrics.waived} · ${metrics.pending}</div>
        <div class="sub">Critical · waived · pending</div>
      </div>
    </div>

    ${
      empty
        ? `<div class="empty-state">No claims in this slice</div>`
        : `
    <div class="panel">
      <div class="panel-header"><h2>Composition</h2></div>
      <div class="report-compose">
        <div>
          <h3 class="compose-title">By stage</h3>
          ${byStage
            .map(
              (st) => `
            <div class="compose-row">
              <span>${st.name}</span>
              <strong>${st.count}</strong>
              <span class="muted">${st.highRiskPct}% high risk</span>
            </div>`
            )
            .join('')}
        </div>
        <div>
          <h3 class="compose-title">By claim type</h3>
          ${byType
            .map(
              (t) => `
            <div class="compose-row">
              <span>${t.label}</span>
              <strong>${t.count}</strong>
              <span class="muted">${formatAED(t.value)}</span>
            </div>`
            )
            .join('')}
        </div>
        ${
          showBranchBreak
            ? `<div>
          <h3 class="compose-title">By branch</h3>
          ${byBranch
            .map(
              (b) => `
            <div class="compose-row">
              <span>${b.name}</span>
              <strong>${b.count}</strong>
              <span class="muted">${formatAED(b.value)}</span>
            </div>`
            )
            .join('')}
        </div>`
            : ''
        }
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Use-case fail ranking</h2>
        <button type="button" class="btn btn-sm btn-ghost" data-action="reset-uc">Reset section</button>
      </div>
      <div class="section-chips">
        <button type="button" class="chip ${state.ucStage === 'all' ? 'active' : ''}" data-uc-stage="all">All stages</button>
        ${WORKFLOW_STAGES.map(
          (s) =>
            `<button type="button" class="chip ${state.ucStage === s.id ? 'active' : ''}" data-uc-stage="${s.id}">${s.name}</button>`
        ).join('')}
        <button type="button" class="chip ${state.ucHardFailOnly ? 'active' : ''}" data-uc-hard="1">Critical only</button>
      </div>
      ${
        ranked.length === 0
          ? `<div class="chart-empty">No failed use-cases in this slice.</div>`
          : `<div class="usecase-fail-list">
        ${ranked
          .map(
            (row) => `
          <button type="button" class="usecase-fail-row is-button ${Number(state.sampleCheckId) === row.checkId ? 'is-selected' : ''}" data-sample-check="${row.checkId}">
            <div class="usecase-fail-meta">
              <span class="check-code">${row.code}</span>
              <div>
                <strong>${row.name}</strong>
                <small>${row.stageName}${row.hardFail ? ' · Critical' : ''} · ${row.failRate}% fail rate</small>
              </div>
            </div>
            <strong>${row.fail}</strong>
          </button>`
          )
          .join('')}
      </div>`
      }
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Exception sample</h2>
      </div>
      <div class="section-chips">
        ${
          state.sampleCheckId
            ? `<button type="button" class="chip ${state.sampleTier === 'all' ? 'active' : ''}" data-sample-tier="all">All tiers</button>`
            : ''
        }
        <button type="button" class="chip ${!state.sampleCheckId || state.sampleTier === 'red' ? 'active' : ''}" data-sample-tier="red">High risk</button>
        <button type="button" class="chip ${state.samplePendingOnly ? 'active' : ''}" data-sample-pending="1">Pending exceptions only</button>
      </div>
      <p class="scope-line">${esc(sampleCaption(state, sample.rows.length, sample.total))}</p>
      ${
        sample.rows.length === 0
          ? `<div class="chart-empty">No claims in this sample.</div>`
          : `<div class="sample-table-wrap">
        <table class="sample-table">
          <thead>
            <tr>
              <th>Claim</th>
              <th>Branch</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Score</th>
              <th>Tier</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody>
            ${sample.rows
              .map(
                (c) => `
              <tr>
                <td><a href="#/claim/${c.id}">${formatClaimRef(c)}</a></td>
                <td>${esc(c.branch)}</td>
                <td>${esc(claimTypeLabel(c.claimType))}</td>
                <td>${formatClaimAmount(c)}</td>
                <td class="mono">${formatClaimScore(c)}</td>
                <td class="claim-tier ${c.tier}">${tierLabel(c.tier, c)}</td>
                <td class="muted">${esc(sampleNote(c))}</td>
              </tr>`
              )
              .join('')}
          </tbody>
        </table>
      </div>`
      }
    </div>
    `
    }

    <div class="panel">
      <div class="panel-header">
        <h2>Claim versions</h2>
        <button type="button" class="btn btn-sm btn-secondary" data-action="export-tx" ${versionGroups.length ? '' : 'disabled'}>Export versions</button>
      </div>
      <p class="page-subtitle" style="margin:0 0 12px">One row per claim. Open versions to inspect V0–V5 without listing every change on the page.</p>
      <div class="filters-bar" style="margin-bottom:12px">
        <div class="filter-group" style="min-width:240px;flex:1">
          <label for="version-search">Find claim</label>
          <input id="version-search" type="search" placeholder="Registration, FNOL, or claimant" value="${esc(state.versionQuery || '')}" />
        </div>
      </div>
      <p class="scope-line">${visibleGroups.length} of ${versionGroups.length} claim${versionGroups.length === 1 ? '' : 's'} · sorted by last change</p>
      ${
        empty || versionGroups.length === 0
          ? `<div class="chart-empty">No claims in this snapshot.</div>`
          : visibleGroups.length === 0
            ? `<div class="chart-empty">No claims match that search.</div>`
            : `<div class="sample-table-wrap version-claim-scroll">
        <table class="sample-table version-claim-table">
          <thead>
            <tr>
              <th>Claim</th>
              <th>Claimant</th>
              <th>Stage</th>
              <th>Score</th>
              <th>Latest version</th>
              <th>Last change</th>
              <th>Changed by</th>
              <th>Versions</th>
            </tr>
          </thead>
          <tbody>
            ${visibleGroups
              .map(({ claim, versions, latest }) => {
                const stage = stageDisplayName(getClaimWorkflowStage(claim));
                const first = versions[0]?.version || 'V0';
                const last = latest?.version || first;
                const rangeLabel = first === last ? last : `${first}–${last}`;
                return `
              <tr>
                <td>
                  <a href="#/claim/${claim.id}">${formatClaimRef(claim)}</a>
                </td>
                <td>${esc(claim.claimant)}</td>
                <td>${esc(stage)}</td>
                <td class="mono">${formatClaimScore(claim)}</td>
                <td class="mono">
                  ${
                    latest
                      ? `<button type="button" class="version-link" data-open-version="${esc(claim.id)}" data-version="${esc(latest.version)}">${esc(latest.version)}</button>`
                      : '—'
                  }
                </td>
                <td>${esc(latest ? formatDate(latest.date) : '—')}</td>
                <td>${esc(latest?.user || '—')}</td>
                <td>
                  <button type="button" class="btn btn-sm btn-secondary" data-open-history="${esc(claim.id)}">${esc(rangeLabel)}</button>
                </td>
              </tr>`;
              })
              .join('')}
          </tbody>
        </table>
      </div>`
      }
    </div>
    ${historyClaim ? versionHistoryModalHtml(historyClaim) : ''}
    ${renderOpenVersionPopup(claims, state.versionKey)}
  `;

  root.innerHTML = renderShell(session, '#/report', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  const patch = (partial) => onChange({ ...state, ...partial });
  root.querySelector('#report-period')?.addEventListener('change', (e) => {
    const period = e.target.value;
    const nextRange = resolvePeriodRange(period, { from: state.from, to: state.to });
    patch({ period, from: nextRange.from, to: nextRange.to });
  });
  root.querySelector('#report-from')?.addEventListener('change', (e) => patch({ from: e.target.value, period: 'custom' }));
  root.querySelector('#report-to')?.addEventListener('change', (e) => patch({ to: e.target.value, period: 'custom' }));
  root.querySelector('#report-branch')?.addEventListener('change', (e) => patch({ branch: e.target.value }));
  root.querySelector('#report-type')?.addEventListener('change', (e) => patch({ claimType: e.target.value }));
  root.querySelector('#report-stage')?.addEventListener('change', (e) => patch({ stage: e.target.value }));
  root.querySelector('#report-tier')?.addEventListener('change', (e) => patch({ tier: e.target.value }));
  root.querySelectorAll('[data-uc-stage]').forEach((btn) => {
    btn.addEventListener('click', () => patch({ ucStage: btn.dataset.ucStage }));
  });
  root.querySelector('[data-uc-hard]')?.addEventListener('click', () => {
    patch({ ucHardFailOnly: !state.ucHardFailOnly });
  });
  root.querySelector('[data-action="reset-uc"]')?.addEventListener('click', () => {
    patch({ ucStage: 'all', ucHardFailOnly: false, sampleCheckId: null });
  });
  root.querySelectorAll('[data-sample-check]').forEach((btn) => {
    btn.addEventListener('click', () => patch({ sampleCheckId: Number(btn.dataset.sampleCheck) }));
  });
  root.querySelectorAll('[data-sample-tier]').forEach((btn) => {
    btn.addEventListener('click', () => patch({ sampleTier: btn.dataset.sampleTier }));
  });
  root.querySelector('[data-sample-pending]')?.addEventListener('click', () => {
    patch({ samplePendingOnly: !state.samplePendingOnly });
  });
  root.querySelector('#version-search')?.addEventListener('input', (e) => {
    keepVersionSearchFocus = true;
    patch({ versionQuery: e.target.value });
  });
  root.querySelectorAll('[data-open-history]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      patch({ historyClaimId: btn.dataset.openHistory, versionKey: null });
    });
  });
  root.querySelectorAll('[data-action="close-history-modal"]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      patch({ historyClaimId: null, versionKey: null });
    });
  });
  bindVersionPopup(root, claims, patch, 'versionKey');
  if (keepVersionSearchFocus) {
    keepVersionSearchFocus = false;
    const search = root.querySelector('#version-search');
    if (search) {
      search.focus();
      const end = search.value.length;
      try {
        search.setSelectionRange(end, end);
      } catch {
        /* ignore */
      }
    }
  }

  root.querySelector('[data-action="export-report"]')?.addEventListener('click', () => {
    const rows = [
      ['Section', 'Metric', 'Value'],
      ['Scorecard', 'Claims scored', metrics.count],
      ['Scorecard', 'Total value', formatAED(metrics.value)],
      ['Scorecard', 'High-risk rate', `${metrics.highRiskRate}%`],
      ['Scorecard', 'Failed-check claims', metrics.failCount],
      ['Scorecard', 'Critical fails', metrics.hardFails],
      ['Scorecard', 'Scope', scope],
      ...byStage.map((st) => ['By stage', st.name, `${st.count} · ${st.highRiskPct}% high risk`]),
      ...byType.map((t) => ['By type', t.label, `${t.count} · ${formatAED(t.value)}`]),
      ...ranked.map((row) => ['Use-case fail', `${row.code} ${row.name}`, `${row.fail} · ${row.failRate}%`]),
      ...sample.rows.map((c) => [
        'Exception sample',
        formatClaimRef(c),
        `${formatClaimScore(c)} · ${tierLabel(c.tier, c)} · ${formatClaimAmount(c)}`,
      ]),
    ];
    downloadCsv(`claim-intel-report-${range.from}-to-${range.to}.csv`, rows);
  });

  root.querySelector('[data-action="export-tx"]')?.addEventListener('click', () => {
    const header = [
      'Registration no.',
      'FNOL no.',
      'Claimant',
      'Stage',
      'Score',
      'Version',
      'Date',
      'Changed by',
      'Change',
    ];
    const rows = [
      header,
      ...versionGroups.flatMap(({ claim, versions }) =>
        versions.map((r) => [
          claim.id,
          claim.fnolNumber || '',
          claim.claimant,
          stageDisplayName(getClaimWorkflowStage(claim)),
          formatClaimScore(claim),
          r.version,
          formatDate(r.date),
          r.user,
          versionChangeSummary(r),
        ])
      ),
    ];
    downloadCsv(`claim-intel-versions-${range.from}-to-${range.to}.csv`, rows);
  });
}

/* ===== js/app.js ===== */
const root = document.getElementById('app');

/** @type {{ scope: 'mine'|'all', sort: 'risk'|'deadline', stage: string }} */
let queueState = { scope: 'mine', sort: 'risk', stage: 'all', auditClaimId: null, versionKey: null };

/** @type {{ period: string, branch: string, chartMode: 'share'|'volume', claimType: string }} */
let dashState = { period: '30', branch: 'All branches', chartMode: 'share', claimType: 'all' };

/** @type {object} */
let reportState = {
  period: '7',
  branch: 'All branches',
  claimType: 'all',
  stage: 'all',
  tier: 'all',
  from: '2026-08-05',
  to: '2026-08-11',
  ucStage: 'all',
  ucHardFailOnly: false,
  sampleCheckId: null,
  sampleTier: 'red',
  samplePendingOnly: false,
  txPeriod: 'inherit',
  txFrom: '2026-08-05',
  txTo: '2026-08-11',
  txChangeType: 'all',
  txUser: 'all',
  versionKey: null,
  historyClaimId: null,
  versionQuery: '',
};

let claimFilter = 'all';
let claimDrawerOpen = false;
let claimStageTab = null;
let claimExceptionPanel = null;
let claimExceptionNotice = null;
let lastClaimId = null;
let weights = getWeights();
let weightDraft = { ...weights };
let configFeedback = null;

function parseRoute() {
  const hash = location.hash || '#/login';
  const path = hash.replace(/^#/, '') || '/login';
  const parts = path.split('/').filter(Boolean);
  return { parts, path };
}

function bindGlobalActions() {
  root.querySelectorAll('[data-action="logout"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      clearSession();
      destroyChart();
      location.hash = '#/login';
      render();
    });
  });
}

function render() {
  const session = getSession();
  const { parts } = parseRoute();
  const route = parts[0] || 'login';

  if (!session && route !== 'login') {
    renderLogin(root);
    return;
  }

  if (session && route === 'login') {
    location.hash = homeRouteForRole(session.role);
    return;
  }

  if (route === 'login') {
    destroyChart();
    renderLogin(root);
    return;
  }

  const claims = scoreAllClaims(weights);

  if (route === 'queue') {
    destroyChart();
    renderQueue(root, session, claims, queueState, (next) => {
      queueState = next;
      render();
    });
  } else if (route === 'claim') {
    destroyChart();
    const id = parts.slice(1).join('/');
    if (id !== lastClaimId) {
      lastClaimId = id;
      claimFilter = 'all';
      claimDrawerOpen = false;
      claimStageTab = session.role === 'surveyor' ? 'assessment' : 'all';
      claimExceptionPanel = null;
      claimExceptionNotice = null;
    }
    const claim = claims.find((c) => c.id === id);
    renderClaimDetail(
      root,
      session,
      claim,
      claimFilter,
      (f, opts = {}) => {
        claimFilter = f === 'cant_evaluate' ? 'fail' : f;
        claimDrawerOpen = !!opts.drawerOpen;
        if (opts.selectedStage !== undefined) claimStageTab = opts.selectedStage;
        if (opts.exceptionPanel !== undefined) claimExceptionPanel = opts.exceptionPanel;
        if (opts.exceptionNotice !== undefined) claimExceptionNotice = opts.exceptionNotice;
        render();
      },
      {
        drawerOpen: claimDrawerOpen,
        selectedStage: claimStageTab,
        exceptionPanel: claimExceptionPanel,
        exceptionNotice: claimExceptionNotice,
      }
    );
  } else if (route === 'dashboard') {
    if (!canAccess(session.role, 'dashboard')) {
      location.hash = '#/queue';
      return;
    }
    renderDashboard(root, session, claims, dashState, (next) => {
      dashState = next;
      render();
    });
  } else if (route === 'report') {
    destroyChart();
    if (!canAccess(session.role, 'report')) {
      location.hash = '#/queue';
      return;
    }
    renderReport(root, session, claims, reportState, (next) => {
      reportState = next;
      render();
    });
  } else if (route === 'config') {
    destroyChart();
    if (!canAccess(session.role, 'config')) {
      location.hash = '#/queue';
      return;
    }
    renderConfig(root, session);
    // Refresh weights from config store after config interactions
    weights = getWeights();
    weightDraft = { ...weights };
  } else {
    location.hash = session ? homeRouteForRole(session.role) : '#/login';
    return;
  }

  bindGlobalActions();
}

window.addEventListener('hashchange', () => {
  const { parts } = parseRoute();
  if (parts[0] !== 'claim') {
    claimFilter = 'all';
    claimDrawerOpen = false;
    claimStageTab = null;
    claimExceptionPanel = null;
    claimExceptionNotice = null;
    lastClaimId = null;
  }
  render();
});

if (!location.hash) {
  const session = getSession();
  location.hash = session ? homeRouteForRole(session.role) : '#/login';
} else {
  render();
}

window.addEventListener('load', render);

})();

  </script>
