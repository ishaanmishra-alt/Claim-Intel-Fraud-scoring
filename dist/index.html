<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Intel · Azentio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
:root {
  --bg: #f0f4f6;
  --surface: #ffffff;
  --surface-muted: #f5f8fa;
  --border: #d9e2e8;
  --border-strong: #c2ced6;
  --text: #16303d;
  --text-secondary: #3d5563;
  --text-muted: #6b7f8a;
  --navy: #16303d;
  --navy-deep: #0f222b;
  --navy-soft: #e7eef2;
  --accent: #1a6b7a;
  --accent-hover: #155965;
  --green: #15803d;
  --green-bg: #ecfdf3;
  --green-border: #bbf7d0;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --amber-border: #fde68a;
  --red: #b91c1c;
  --red-bg: #fef2f2;
  --red-border: #fecaca;
  --urgent: #dc2626;
  --shadow: 0 1px 2px rgba(22, 48, 61, 0.05), 0 8px 24px rgba(22, 48, 61, 0.06);
  --radius: 10px;
  --radius-sm: 6px;
  --font: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button,
input,
select {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

#app {
  min-height: 100vh;
}

/* ---------- Login ---------- */
.login-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 32px 20px;
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%, rgba(26, 107, 122, 0.12), transparent 55%),
    radial-gradient(ellipse 70% 50% at 90% 100%, rgba(22, 48, 61, 0.1), transparent 50%),
    linear-gradient(160deg, #e8eef2 0%, #f4f7f9 45%, #eef3f6 100%);
}

.login-card {
  width: min(420px, 100%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 36px 32px 28px;
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.azentio-logo {
  display: block;
  height: 28px;
  width: auto;
}

.brand-divider {
  width: 1px;
  height: 22px;
  background: var(--border-strong);
  flex-shrink: 0;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(145deg, var(--navy) 0%, var(--accent) 100%);
  display: grid;
  place-items: center;
  color: white;
  flex-shrink: 0;
}

.brand-icon svg {
  width: 22px;
  height: 22px;
}

.brand-name {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.login-helper {
  margin: 0 0 28px;
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.45;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.field input[type="text"],
.field input[type="password"],
.field input[type="number"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(13, 110, 138, 0.15);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 18px 0 22px;
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.checkbox-row input {
  width: 16px;
  height: 16px;
  accent-color: var(--navy);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--navy);
  color: white;
}

.btn-primary:hover:not(:disabled) {
  background: var(--navy-deep);
}

.btn-secondary {
  background: var(--surface);
  border-color: var(--border-strong);
  color: var(--text);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--surface-muted);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border-color: transparent;
}

.btn-ghost:hover:not(:disabled) {
  background: var(--navy-soft);
  color: var(--navy);
}

.btn-block {
  width: 100%;
}

.login-error {
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  color: var(--red);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  margin-bottom: 14px;
}

.demo-accounts {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

.demo-accounts h3 {
  margin: 0 0 10px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.demo-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.demo-chip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-muted);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}

.demo-chip:hover {
  border-color: var(--accent);
  background: var(--navy-soft);
}

.demo-chip .role {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--navy);
}

.demo-chip .creds {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-family: var(--mono);
}

/* ---------- App shell ---------- */
.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 28px;
  min-width: 0;
}

.topbar .brand-mark {
  margin: 0;
}

.topbar .azentio-logo {
  height: 24px;
}

.topbar .brand-icon {
  width: 28px;
  height: 28px;
  border-radius: 7px;
}

.topbar .brand-icon svg {
  width: 18px;
  height: 18px;
}

.topbar .brand-name {
  font-size: 1.05rem;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
}

.nav-link {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-secondary);
}

.nav-link:hover {
  background: var(--surface-muted);
  color: var(--text);
}

.nav-link.active {
  background: var(--navy-soft);
  color: var(--navy);
  font-weight: 600;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.persona-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 6px 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-muted);
}

.persona-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--navy);
  color: white;
  display: grid;
  place-items: center;
  font-size: 0.7rem;
  font-weight: 700;
}

.persona-meta {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.persona-meta .name {
  font-size: 0.8rem;
  font-weight: 600;
}

.persona-meta .role {
  font-size: 0.7rem;
  color: var(--text-muted);
}

.main {
  flex: 1;
  padding: 28px 24px 48px;
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.page-header h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.page-subtitle {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--accent);
  margin-bottom: 12px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.back-link:hover {
  text-decoration: underline;
}

/* ---------- Controls ---------- */
.segmented {
  display: inline-flex;
  padding: 3px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  gap: 2px;
}

.segmented button {
  border: none;
  background: transparent;
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 0.825rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
}

.segmented button.active {
  background: var(--surface);
  color: var(--navy);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
}

.tier-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
}

.tier-stat {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.tier-stat strong {
  color: var(--text);
  font-weight: 600;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot.red { background: var(--red); }
.dot.yellow { background: #d97706; }
.dot.green { background: var(--green); }
.dot.amber { background: #d97706; }

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.toolbar-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-right: 8px;
}

/* ---------- Claims list ---------- */
.claims-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.claim-row {
  display: grid;
  grid-template-columns: 56px 1fr auto auto auto;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  text-align: left;
  width: 100%;
}

.claim-row:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow);
}

.score-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 0.95rem;
  font-family: var(--mono);
  border: 2px solid;
}

.score-circle.sm {
  width: 40px;
  height: 40px;
  font-size: 0.85rem;
}

.score-circle.lg {
  width: 96px;
  height: 96px;
  font-size: 1.75rem;
  border-width: 3px;
}

.score-circle.red {
  color: var(--red);
  background: var(--red-bg);
  border-color: var(--red);
}

.score-circle.yellow {
  color: var(--amber);
  background: var(--amber-bg);
  border-color: #d97706;
}

.score-circle.green {
  color: var(--green);
  background: var(--green-bg);
  border-color: var(--green);
}

.claim-main {
  min-width: 0;
}

.claim-id-line {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 2px;
}

.claim-id {
  font-weight: 600;
  font-size: 0.95rem;
}

.claim-name {
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.tag.critical {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-border);
}

.tag.knockout {
  background: #f1f5f9;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.tag.override {
  background: var(--navy-soft);
  color: var(--navy);
  border: 1px solid #bfdbfe;
}

.claim-amount {
  font-weight: 600;
  font-size: 0.9rem;
  text-align: right;
  white-space: nowrap;
}

.claim-tier {
  font-size: 0.8rem;
  font-weight: 600;
  min-width: 88px;
  text-align: center;
}

.claim-tier.red { color: var(--red); }
.claim-tier.yellow { color: var(--amber); }
.claim-tier.green { color: var(--green); }

.due-badge {
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  min-width: 72px;
  text-align: right;
}

.due-badge.urgent {
  color: var(--urgent);
  font-weight: 700;
}

.empty-state {
  padding: 48px 24px;
  text-align: center;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}

/* ---------- Claim detail ---------- */
.claim-detail-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}

.claim-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
}

.meta-item label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.meta-item .value {
  font-size: 0.95rem;
  font-weight: 600;
}

.hardfail-banner {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  color: var(--red);
}

.hardfail-banner .banner-icon {
  flex-shrink: 0;
  margin-top: 2px;
}

.hardfail-banner strong {
  display: block;
  font-size: 0.95rem;
  margin-bottom: 2px;
}

.hardfail-banner p {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
  color: #991b1b;
}

.score-panel {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 22px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.score-panel-text h2 {
  margin: 0 0 6px;
  font-size: 1.15rem;
}

.score-panel-text .tier-label {
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 6px;
}

.score-panel-text .summary-line {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.result-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.result-filter {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
}

.result-filter.active {
  border-color: var(--navy);
  background: var(--navy-soft);
  color: var(--navy);
  font-weight: 600;
}

.result-filter .count {
  font-family: var(--mono);
  font-size: 0.75rem;
  margin-left: 4px;
  opacity: 0.8;
}

.checks-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.check-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.check-row.fail {
  border-left: 3px solid var(--red);
}

.check-row.cant_evaluate {
  border-left: 3px solid #d97706;
}

.check-row.pass {
  border-left: 3px solid var(--green);
}

.check-state-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin-top: 1px;
}

.check-state-icon.pass {
  background: var(--green-bg);
  color: var(--green);
}

.check-state-icon.fail {
  background: var(--red-bg);
  color: var(--red);
}

.check-state-icon.cant_evaluate {
  background: var(--amber-bg);
  color: var(--amber);
}

.check-body .check-name {
  font-weight: 600;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.check-body .evidence {
  margin: 4px 0 0;
  font-size: 0.825rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.check-weight {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  font-family: var(--mono);
  white-space: nowrap;
  padding-top: 2px;
}

/* ---------- Dashboard ---------- */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
  align-items: flex-end;
}

.filter-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.filter-group select {
  padding: 8px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  min-width: 160px;
  color: var(--text);
}

.stat-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}

.stat-tile .label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: 8px;
}

.stat-tile .value {
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--navy-deep);
}

.stat-tile .sub {
  margin-top: 4px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.panel-header h2 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
}

.risk-breakdown {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.risk-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 16px;
  align-items: center;
}

.risk-row-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 0.875rem;
}

.risk-metrics {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.risk-numbers {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;

/* ===== js/state.js ===== */


const SESSION_KEY = 'claim-intel-session';
const WEIGHTS_KEY = 'claim-intel-weights-v2';

function getSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

function setSession(user, keepSignedIn) {
  const session = {
    userId: user.id,
    username: user.username,
    name: user.name,
    role: user.role,
    initials: user.initials,
    keepSignedIn: !!keepSignedIn,
  };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
  return session;
}

function clearSession() {
  sessionStorage.removeItem(SESSION_KEY);
}

function authenticate(username, password) {
  const user = USERS.find(
    (u) => u.username.toLowerCase() === username.trim().toLowerCase() && u.password === password
  );
  return user || null;
}

function getWeights() {
  try {
    const raw = localStorage.getItem(WEIGHTS_KEY);
    if (!raw) return { ...DEFAULT_WEIGHTS };
    const parsed = JSON.parse(raw);
    return { ...DEFAULT_WEIGHTS, ...parsed };
  } catch {
    return { ...DEFAULT_WEIGHTS };
  }
}

function saveWeights(weights) {
  localStorage.setItem(WEIGHTS_KEY, JSON.stringify(weights));
}

function resetWeights() {
  localStorage.removeItem(WEIGHTS_KEY);
  return { ...DEFAULT_WEIGHTS };
}



/* ===== js/scoring.js ===== */

function scoreBand(score) {
  if (score >= 8) return 'green';
  if (score >= 5) return 'yellow';
  return 'red';
}

function scoreSoftGroup(softResults) {
  const evaluable = softResults.filter((r) => r.state !== 'cant_evaluate');
  const passed = evaluable.filter((r) => r.state === 'pass');
  const activeWeight = evaluable.reduce((sum, r) => sum + (r.weight || 0), 0);
  const earnedWeight = passed.reduce((sum, r) => sum + (r.weight || 0), 0);

  if (activeWeight === 0) {
    return { score: 6, tier: 'yellow', activeWeight: 0, earnedWeight: 0, evaluable: 0 };
  }
  const score = Math.round((earnedWeight / activeWeight) * 10);
  return {
    score: Math.min(10, Math.max(0, score)),
    tier: scoreBand(score),
    activeWeight,
    earnedWeight,
    evaluable: evaluable.length,
  };
}

/**
 * Stage-based scoring: each stage's soft weights sum to 100%.
 * Overall context score = average of evaluable stage scores.
 * Any hard-fail fail forces Red.
 */
function scoreClaim(claim, weights = DEFAULT_WEIGHTS) {
  const defById = Object.fromEntries(CHECK_DEFINITIONS.map((d) => [d.id, d]));
  const results = claim.checks.map((c) => {
    const def = defById[c.checkId];
    return {
      ...c,
      name: def.name,
      code: def.code || checkCode(def.id),
      category: def.category,
      stage: def.stage,
      hardFail: def.hardFail,
      weight: def.hardFail ? null : weights[c.checkId] ?? def.weight,
    };
  });

  const hardFails = results.filter((r) => r.hardFail && r.state === 'fail');
  const soft = results.filter((r) => !r.hardFail);
  const failedSoft = soft.filter((r) => r.state === 'fail');
  const passedSoft = soft.filter((r) => r.state === 'pass');
  const cantEval = soft.filter((r) => r.state === 'cant_evaluate');

  const stageScores = CLAIM_STAGES.map((stage) => {
    const stageResults = results.filter((r) => r.stage === stage.id);
    const stageSoft = stageResults.filter((r) => !r.hardFail);
    const stageHardFails = stageResults.filter((r) => r.hardFail && r.state === 'fail');
    const scored = scoreSoftGroup(stageSoft);
    return {
      stageId: stage.id,
      stageName: stage.name,
      ...scored,
      hardFailCount: stageHardFails.length,
      softFailCount: stageSoft.filter((r) => r.state === 'fail').length,
      cantEvaluateCount: stageSoft.filter((r) => r.state === 'cant_evaluate').length,
      checkCount: stageResults.length,
    };
  });

  const evaluableStages = stageScores.filter((s) => s.activeWeight > 0);
  let contextScore;
  if (evaluableStages.length === 0) {
    contextScore = 6;
  } else {
    contextScore = Math.round(
      evaluableStages.reduce((sum, s) => sum + s.score, 0) / evaluableStages.length
    );
  }

  const softTier = scoreBand(contextScore);
  const forcedRed = hardFails.length > 0;
  const tier = forcedRed ? 'red' : softTier;

  return {
    score: contextScore,
    tier,
    forcedRed,
    hardFails,
    results,
    stageScores,
    summary: {
      hardFailCount: hardFails.length,
      softFailCount: failedSoft.length,
      softPassCount: passedSoft.length,
      softTotal: soft.length,
      cantEvaluateCount: cantEval.length,
    },
  };
}

function scoreAllClaims(weights = DEFAULT_WEIGHTS) {
  return RAW_CLAIMS.map((claim) => {
    const scored = scoreClaim(claim, weights);
    return { ...claim, ...scored };
  });
}

/** Aggregate fail counts per use-case across a claim set */
function useCaseFailStats(claims) {
  const defById = Object.fromEntries(CHECK_DEFINITIONS.map((d) => [d.id, d]));
  const stats = CHECK_DEFINITIONS.map((def) => ({
    checkId: def.id,
    code: checkCode(def.id),
    name: def.name,
    stage: def.stage,
    hardFail: def.hardFail,
    fail: 0,
    pass: 0,
    cant_evaluate: 0,
    total: 0,
  }));
  const byId = Object.fromEntries(stats.map((s) => [s.checkId, s]));

  claims.forEach((claim) => {
    claim.results.forEach((r) => {
      const row = byId[r.checkId];
      if (!row) return;
      row.total += 1;
      row[r.state] += 1;
    });
  });

  return stats
    .map((s) => ({
      ...s,
      stageName: CLAIM_STAGES.find((st) => st.id === s.stage)?.name || s.stage,
      failRate: s.total ? Math.round((s.fail / s.total) * 100) : 0,
      category: defById[s.checkId]?.category,
    }))
    .sort((a, b) => b.fail - a.fail || b.failRate - a.failRate);
}

function tierLabel(tier) {
  if (tier === 'red') return 'High risk';
  if (tier === 'yellow') return 'Medium risk';
  return 'Pass';
}

function formatAED(amount) {
  return (
    'AED ' +
    Number(amount).toLocaleString('en-AE', {
      maximumFractionDigits: 0,
    })
  );
}

function formatDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  const dd = String(d.getDate()).padStart(2, '0');
  const mon = d.toLocaleString('en-GB', { month: 'short' });
  const yy = String(d.getFullYear()).slice(-2);
  return `${dd}-${mon}-${yy}`;
}

function sortChecksForDisplay(results) {
  const stageOrder = Object.fromEntries(CLAIM_STAGES.map((s, i) => [s.id, i]));
  const rank = (r) => {
    if (r.state === 'fail' && r.hardFail) return 0;
    if (r.state === 'fail') return 1;
    if (r.state === 'cant_evaluate') return 2;
    return 3;
  };
  return [...results].sort((a, b) => {
    const sa = stageOrder[a.stage] ?? 99;
    const sb = stageOrder[b.stage] ?? 99;
    if (sa !== sb) return sa - sb;
    const ra = rank(a);
    const rb = rank(b);
    if (ra !== rb) return ra - rb;
    if (ra === 1) return (b.weight || 0) - (a.weight || 0);
    return a.checkId - b.checkId;
  });
}

function canAccess(role, feature) {
  const matrix = {
    queue: ['claim_user', 'claim_head', 'admin'],
    claim: ['claim_user', 'claim_head', 'admin'],
    dashboard: ['claim_head', 'admin'],
    report: ['claim_head', 'admin'],
    config: ['admin'],
  };
  return (matrix[feature] || []).includes(role);
}

function homeRouteForRole(role) {
  if (role === 'admin') return '#/dashboard';
  return '#/queue';
}

function renderShell(session, active, content, { showMobileNav = true } = {}) {
  const links = [
    { hash: '#/queue', label: 'Claims', feature: 'queue' },
    { hash: '#/dashboard', label: 'Dashboard', feature: 'dashboard' },
    { hash: '#/report', label: 'Report', feature: 'report' },
    { hash: '#/config', label: 'Configuration', feature: 'config' },
  ];

  const nav = links
    .filter((l) => {
      if (l.feature === 'dashboard' || l.feature === 'report') {
        return session.role === 'claim_head' || session.role === 'admin';
      }
      if (l.feature === 'config') return session.role === 'admin';
      return true;
    })
    .map(
      (l) =>
        `<a class="nav-link ${active === l.hash ? 'active' : ''}" href="${l.hash}">${l.label}</a>`
    )
    .join('');

  return `
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          ${brandMark({ iconSize: 16, logoHeight: 24 })}
          <nav class="nav-links">${nav}</nav>
        </div>
        <div class="topbar-right">
          <div class="persona-badge" title="Active persona">
            <div class="persona-avatar">${session.initials}</div>
            <div class="persona-meta">
              <span class="name">${session.name}</span>
              <span class="role" data-role-label></span>
            </div>
          </div>
          <button class="btn btn-ghost" type="button" data-action="logout">Sign out</button>
        </div>
      </header>
      ${showMobileNav ? `<div class="mobile-nav">${nav}</div>` : ''}
      <main class="main">${content}</main>
    </div>
  `;
}

        </div>

function renderQueue(root, session, claims, state, onChange) {
  const { scope, sort } = state;
  const mine = claims.filter((c) => c.assignedTo === session.userId);
  const list = scope === 'mine' ? mine : claims;

  const sorted = [...list].sort((a, b) => {
    if (sort === 'deadline') {
      if (a.dueInDays !== b.dueInDays) return a.dueInDays - b.dueInDays;
      return a.score - b.score;
    }
    // Highest risk: red first, then yellow, then green; within tier lower score first
    const tierRank = { red: 0, yellow: 1, green: 2 };
    if (tierRank[a.tier] !== tierRank[b.tier]) return tierRank[a.tier] - tierRank[b.tier];
    if (a.score !== b.score) return a.score - b.score;
    return a.dueInDays - b.dueInDays;
  });

  const counts = {
    red: list.filter((c) => c.tier === 'red').length,
    yellow: list.filter((c) => c.tier === 'yellow').length,
    green: list.filter((c) => c.tier === 'green').length,
  };

  const title = scope === 'mine' ? 'My claims' : 'All claims';
  const subtitle =
    scope === 'mine'
      ? `${mine.length} assigned to you · already scored`
      : `${claims.length} claims in portfolio · already scored`;

  const content = `
    <div class="page-header">
      <div>
        <h1>${title} <span style="color:var(--text-muted);font-weight:500;font-size:1.1rem">(${list.length})</span></h1>
        <p class="page-subtitle">${subtitle}</p>
      </div>
      <div class="segmented" role="group" aria-label="Claim scope">
        <button type="button" data-scope="mine" class="${scope === 'mine' ? 'active' : ''}">My claims</button>
        <button type="button" data-scope="all" class="${scope === 'all' ? 'active' : ''}">All claims</button>
      </div>
    </div>

    <div class="tier-strip">
      <div class="tier-stat"><span class="dot red"></span><strong>${counts.red}</strong> High risk</div>
      <div class="tier-stat"><span class="dot yellow"></span><strong>${counts.yellow}</strong> Medium risk</div>
      <div class="tier-stat"><span class="dot green"></span><strong>${counts.green}</strong> Pass</div>
    </div>

    <div class="toolbar">
      <div>
        <span class="toolbar-label">Sort</span>
        <div class="segmented" role="group" aria-label="Sort mode">
          <button type="button" data-sort="risk" class="${sort === 'risk' ? 'active' : ''}">Highest risk</button>
          <button type="button" data-sort="deadline" class="${sort === 'deadline' ? 'active' : ''}">Deadline</button>
        </div>
      </div>
    </div>

    <div class="claims-list">
      ${
        sorted.length === 0
          ? `<div class="empty-state">No claims in this view.</div>`
          : sorted
              .map((c) => {
                const dueClass = c.dueInDays <= 2 ? 'urgent' : '';
                const dueText =
                  c.dueInDays < 0
                    ? `overdue ${Math.abs(c.dueInDays)}d`
                    : c.dueInDays === 0
                      ? 'due today'
                      : `due in ${c.dueInDays}d`;
                return `
            <button type="button" class="claim-row" data-claim-id="${c.id}">
              <div class="score-circle sm ${c.tier}">${c.score}</div>
              <div class="claim-main">
                <div class="claim-id-line">
                  <span class="claim-id">${c.id}</span>
                  ${c.forcedRed ? `<span class="tag critical">Critical fail</span>` : ''}
                </div>
                <div class="claim-name">${c.claimant}</div>
              </div>
              <div class="claim-amount">${formatAED(c.amount)}</div>
              <div class="claim-tier ${c.tier}">${tierLabel(c.tier)}</div>
              <div class="due-badge ${dueClass}">${dueText}</div>
            </button>
          `;
              })
              .join('')
      }
    </div>
  `;

  root.innerHTML = renderShell(session, '#/queue', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  root.querySelectorAll('[data-scope]').forEach((btn) => {
    btn.addEventListener('click', () => onChange({ ...state, scope: btn.dataset.scope }));
  });
  root.querySelectorAll('[data-sort]').forEach((btn) => {
    btn.addEventListener('click', () => onChange({ ...state, sort: btn.dataset.sort }));
  });
  root.querySelectorAll('[data-claim-id]').forEach((btn) => {
    btn.addEventListener('click', () => {
      location.hash = `#/claim/${btn.dataset.claimId}`;
    });
  });
}

function renderClaimDetail(root, session, claim, filter, onFilter, { drawerOpen = false } = {}) {
  if (!claim) {
    root.innerHTML = renderShell(
      session,
      '#/queue',
      `<div class="empty-state">Claim not found. <a href="#/queue">Back to queue</a></div>`
    );
    root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];
    return;
  }

  const isClaimUser = session.role === 'claim_user';
  const sorted = sortChecksForDisplay(claim.results);
  const counts = {
    all: claim.results.length,
    pass: claim.results.filter((r) => r.state === 'pass').length,
    fail: claim.results.filter((r) => r.state === 'fail').length,
    cant_evaluate: claim.results.filter((r) => r.state === 'cant_evaluate').length,
  };

  const filtered =
    filter === 'all' ? sorted : sorted.filter((r) => r.state === filter);

  const s = claim.summary;
  const summaryLine = [
    s.hardFailCount
      ? `${s.hardFailCount} critical fail${s.hardFailCount > 1 ? 's' : ''}`
      : null,
    `${s.softFailCount} of ${s.softTotal} soft checks failed`,
    s.cantEvaluateCount ? `${s.cantEvaluateCount} could not be evaluated` : null,
  ]
    .filter(Boolean)
    .join(' · ');

  const hardFailNames = claim.hardFails.map((h) => `${checkCode(h.checkId)} ${h.name}`).join('; ');

  const checksByStage = CLAIM_STAGES.map((stage) => {
    const items = filtered.filter((r) => r.stage === stage.id);
    return { stage, items };
  }).filter((g) => g.items.length > 0);

  const content = `
    <button type="button" class="back-link" data-action="back">${iconBack()} Back to claims</button>

      <div class="claim-detail-grid">

        </div>
        <div class="meta-item">
          <label>Policy number</label>
          <div class="value">${claim.policyNumber}</div>
        </div>
        <div class="meta-item">
          <label>Claimant</label>
          <div class="value">${claim.claimant}</div>
        </div>
        <div class="meta-item">
          <label>Claim amount</label>
          <div class="value">${formatAED(claim.amount)}</div>
        </div>
        ${
          isClaimUser
            ? ''
            : `<div class="meta-item">
          <label>Assigned to</label>
          <div class="value">${claim.assignedName}</div>
        </div>`
        }
        <div class="meta-item">
          <label>Loss date</label>
          <div class="value">${formatDate(claim.lossDate)}</div>
        </div>
        <div class="meta-item">
          <label>Vehicle</label>
          <div class="value">${claim.vehicle}</div>
        </div>
      </div>
    </div>

    ${
      claim.forcedRed
        ? `
      <div class="hardfail-banner">
        <div class="banner-icon">${iconAlert()}</div>
        <div>
          <strong>Critical check failed — routed to red</strong>
          <p>${hardFailNames}. The score below is a context score only; the hard fail overrides the tier.</p>
        </div>
      </div>
    `
        : ''
    }

    <div class="score-panel">
      <div class="score-circle lg ${claim.tier}">${claim.score}</div>
      <div class="score-panel-text">
        <h2>Fraud risk score <span style="font-weight:500;color:var(--text-muted);font-size:0.9rem">/ 10</span></h2>
        <div class="tier-label ${claim.tier}" style="color:var(--${claim.tier === 'yellow' ? 'amber' : claim.tier})">${tierLabel(claim.tier)}</div>
        <p class="summary-line">${summaryLine}</p>
      </div>
    </div>

    <div class="stage-chips">
      ${(claim.stageScores || [])
        .map(
          (st) => `
        <div class="stage-chip">
          <span class="stage-chip-name">${st.stageName}</span>
          <span class="score-circle xs ${st.tier}">${st.score}</span>
        </div>
      `
        )
        .join('')}
    </div>

    <div class="result-filters">
      <button type="button" class="result-filter ${filter === 'all' ? 'active' : ''}" data-filter="all">
        All <span class="count">${counts.all}</span>
      </button>
      <button type="button" class="result-filter ${filter === 'pass' ? 'active' : ''}" data-filter="pass">

    <div class="checks-by-stage">
      ${
        checksByStage.length === 0
          ? `<div class="empty-state">No checks in this result state.</div>`

              .map(({ stage, items }) => {
                const stageScore = (claim.stageScores || []).find((x) => x.stageId === stage.id);
                return `
            <section class="stage-block">
              <div class="stage-block-header">
                <div>
                  <h3>${stage.name}</h3>
                  <p>${stage.description}</p>
                </div>
                ${

                    ? `<div class="stage-block-score"><span class="score-circle sm ${stageScore.tier}">${stageScore.score}</span></div>`

                  })
                  .join('')}
              </div>
            </section>
          `;
              })
              .join('')
      }
    </div>

    ${drawerOpen ? claimInfoDrawer(claim) : ''}
  `;

  root.innerHTML = renderShell(session, '#/queue', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  root.querySelector('[data-action="back"]').addEventListener('click', () => {
    location.hash = '#/queue';
  });
  root.querySelectorAll('[data-filter]').forEach((btn) => {
    btn.addEventListener('click', () => onFilter(btn.dataset.filter, { drawerOpen: false }));

  root.querySelectorAll('[data-action="open-drawer"]').forEach((btn) => {

  });
  root.querySelectorAll('[data-action="close-drawer"]').forEach((btn) => {
    btn.addEventListener('click', () => onFilter(filter, { drawerOpen: false }));
  });
}



/* ===== js/views/dashboard.js ===== */



let chartInstance = null;

function destroyChart() {
  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }
}

function filterClaims(claims, period, branch) {
  const today = new Date('2026-08-11T12:00:00');
  let days = 30;
  if (period === '7') days = 7;
  if (period === 'quarter') days = 90;
  const cutoff = new Date(today);
  cutoff.setDate(cutoff.getDate() - days);

  return claims.filter((c) => {
    const filed = new Date(c.filedAt + 'T12:00:00');
    if (filed < cutoff) return false;
    if (branch !== 'All branches' && c.branch !== branch) return false;
    return true;
  });
}

function drawChart(canvas, mode) {
  destroyChart();
  if (!window.Chart || !canvas) return;

  if (!TREND_HISTORY.length) {
    return;
  }

  const labels = TREND_HISTORY.map((p) => formatDate(p.date));

  if (mode === 'share') {
    chartInstance = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'High risk %',
            data: TREND_HISTORY.map((p) => p.redPct),
            borderColor: '#b91c1c',
            backgroundColor: 'transparent',
            tension: 0.25,
            pointRadius: 3,
          },
          {
            label: 'Medium risk %',
            data: TREND_HISTORY.map((p) => p.yellowPct),
            borderColor: '#d97706',
            backgroundColor: 'transparent',
            tension: 0.25,
            pointRadius: 3,
          },
          {
            label: 'Pass %',
            data: TREND_HISTORY.map((p) => p.greenPct),
            borderColor: '#15803d',
            backgroundColor: 'transparent',
            tension: 0.25,
            pointRadius: 3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {

  } else {
    chartInstance = new Chart(canvas, {

}

function renderDashboard(root, session, claims, state, onChange) {
  if (!canAccess(session.role, 'dashboard')) {
    location.hash = '#/queue';
    return;
  }

  const { period, branch, chartMode } = state;
  const filtered = filterClaims(claims, period, branch);

  const totalCount = filtered.length;
  const totalValue = filtered.reduce((s, c) => s + c.amount, 0);
  const red = filtered.filter((c) => c.tier === 'red');
  const yellow = filtered.filter((c) => c.tier === 'yellow');
  const green = filtered.filter((c) => c.tier === 'green');
  const cantEvalClaims = filtered.filter((c) => c.summary.cantEvaluateCount > 0);

  const redValue = red.reduce((s, c) => s + c.amount, 0);
  const yellowValue = yellow.reduce((s, c) => s + c.amount, 0);
  const greenValue = green.reduce((s, c) => s + c.amount, 0);

  const flaggedPct = totalCount ? Math.round((red.length / totalCount) * 100) : 0;
  const cantEvalPct = totalCount ? Math.round((cantEvalClaims.length / totalCount) * 100) : 0;

  const maxCount = Math.max(red.length, yellow.length, green.length, 1);
  const maxValue = Math.max(redValue, yellowValue, greenValue, 1);

  const hasTrend = TREND_HISTORY.length >= 2;
  const failStats = useCaseFailStats(filtered);
  const topFails = failStats.filter((s) => s.fail > 0).slice(0, 8);
  const maxFails = Math.max(...topFails.map((s) => s.fail), 1);

  const stageFailSummary = CLAIM_STAGES.map((stage) => {
    const rows = failStats.filter((s) => s.stage === stage.id);
    const fails = rows.reduce((n, r) => n + r.fail, 0);
    const total = rows.reduce((n, r) => n + r.total, 0);
    return {
      ...stage,
      fails,
      total,
      rate: total ? Math.round((fails / total) * 100) : 0,
      top: rows.slice().sort((a, b) => b.fail - a.fail)[0],
    };
  });

  const content = `
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p class="page-subtitle">Portfolio risk overview · use-case fail insight</p>
      </div>
    </div>

    <div class="filters-bar">
      <div class="filter-group">
        <label for="period">Time period</label>
        <select id="period">
          <option value="7" ${period === '7' ? 'selected' : ''}>Last 7 days</option>
          <option value="30" ${period === '30' ? 'selected' : ''}>Last 30 days</option>
          <option value="quarter" ${period === 'quarter' ? 'selected' : ''}>This quarter</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="branch">Branch / region</label>
        <select id="branch">
          ${BRANCHES.map((b) => `<option value="${b}" ${branch === b ? 'selected' : ''}>${b}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="stat-tiles">
      <div class="stat-tile">
        <div class="label">Claims scored</div>
        <div class="value">${totalCount}</div>
        <div class="sub">In selected period</div>
      </div>
      <div class="stat-tile">
        <div class="label">Total claim value</div>
        <div class="value" style="font-size:1.2rem">${formatAED(totalValue)}</div>
        <div class="sub">Sum of claim amounts</div>
      </div>
      <div class="stat-tile">
        <div class="label">Flagged high-risk</div>
        <div class="value">${flaggedPct}%</div>
        <div class="sub">${formatAED(redValue)} exposed</div>
      </div>
      <div class="stat-tile">
        <div class="label">Couldn't evaluate</div>
        <div class="value">${cantEvalPct}%</div>
        <div class="sub">Data-quality indicator</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Risk breakdown</h2>
      </div>
      <div class="risk-breakdown">
        ${[
          { key: 'red', label: 'High risk', count: red.length, value: redValue },
          { key: 'yellow', label: 'Medium risk', count: yellow.length, value: yellowValue },
          { key: 'green', label: 'Pass', count: green.length, value: greenValue },
        ]
          .map(
            (row) => `
          <div class="risk-row">
            <div class="risk-row-label"><span class="dot ${row.key}"></span>${row.label}</div>
            <div class="risk-metrics">
              <div class="risk-numbers">
                <span><strong>${row.count}</strong> claims</span>
                <span><strong>${formatAED(row.value)}</strong></span>
              </div>
              <div class="bar-track"><div class="bar-fill ${row.key}" style="width:${Math.round((row.value / maxValue) * 100)}%"></div></div>
              <div class="bar-track" style="height:5px;opacity:0.65"><div class="bar-fill ${row.key}" style="width:${Math.round((row.count / maxCount) * 100)}%;opacity:0.55"></div></div>
            </div>
          </div>
        `
          )
          .join('')}
      </div>
      <p style="margin:12px 0 0;font-size:0.75rem;color:var(--text-muted)">Bars: claim value (primary) · count (secondary)</p>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Use-case fails by stage</h2>
      </div>
      <div class="stage-fail-grid">
        ${stageFailSummary
          .map(
            (st) => `
          <div class="stage-fail-card">
            <div class="stage-fail-top">
              <strong>${st.name}</strong>
              <span>${st.fails} fails · ${st.rate}%</span>
            </div>
            <div class="bar-track"><div class="bar-fill red" style="width:${st.rate}%"></div></div>
            <p class="stage-fail-top-uc">${
              st.top && st.top.fail
                ? `Most fails: ${st.top.code} ${st.top.name} (${st.top.fail})`
                : 'No fails in period'
            }</p>
          </div>
        `
          )
          .join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Top failing use-cases</h2>
      </div>
      ${
        topFails.length === 0
          ? `<div class="chart-empty">No failed use-cases in this filter.</div>`
          : `<div class="usecase-fail-list">
        ${topFails
          .map(
            (row) => `
          <div class="usecase-fail-row">
            <div class="usecase-fail-meta">
              <span class="check-code">${row.code}</span>
              <div>
                <strong>${row.name}</strong>

            <div class="usecase-fail-bar-wrap">
              <div class="bar-track"><div class="bar-fill red" style="width:${Math.round((row.fail / maxFails) * 100)}%"></div></div>
              <strong>${row.fail}</strong>
            </div>
          </div>
        `
          )
          .join('')}
      </div>`
      }
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Risk trend</h2>
        <div class="segmented" role="group" aria-label="Chart mode">

          <button type="button" data-chart="volume" class="${chartMode === 'volume' ? 'active' : ''}">Claim volume</button>
        </div>
      </div>
      ${
        hasTrend
          ? `<div class="chart-wrap"><canvas id="trend-chart"></canvas></div>`
          : `<div class="chart-empty">Not enough history yet to show a reliable trend.</div>`
      }
    </div>
  `;

  root.innerHTML = renderShell(session, '#/dashboard', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  root.querySelector('#period').addEventListener('change', (e) => {
    onChange({ ...state, period: e.target.value });
  });
  root.querySelector('#branch').addEventListener('change', (e) => {
    onChange({ ...state, branch: e.target.value });
  });
  root.querySelectorAll('[data-chart]').forEach((btn) => {
    btn.addEventListener('click', () => onChange({ ...state, chartMode: btn.dataset.chart }));
  });

  if (hasTrend) {
    requestAnimationFrame(() => {
      const canvas = root.querySelector('#trend-chart');
      drawChart(canvas, chartMode);
    });
  } else {
    destroyChart();
  }
}




/* ===== js/views/config.js ===== */




function softForStage(stageId) {
  return CHECK_DEFINITIONS.filter((c) => c.stage === stageId && !c.hardFail);
}

function hardForStage(stageId) {
  return CHECK_DEFINITIONS.filter((c) => c.stage === stageId && c.hardFail);
}

function stageTotal(draft, stageId) {
  return softForStage(stageId).reduce((sum, c) => sum + (Number(draft[c.id]) || 0), 0);
}

function allStagesValid(draft) {
  return CLAIM_STAGES.every((s) => {
    const soft = softForStage(s.id);
    if (!soft.length) return true;
    return stageTotal(draft, s.id) === 100;
  });
}

function updateStageTotals(root, draft) {
  CLAIM_STAGES.forEach((stage) => {
    const soft = softForStage(stage.id);
    if (!soft.length) return;
    const total = stageTotal(draft, stage.id);
    const el = root.querySelector(`[data-stage-total="${stage.id}"]`);
    if (!el) return;
    el.className = `running-total ${total === 100 ? 'at-100' : 'not-100'}`;
    el.innerHTML = `${stage.name} total <span class="total-value">${total}%</span>${total === 100 ? ' · ready' : ''}`;
  });
}

function renderConfig(root, session, weights, draft, feedback, onDraftChange, onSaved) {
  if (!canAccess(session.role, 'config')) {
    location.hash = '#/queue';
    return;
  }

  const localDraft = { ...draft };
  const valid = allStagesValid(localDraft);

  let feedbackHtml = '';
  if (feedback?.type === 'error') {
    feedbackHtml = `<span class="save-feedback error">${feedback.message}</span>`;
  } else if (feedback?.type === 'success') {
    feedbackHtml = `<span class="save-feedback success">${feedback.message}</span>`;
  }

  const stageSections = CLAIM_STAGES.map((stage) => {
    const knockouts = hardForStage(stage.id);
    const soft = softForStage(stage.id);
    const total = stageTotal(localDraft, stage.id);
    return `
      <div class="config-section stage-config">
        <h2>${stage.name}</h2>
        <p class="section-desc">${stage.description}. Soft-signal weights in this stage must total exactly 100%.</p>

        ${
          knockouts.length
            ? `
          <h3 class="config-subhead">Hard-fail checks</h3>
          ${knockouts
            .map(
              (c) => `
            <div class="config-check">
              <div>
                <div class="name"><span class="check-code">${checkCode(c.id)}</span> ${c.name}</div>
              </div>
              <span class="tag override">Override</span>
            </div>
          `
            )
            .join('')}
        `
            : ''
        }

        ${
          soft.length
            ? `
          <h3 class="config-subhead">Weighted soft signals</h3>
          ${soft
            .map(
              (c) => `
            <div class="config-check">
              <div>
                <div class="name"><span class="check-code">${checkCode(c.id)}</span> ${c.name}</div>
              </div>
              <div class="weight-input-wrap">
                <input type="number" min="0" max="100" step="1" inputmode="numeric"
                  data-weight-id="${c.id}" data-stage="${stage.id}" value="${localDraft[c.id] ?? 0}" />
                <span class="pct">%</span>
              </div>
            </div>
          `
            )
            .join('')}
          <div class="running-total ${total === 100 ? 'at-100' : 'not-100'}" data-stage-total="${stage.id}">
            ${stage.name} total <span class="total-value">${total}%</span>${total === 100 ? ' · ready' : ''}
          </div>
        `
            : ''
        }
      </div>
    `;
  }).join('');

  const content = `
    <div class="page-header">
      <div>
        <h1>Configuration</h1>
        <p class="page-subtitle">Stage-based weightage · each claim stage totals 100%</p>
      </div>
    </div>

    <div class="info-banner">
      <div class="lock-icon">${iconLock()}</div>
      <div>
        <strong>Vendor-controlled use-cases</strong>
        <p>Which checks are switched on is set by Claim Intel. Soft weights are editable per stage (FNOL, Registration, Assessment, Settlement) — each stage must total 100%.</p>
      </div>
    </div>

    ${stageSections}

    <div class="config-footer">
      <div class="running-total ${valid ? 'at-100' : 'not-100'}">
        All stages ${valid ? 'at 100%' : 'must total 100%'}
      </div>
      <div class="footer-actions">
        ${feedbackHtml}
        <button type="button" class="btn btn-secondary" data-action="reset">Reset defaults</button>
        <button type="button" class="btn btn-primary" data-action="save">Save weightage</button>
      </div>
    </div>
  `;

  root.innerHTML = renderShell(session, '#/config', content);
  root.querySelector('[data-role-label]').textContent = ROLE_LABELS[session.role];

  root.querySelectorAll('[data-weight-id]').forEach((input) => {
    input.addEventListener('input', () => {
      let val = input.value;
      if (val.includes('.') || val.includes('e') || val.includes('E')) {
        val = String(Math.trunc(Number(val)) || 0);
        input.value = val;
      }
      const id = Number(input.dataset.weightId);
      const num = val === '' ? 0 : parseInt(val, 10);
      localDraft[id] = Number.isFinite(num) ? Math.max(0, num) : 0;
      onDraftChange(localDraft, null, { silent: true });
      updateStageTotals(root, localDraft);
      const footer = root.querySelector('.config-footer .running-total');
      if (footer) {
        const ok = allStagesValid(localDraft);
        footer.className = `running-total ${ok ? 'at-100' : 'not-100'}`;
        footer.textContent = `All stages ${ok ? 'at 100%' : 'must total 100%'}`;
      }
    });
  });

  root.querySelector('[data-action="save"]').addEventListener('click', () => {
    const bad = CLAIM_STAGES.find((stage) => {
      const soft = softForStage(stage.id);
      return soft.length && stageTotal(localDraft, stage.id) !== 100;
    });
    if (bad) {
      const t = stageTotal(localDraft, bad.id);
      const g = 100 - t;
      const message =
        g > 0
          ? `${bad.name} is ${t}% — add ${g}% to save`
          : `${bad.name} is ${t}% — remove ${Math.abs(g)}% to save`;
      onDraftChange(localDraft, { type: 'error', message }, { silent: true });
      const actions = root.querySelector('.footer-actions');
      let fb = actions.querySelector('.save-feedback');
      if (!fb) {
        fb = document.createElement('span');
        actions.insertBefore(fb, actions.querySelector('[data-action="reset"]'));
      }
      fb.className = 'save-feedback error';
      fb.textContent = message;
      return;
    }
    const softIds = CHECK_DEFINITIONS.filter((c) => !c.hardFail).map((c) => c.id);
    const cleaned = Object.fromEntries(softIds.map((id) => [id, Number(localDraft[id]) || 0]));
    saveWeights(cleaned);
    onSaved(cleaned, { type: 'success', message: 'Weightage saved.' });
  });

  root.querySelector('[data-action="reset"]').addEventListener('click', () => {
    const defaults = resetWeights();
    onSaved(defaults, { type: 'success', message: 'Weightage saved.' });
  });
}

const root = document.getElementById('app');

/** @type {{ scope: 'mine'|'all', sort: 'risk'|'deadline' }} */
let queueState = { scope: 'mine', sort: 'risk' };

/** @type {{ period: string, branch: string, chartMode: 'share'|'volume' }} */
let dashState = { period: '30', branch: 'All branches', chartMode: 'share' };

let claimFilter = 'all';
let claimDrawerOpen = false;
let weights = getWeights();
let weightDraft = { ...weights };
let configFeedback = null;

function getClaims() {
  return scoreAllClaims(weights);
}

function parseRoute() {
  const hash = location.hash || '#/login';
  const path = hash.replace(/^#/, '') || '/login';
  const parts = path.split('/').filter(Boolean);
  return { parts, path };
}

function bindGlobalActions() {
  root.querySelectorAll('[data-action="logout"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      clearSession();
      destroyChart();
      location.hash = '#/login';
      render();
    });
  });
}

function render() {
  const session = getSession();
  const { parts } = parseRoute();
  const route = parts[0] || 'login';

  if (!session && route !== 'login') {
    renderLogin(root);
    return;
  }

  if (session && route === 'login') {
    location.hash = homeRouteForRole(session.role);
    return;
  }

  if (route === 'login') {
    destroyChart();
    renderLogin(root);
    return;
  }

  const claims = getClaims();

  if (route === 'queue') {
    destroyChart();
    renderQueue(root, session, claims, queueState, (next) => {
      queueState = next;
      render();
    });
  } else if (route === 'claim') {
    destroyChart();
    const id = parts.slice(1).join('/');
    const claim = claims.find((c) => c.id === id);
    renderClaimDetail(root, session, claim, claimFilter, (f, opts = {}) => {
      claimFilter = f;
      claimDrawerOpen = !!opts.drawerOpen;
      render();
    }, { drawerOpen: claimDrawerOpen });
  } else if (route === 'dashboard') {
    if (!canAccess(session.role, 'dashboard')) {
      location.hash = '#/queue';
      return;
    }
    renderDashboard(root, session, claims, dashState, (next) => {
      dashState = next;
      render();
    });
  } else if (route === 'report') {
    destroyChart();
    if (!canAccess(session.role, 'report')) {
      location.hash = '#/queue';
      return;
    }
    renderReport(root, session, claims);
  } else if (route === 'config') {
    destroyChart();
    if (!canAccess(session.role, 'config')) {
      location.hash = '#/queue';
      return;
    }
    renderConfig(
      root,
      session,
      weights,
      weightDraft,
      configFeedback,
      (draft, feedback, opts = {}) => {
        weightDraft = { ...draft };
        configFeedback = feedback;
        if (!opts.silent) render();
      },
      (saved, feedback) => {
        weights = saved;
        weightDraft = { ...saved };
        configFeedback = feedback;
        render();
      }
    );
  } else {
    location.hash = session ? homeRouteForRole(session.role) : '#/login';
    return;
  }

  bindGlobalActions();
}

window.addEventListener('hashchange', () => {
  const { parts } = parseRoute();
  if (parts[0] !== 'claim') {
    claimFilter = 'all';
    claimDrawerOpen = false;
  }
  render();
});

if (!location.hash) {
  const session = getSession();
  location.hash = session ? homeRouteForRole(session.role) : '#/login';
} else {
  render();
}

window.addEventListener('load', render);


})();

  </script>
</body>
</html>
